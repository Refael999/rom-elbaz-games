<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הנחש המשפחתי 🐍</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            padding: 8px;
            touch-action: none;
        }

        h1 {
            font-size: clamp(1.2em, 4vw, 2em);
            margin-bottom: 8px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .status-pill {
            font-size: clamp(0.9em, 2.2vw, 1.15em);
            padding: 5px 16px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #00ff88;
            border-radius: 25px;
        }

        #score { color: #00ff88; font-weight: bold; }
        #current-player { color: #ffdd57; font-weight: bold; }

        #game-wrap {
            position: relative;
            /* width / height set by resizeGame() below to the largest square that fits */
            width: 300px;
            height: 300px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border: 4px solid #00ff88;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0,255,136,0.3);
            display: block;
            touch-action: none;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(10,10,26,0.95);
            border-radius: 10px;
            padding: 14px;
            overflow-y: auto;
        }

        #overlay h2 {
            font-size: clamp(1.2em, 4vw, 2em);
            color: #ffdd57;
            text-shadow: 0 0 18px #ffdd57;
            margin-bottom: 6px;
        }

        #overlay p {
            font-size: clamp(0.85em, 2.3vw, 1.1em);
            color: #ccc;
            margin-bottom: 10px;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 10px;
        }

        .player-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #1a1a2e;
            border: none;
            padding: 10px 6px;
            font-size: clamp(0.95em, 2.4vw, 1.15em);
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,136,0.3);
            transition: transform 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:hover, .player-btn:active { transform: scale(1.08); }

        .end-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #1a1a2e;
            border: none;
            padding: clamp(8px, 1.8vw, 12px) clamp(20px, 4vw, 28px);
            font-size: clamp(0.95em, 2.4vw, 1.15em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
            -webkit-tap-highlight-color: transparent;
        }

        .secondary-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            padding: clamp(8px, 1.8vw, 12px) clamp(20px, 4vw, 28px);
            font-size: clamp(0.9em, 2.2vw, 1.05em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 10px;
            padding: 8px 12px;
            margin: 6px 0 10px;
            width: 100%;
            max-width: 320px;
        }

        .leaderboard-title {
            color: #ffdd57;
            font-size: clamp(0.9em, 2.2vw, 1.05em);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .leaderboard table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 2px;
            font-size: clamp(0.85em, 2.1vw, 1em);
        }

        .leaderboard td {
            padding: 4px 6px;
            color: #ddd;
        }
        .leaderboard tr.highlight td {
            background: rgba(255,221,87,0.25);
            color: white;
        }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }

        .leaderboard td:first-child { width: 28px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #00ff88; font-weight: bold; width: 50px; }
        .leaderboard .zero td:last-child { color: #555; }

        #mute {
            position: fixed;
            top: 12px;
            left: 12px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(0,255,136,0.4);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: rgba(0,255,136,0.3); }

        #dpad {
            display: none;
            margin-top: 10px;
            grid-template-columns: 58px 58px 58px;
            grid-template-rows: 58px 58px 58px;
            gap: 5px;
            direction: ltr;
        }

        .dbtn {
            background: rgba(0,255,136,0.15);
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 1.4em;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .dbtn:active { background: rgba(0,255,136,0.5); transform: scale(0.95); }

        #dbtn-up    { grid-column: 2; grid-row: 1; }
        #dbtn-left  { grid-column: 1; grid-row: 2; }
        #dbtn-right { grid-column: 3; grid-row: 2; }
        #dbtn-down  { grid-column: 2; grid-row: 3; }

        @media (pointer: coarse), (max-width: 768px) {
            #dpad { display: grid; }
            #hint-desktop { display: none; }
        }
        @media (pointer: fine) and (min-width: 769px) {
            #hint-mobile { display: none; }
        }

        #hint {
            margin-top: 8px;
            color: rgba(255,255,255,0.45);
            font-size: 0.85em;
            text-align: center;
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק / הפעל סאונד">🔊</button>

<h1>🐍 הנחש המשפחתי 🐍</h1>

<div id="status-bar">
    <div class="status-pill">שחקן: <span id="current-player">—</span></div>
    <div class="status-pill">ניקוד: <span id="score">0</span></div>
</div>

<div id="game-wrap">
    <canvas id="c" width="640" height="640"></canvas>
    <div id="overlay"></div>
</div>

<div id="dpad">
    <button class="dbtn" id="dbtn-up">⬆️</button>
    <button class="dbtn" id="dbtn-left">⬅️</button>
    <button class="dbtn" id="dbtn-right">➡️</button>
    <button class="dbtn" id="dbtn-down">⬇️</button>
</div>

<p id="hint">
    <span id="hint-desktop">⬆️ ⬇️ ⬅️ ➡️ מקשי החצים</span>
    <span id="hint-mobile">👆 החלק או לחץ על החצים</span>
</p>

<script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const currentPlayerEl = document.getElementById('current-player');

    const G = 32;
    const COLS = Math.floor(canvas.width  / G);
    const ROWS = Math.floor(canvas.height / G);
    const STEP_MS = 120;

    // ---- Family scoreboard ----
    const PLAYERS = ['אבא', 'רום', 'בן', 'ארי', 'אמא'];
    const STORAGE_KEY = 'rom_snake_scores_v1';
    let currentPlayer = null;

    function loadScores() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
        catch { return {}; }
    }

    function saveResult(player, finalScore) {
        const scores = loadScores();
        const e = scores[player] || { best: 0, games: 0, last: 0 };
        if (finalScore > e.best) e.best = finalScore;
        e.games = (e.games || 0) + 1;
        e.last  = finalScore;
        scores[player] = e;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    }

    function leaderboardHtml(highlight = null) {
        const scores = loadScores();
        const entries = PLAYERS.map(p => ({
            name: p,
            best: scores[p]?.best || 0,
            games: scores[p]?.games || 0,
        })).sort((a, b) => b.best - a.best || a.name.localeCompare(b.name));

        const medals = ['🥇', '🥈', '🥉'];
        const rows = entries.map((e, i) => {
            const rank = e.best > 0 && i < 3 ? medals[i] : `${i + 1}.`;
            const cls  = (e.name === highlight ? 'highlight ' : '') + (e.best === 0 ? 'zero' : '');
            const clsAttr = cls.trim() ? ` class="${cls.trim()}"` : '';
            return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
        }).join('');

        return `
            <div class="leaderboard">
                <div class="leaderboard-title">🏆 טבלת השיאים המשפחתית</div>
                <table>${rows}</table>
            </div>
        `;
    }

    function showPlayerSelect() {
        currentPlayer = null;
        currentPlayerEl.textContent = '—';
        scoreEl.textContent = '0';

        const buttons = PLAYERS.map(p =>
            `<button class="player-btn" data-player="${p}">${p}</button>`
        ).join('');

        overlay.innerHTML = `
            <h2>🐍 הנחש המשפחתי</h2>
            <p>מי משחק עכשיו?</p>
            <div class="player-grid">${buttons}</div>
            ${leaderboardHtml()}
        `;
        overlay.style.display = 'flex';

        overlay.querySelectorAll('.player-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentPlayer = btn.dataset.player;
                currentPlayerEl.textContent = currentPlayer;
                start();
            });
        });
    }

    function showGameOver() {
        const scores = loadScores();
        const myBest = scores[currentPlayer]?.best || 0;
        const isNewRecord = score === myBest && score > 0;

        // Did this player become #1?
        const sorted = PLAYERS.map(p => ({ name: p, best: scores[p]?.best || 0 }))
                              .sort((a, b) => b.best - a.best);
        const isKing = sorted[0].best > 0 && sorted[0].name === currentPlayer && sorted[0].best === score;

        let headline, msg;
        if (isKing && isNewRecord) {
            headline = '👑 מלך המשפחה!';
            msg = `${currentPlayer} עלה לראש הטבלה עם ${score} בננות! 🌟`;
        } else if (isNewRecord) {
            headline = '🎉 שיא אישי חדש!';
            msg = `${currentPlayer} שבר שיא עם ${score} בננות!`;
        } else if (score >= 10) {
            headline = '🏆 משחק טוב!';
            msg = `${currentPlayer} אכל ${score} בננות. השיא שלך: ${myBest}`;
        } else {
            headline = '😢 המשחק נגמר';
            msg = `${currentPlayer} אכל ${score} בננות.<br>השיא שלך: ${myBest}`;
        }

        overlay.innerHTML = `
            <h2>${headline}</h2>
            <p>${msg}</p>
            ${leaderboardHtml(currentPlayer)}
            <div class="end-buttons">
                <button id="btn-again" class="primary-btn">🔄 שחק שוב</button>
                <button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>
            </div>
        `;
        overlay.style.display = 'flex';

        document.getElementById('btn-again').addEventListener('click', start);
        document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
    }

    // ---- Game state ----
    let snake, dir, nextDir, food, score, loop, lastStep = 0;

    // ---- Sound ----
    let audioCtx = null;
    let muted = false;

    function ensureAudio() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
        }
        return audioCtx;
    }

    function tone(freq, duration, type='square', vol=0.15, delay=0) {
        if (muted) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + duration);
    }

    function playEat() {
        tone(660, 0.08, 'square', 0.18, 0);
        tone(990, 0.10, 'square', 0.18, 0.06);
    }
    function playStart() {
        tone(523, 0.10, 'triangle', 0.18, 0);
        tone(659, 0.10, 'triangle', 0.18, 0.10);
        tone(784, 0.16, 'triangle', 0.18, 0.20);
    }
    function playGameOver() {
        tone(392, 0.18, 'sawtooth', 0.16, 0);
        tone(294, 0.18, 'sawtooth', 0.16, 0.18);
        tone(196, 0.35, 'sawtooth', 0.16, 0.36);
    }

    // ---- Background music ----
    // Cheerful pentatonic loop in C major: C E G A G E D ... (16 notes, ~3.2s loop)
    const MUSIC_NOTES = [
        523, 659, 784, 659,   // C  E  G  E
        523, 659, 784, 880,   // C  E  G  A
        784, 659, 587, 523,   // G  E  D  C
        659, 784, 880, 784,   // E  G  A  G
    ];
    const BASS_NOTES = [
        131, 131, 131, 131,   // C3 throughout bar 1
        131, 131, 131, 131,
        175, 175, 175, 175,   // F3 in bar 3
        196, 196, 196, 196,   // G3 in bar 4
    ];
    const NOTE_MS = 220;
    let musicTimer = null;
    let musicStep  = 0;

    function playMusicTick() {
        if (muted) { musicStep++; return; }
        const i = musicStep % MUSIC_NOTES.length;
        // Melody — soft triangle wave
        tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.06, 0);
        // Bass — even softer, every 2nd note
        if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.05, 0);
        musicStep++;
    }

    function startMusic() {
        stopMusic();
        musicStep = 0;
        playMusicTick();
        musicTimer = setInterval(playMusicTick, NOTE_MS);
    }

    function stopMusic() {
        if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }

    function init() {
        snake   = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        dir     = {x:1, y:0};
        nextDir = {x:1, y:0};
        score   = 0;
        scoreEl.textContent = '0';
        spawnFood();
    }

    function spawnFood() {
        let p;
        do {
            p = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
        } while (snake.some(s => s.x===p.x && s.y===p.y));
        food = p;
    }

    function bg() {
        ctx.fillStyle = '#080818';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 0.5;
        for (let x=0; x<=COLS; x++) { ctx.beginPath(); ctx.moveTo(x*G,0); ctx.lineTo(x*G,canvas.height); ctx.stroke(); }
        for (let y=0; y<=ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*G); ctx.lineTo(canvas.width,y*G); ctx.stroke(); }
    }

    function drawSnake() {
        snake.forEach((seg, i) => {
            const t = i / snake.length;
            const g = Math.floor(255 - t*120);
            ctx.fillStyle = i===0 ? '#00ff88' : `rgb(0,${g},60)`;
            const pad = 2;
            ctx.beginPath();
            ctx.roundRect(seg.x*G+pad, seg.y*G+pad, G-pad*2, G-pad*2, 5);
            ctx.fill();
        });

        const h = snake[0];
        ctx.fillStyle = '#001a0a';
        const off = G * 0.22;
        const cx = h.x*G + G/2;
        const cy = h.y*G + G/2;
        let e1x, e1y, e2x, e2y;
        if (dir.x !== 0) {
            const fx = cx + dir.x * off;
            e1x = fx; e2x = fx;
            e1y = cy - off; e2y = cy + off;
        } else {
            const fy = cy + dir.y * off;
            e1y = fy; e2y = fy;
            e1x = cx - off; e2x = cx + off;
        }
        ctx.beginPath(); ctx.arc(e1x, e1y, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(e2x, e2y, 2.5, 0, Math.PI*2); ctx.fill();
    }

    function drawFood() {
        ctx.font = `${G+4}px serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍌', food.x*G + G/2, food.y*G + G/2 + 1);
    }

    function step() {
        dir = { ...nextDir };
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS ||
            snake.some(s => s.x===head.x && s.y===head.y)) {
            gameOver(); return;
        }

        snake.unshift(head);

        if (head.x===food.x && head.y===food.y) {
            score++;
            scoreEl.textContent = score;
            playEat();
            spawnFood();
        } else {
            snake.pop();
        }

        bg(); drawSnake(); drawFood();
    }

    function tick() {
        if (performance.now() - lastStep >= STEP_MS) {
            step();
            lastStep = performance.now();
        }
    }

    function gameOver() {
        clearInterval(loop);
        loop = null;
        stopMusic();
        playGameOver();
        saveResult(currentPlayer, score);
        showGameOver();
    }

    function start() {
        if (!currentPlayer) { showPlayerSelect(); return; }
        overlay.style.display = 'none';
        ensureAudio();
        playStart();
        init();
        clearInterval(loop);
        lastStep = performance.now();
        loop = setInterval(tick, 16);
        // Start background music slightly after the start jingle finishes
        setTimeout(startMusic, 450);
    }

    function setDir(dx, dy) {
        if (dx ===  1 && dir.x === -1) return;
        if (dx === -1 && dir.x ===  1) return;
        if (dy ===  1 && dir.y === -1) return;
        if (dy === -1 && dir.y ===  1) return;
        if (nextDir.x === dx && nextDir.y === dy) return;

        nextDir = { x: dx, y: dy };

        if (loop && performance.now() - lastStep >= 20) {
            step();
            lastStep = performance.now();
        }
    }

    document.addEventListener('keydown', e => {
        switch(e.key) {
            case 'ArrowUp':    setDir(0,-1); break;
            case 'ArrowDown':  setDir(0, 1); break;
            case 'ArrowLeft':  setDir(-1,0); break;
            case 'ArrowRight': setDir( 1,0); break;
            default: return;
        }
        e.preventDefault();
    });

    const dpadMap = {
        'dbtn-up':    [ 0,-1],
        'dbtn-down':  [ 0, 1],
        'dbtn-left':  [-1, 0],
        'dbtn-right': [ 1, 0],
    };
    Object.keys(dpadMap).forEach(id => {
        const el = document.getElementById(id);
        const [dx, dy] = dpadMap[id];
        const handler = (e) => { e.preventDefault(); setDir(dx, dy); };
        el.addEventListener('touchstart', handler, { passive: false });
        el.addEventListener('mousedown', handler);
    });

    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
        if (!touchStart || e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        const ax = Math.abs(dx), ay = Math.abs(dy);
        touchStart = null;
        if (Math.max(ax, ay) < 18) return;
        if (ax > ay) setDir(dx > 0 ? 1 : -1, 0);
        else         setDir(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    const muteBtn = document.getElementById('mute');
    muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? '🔇' : '🔊';
    });

    // ================== Auto-fit to screen ==================
    function resizeGame() {
        const wrap = document.getElementById('game-wrap');
        wrap.style.width = '0px';
        wrap.style.height = '0px';
        void document.body.offsetHeight;

        let chromeH = 0;
        for (const c of document.body.children) {
            if (c === wrap) continue;
            const cs = getComputedStyle(c);
            if (cs.position === 'fixed' || cs.display === 'none') continue;
            chromeH += c.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
        }
        const bodyCs = getComputedStyle(document.body);
        chromeH += parseFloat(bodyCs.paddingTop) + parseFloat(bodyCs.paddingBottom);

        const availH = window.innerHeight - chromeH - 8;
        const availW = window.innerWidth - 16;
        const size = Math.max(180, Math.min(availW, availH));
        wrap.style.width  = size + 'px';
        wrap.style.height = size + 'px';
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', () => setTimeout(resizeGame, 120));
    resizeGame();

    bg();
    showPlayerSelect();
</script>
</body>
</html>
