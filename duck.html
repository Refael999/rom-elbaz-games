<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>תפוס את הברווז 🦆</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #ff6dba, #ffdd57, #5cc8ff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: white;
            text-shadow: 0 2px 0 #d22e6b, 0 0 16px rgba(255,255,255,0.6);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.8em, 1.9vw, 1em);
            padding: 4px 12px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #ff6dba;
            border-radius: 25px;
            color: #5a285a;
            font-weight: bold;
        }
        #score   { color: #00a86b; }
        #misses  { color: #d22e6b; }
        #level   { color: #ff8a00; }
        #current-player { color: #1a78c2; }

        #game-wrap {
            position: relative;
            /* Largest square that fits in viewport, minus header/status/hint chrome */
            width:  min(96vw, calc(100vh - 160px));
            height: min(96vw, calc(100vh - 160px));
            max-width: 96vw;
            max-height: calc(100vh - 160px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid #ff6dba;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,109,186,0.5);
            background: #ff6dba;
            touch-action: none;
            cursor: crosshair;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(50,15,60,0.92);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #ffdd57;
            text-shadow: 0 0 14px #ffdd57;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #ffe9f3;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #ff6dba;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #5a285a;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(90,40,90,0.5); }
        .name-input:focus { border-color: #ffdd57; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #ff6dba, #ff8a00);
            color: white;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255,109,186,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #ffdd57, #ff8a00);
            color: #5a285a;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255,221,87,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,109,186,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #ffdd57; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #ffe9f3; }
        .leaderboard tr.highlight td { background: rgba(255,221,87,0.25); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #ffdd57; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #ff6dba;
            color: #5a285a;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #ffdd57; }

        #hint {
            margin-top: 5px;
            color: white;
            text-shadow: 0 1px 0 #b9398d;
            font-size: clamp(0.8em, 2vw, 0.95em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🦆 תפוס את הברווז! 🦆</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">💔 <span id="misses">0</span>/3</div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
    <div class="status-pill">🎯 <span id="level">1</span></div>
</div>

<div id="game-wrap">
    <canvas id="c" width="700" height="700"></canvas>
    <div id="overlay"></div>
</div>

<p id="hint">👆 לחץ על הברווזים מהר! יש 3 פספוסים 💔</p>

<script>
'use strict';

// ================== Setup ==================
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl  = document.getElementById('score');
const missesEl = document.getElementById('misses');
const levelEl  = document.getElementById('level');
const currentPlayerEl = document.getElementById('current-player');

const W = canvas.width;     // 700
const H = canvas.height;    // 700
const DUCK_R = 60;          // bigger ducks!

// ================== Levels ==================
const LEVELS = [
    { num: 1, name: 'שלב 1 · קל',         minScore: 0,  duckTime: 2.5, spawnMs: 1500, maxDucks: 2, color: '#9bff66' },
    { num: 2, name: 'שלב 2 · קל-בינוני',   minScore: 8,  duckTime: 2.0, spawnMs: 1250, maxDucks: 3, color: '#cffd5e' },
    { num: 3, name: 'שלב 3 · בינוני',      minScore: 18, duckTime: 1.7, spawnMs: 1050, maxDucks: 3, color: '#ffdd57' },
    { num: 4, name: 'שלב 4 · די קשה',      minScore: 30, duckTime: 1.4, spawnMs: 880,  maxDucks: 4, color: '#ffb347' },
    { num: 5, name: 'שלב 5 · קשה',        minScore: 45, duckTime: 1.2, spawnMs: 720,  maxDucks: 5, color: '#ff7733' },
    { num: 6, name: 'שלב 6 · קשה מאוד',   minScore: 65, duckTime: 1.0, spawnMs: 580,  maxDucks: 6, color: '#ff3366' },
    { num: 7, name: 'שלב 7 · בטירוף 🔥',   minScore: 90, duckTime: 0.8, spawnMs: 460,  maxDucks: 7, color: '#c92a52' },
];
function getLevelFor(score) {
    for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (score >= LEVELS[i].minScore) return LEVELS[i];
    }
    return LEVELS[0];
}
function nextLevelGoal(level) {
    const next = LEVELS.find(l => l.num === level.num + 1);
    return next ? next.minScore : null;
}

// ================== Scoreboard ==================
const STORAGE_KEY = 'rom_duck_scores_v1';
let currentPlayer = null;

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><p style="color:#aaa;font-size:0.85em;margin:0">עוד אין שחקנים — אתה תהיה הראשון! 🦆</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><table>${rows}</table></div>`;
}

// ================== Game state ==================
let running = false;
let rafId = null;
let ducks = [];
let splashes = [];
let popups = [];
let bgPhase = 0;
let score = 0;
let misses = 0;
let lastSpawn = 0;
let lastT = 0;
let currentLevel = LEVELS[0];
let levelBanner = null;

function resetGame() {
    ducks = [];
    splashes = [];
    popups = [];
    score = 0;
    misses = 0;
    bgPhase = 0;
    currentLevel = LEVELS[0];
    levelBanner = { text: '🦆 ' + currentLevel.name, life: 1.8 };
    lastSpawn = performance.now() - 1200;   // first duck appears very quickly
    scoreEl.textContent = '0';
    missesEl.textContent = '0';
    updateLevelUi();
}

function updateLevelUi() {
    const goal = nextLevelGoal(currentLevel);
    levelEl.textContent = goal !== null
        ? `${currentLevel.num} (${score}/${goal})`
        : `${currentLevel.num} 🔥`;
}

// ================== Sound ==================
let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function playCatch() {
    tone(700, 0.06, 'square',  0.16, 0);
    tone(1000,0.08, 'square',  0.16, 0.05);
    tone(800, 0.10, 'triangle',0.14, 0.12);
}
function playMiss() {
    tone(300, 0.18, 'sawtooth', 0.16, 0);
    tone(220, 0.22, 'sawtooth', 0.16, 0.16);
}
function playPop() { tone(550, 0.04, 'sine', 0.06, 0); }
function playStart() {
    tone(523, 0.10, 'triangle', 0.18, 0);
    tone(659, 0.10, 'triangle', 0.18, 0.10);
    tone(784, 0.16, 'triangle', 0.18, 0.20);
}
function playGameOver() {
    tone(392, 0.18, 'sawtooth', 0.16, 0);
    tone(294, 0.18, 'sawtooth', 0.16, 0.18);
    tone(196, 0.35, 'sawtooth', 0.16, 0.36);
}
function playLevelUp() {
    tone(523, 0.10, 'square', 0.16, 0);
    tone(659, 0.10, 'square', 0.16, 0.10);
    tone(784, 0.10, 'square', 0.16, 0.20);
    tone(1047,0.22, 'square', 0.18, 0.30);
}
const MUSIC_NOTES = [523, 659, 784, 880, 784, 659, 523, 440];
const BASS_NOTES  = [131, 131, 175, 175, 196, 196, 131, 131];
const NOTE_MS = 220;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.05, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.05, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Duck spawning ==================
function spawnDuck() {
    if (ducks.length >= currentLevel.maxDucks) return;
    const margin = DUCK_R + 18;
    let x = W / 2, y = H / 2;
    for (let t = 0; t < 30; t++) {
        x = margin + Math.random() * (W - margin * 2);
        y = margin + Math.random() * (H - margin * 2);
        let overlap = false;
        for (const d of ducks) {
            const dx = x - d.x, dy = y - d.y;
            const minD = (DUCK_R + 8) * 2;
            if (dx * dx + dy * dy < minD * minD) { overlap = true; break; }
        }
        if (!overlap) break;
    }
    ducks.push({
        x: x, y: y,
        timeLeft: currentLevel.duckTime,
        maxTime: currentLevel.duckTime,
        scaleAnim: 0,
        hit: false,
    });
    playPop();
}

function spawnSplash(x, y, color) {
    for (let i = 0; i < 16; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 100 + Math.random() * 180;
        splashes.push({
            x: x, y: y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.45 + Math.random() * 0.3,
            color: color || (Math.random() < 0.5 ? '#ffdd57' : '#ff6dba'),
            r: 3 + Math.random() * 4,
        });
    }
}
function popup(text, x, y, color) {
    popups.push({ text: text, x: x, y: y, vy: -50, life: 0.9, color: color || '#ffdd57' });
}

// ================== Click handling ==================
function canvasPointFromClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top)  * (H / rect.height),
    };
}

function tryCatchDuck(x, y) {
    if (!running) return;
    for (const d of ducks) {
        if (d.hit) continue;
        const dx = x - d.x, dy = y - d.y;
        if (dx * dx + dy * dy < DUCK_R * DUCK_R) {
            d.hit = true;
            d.scaleAnim = 1.4;
            score++;
            scoreEl.textContent = score;
            playCatch();
            spawnSplash(d.x, d.y);
            popup('+1', d.x, d.y - DUCK_R - 4, '#ffdd57');

            const lvl = getLevelFor(score);
            if (lvl.num !== currentLevel.num) {
                currentLevel = lvl;
                levelBanner = { text: lvl.name, life: 2.2 };
                playLevelUp();
            }
            updateLevelUi();
            return;
        }
    }
}

canvas.addEventListener('mousedown', function (e) {
    const p = canvasPointFromClient(e.clientX, e.clientY);
    tryCatchDuck(p.x, p.y);
});
canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    const p = canvasPointFromClient(t.clientX, t.clientY);
    tryCatchDuck(p.x, p.y);
}, { passive: false });

// ================== Update ==================
function update(dt) {
    bgPhase += dt * 0.35;

    // Spawn new ducks
    if (performance.now() - lastSpawn > currentLevel.spawnMs) {
        spawnDuck();
        lastSpawn = performance.now();
    }

    // Update ducks
    for (let i = ducks.length - 1; i >= 0; i--) {
        const d = ducks[i];
        if (d.hit) {
            d.scaleAnim -= dt * 5;
            if (d.scaleAnim <= 0) ducks.splice(i, 1);
        } else {
            if (d.scaleAnim < 1) d.scaleAnim = Math.min(1, d.scaleAnim + dt * 6);
            d.timeLeft -= dt;
            if (d.timeLeft <= 0) {
                spawnSplash(d.x, d.y, '#d22e6b');
                popup('פספסת!', d.x, d.y, '#ff5577');
                ducks.splice(i, 1);
                misses++;
                missesEl.textContent = misses;
                playMiss();
                if (misses >= 3) { gameOver(); return; }
            }
        }
    }

    // Splashes
    splashes = splashes.filter(function (s) {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 400 * dt;
        s.life -= dt;
        return s.life > 0;
    });

    // Popups
    popups = popups.filter(function (p) {
        p.y += p.vy * dt;
        p.life -= dt;
        return p.life > 0;
    });

    // Level banner
    if (levelBanner) {
        levelBanner.life -= dt;
        if (levelBanner.life <= 0) levelBanner = null;
    }
}

// ================== Render ==================
function drawBg() {
    // Animated rainbow gradient
    const h1 = (bgPhase * 60) % 360;
    const h2 = (bgPhase * 60 + 90) % 360;
    const h3 = (bgPhase * 60 + 180) % 360;
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0,   'hsl(' + h1 + ', 80%, 65%)');
    g.addColorStop(0.5, 'hsl(' + h2 + ', 80%, 60%)');
    g.addColorStop(1,   'hsl(' + h3 + ', 80%, 65%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Big floating soft circles for depth
    const t = bgPhase * 30;
    for (let i = 0; i < 6; i++) {
        const cx = (W * 0.5) + Math.cos(t * 0.01 + i) * 200;
        const cy = (H * 0.5) + Math.sin(t * 0.013 + i * 1.7) * 200;
        const r = 80 + Math.sin(t * 0.02 + i) * 30;
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
}

function drawDuck(d) {
    const scale = d.scaleAnim;
    if (scale <= 0) return;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.scale(scale, scale);

    // Drop shadow circle
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(4, 5, DUCK_R, 0, Math.PI * 2); ctx.fill();

    // White halo so duck pops off any background
    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.beginPath(); ctx.arc(0, 0, DUCK_R, 0, Math.PI * 2); ctx.fill();

    // Pink ring
    ctx.strokeStyle = '#ff6dba';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, DUCK_R - 1, 0, Math.PI * 2); ctx.stroke();

    // Cartoon duck drawn directly (so it works without emoji font support)
    // Body (yellow oval)
    ctx.fillStyle = '#ffdd33';
    ctx.strokeStyle = '#a86d00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 6, DUCK_R * 0.62, DUCK_R * 0.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Head
    ctx.beginPath();
    ctx.arc(-DUCK_R * 0.30, -DUCK_R * 0.18, DUCK_R * 0.42, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Beak
    ctx.fillStyle = '#ff8a00';
    ctx.strokeStyle = '#a85400';
    ctx.beginPath();
    ctx.moveTo(-DUCK_R * 0.62, -DUCK_R * 0.18);
    ctx.lineTo(-DUCK_R * 0.90, -DUCK_R * 0.05);
    ctx.lineTo(-DUCK_R * 0.62,  DUCK_R * 0.02);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Eye white
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-DUCK_R * 0.30, -DUCK_R * 0.30, DUCK_R * 0.14, 0, Math.PI * 2); ctx.fill();
    // Pupil
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-DUCK_R * 0.34, -DUCK_R * 0.30, DUCK_R * 0.07, 0, Math.PI * 2); ctx.fill();
    // Wing
    ctx.fillStyle = '#f0c500';
    ctx.strokeStyle = '#a86d00';
    ctx.beginPath();
    ctx.ellipse(DUCK_R * 0.10, DUCK_R * 0.08, DUCK_R * 0.32, DUCK_R * 0.22, -0.4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Timer ring around the white halo
    if (!d.hit) {
        const pct = d.timeLeft / d.maxTime;
        ctx.strokeStyle = pct > 0.5 ? '#3ed05f' : pct > 0.25 ? '#ffce5e' : '#ff3366';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, DUCK_R + 8, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawSplashes() {
    for (const s of splashes) {
        ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 2));
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px Comic Sans MS, Arial';
    for (const p of popups) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.9));
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
}

function drawLevelBanner() {
    if (!levelBanner) return;
    const a = Math.min(1, levelBanner.life / 0.4);
    ctx.globalAlpha = a;
    ctx.font = 'bold 36px Comic Sans MS, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = levelBanner.text;
    const padX = 22, padY = 12;
    const m = ctx.measureText(text);
    const bw = m.width + padX * 2;
    const bh = 36 + padY * 2;
    const bx = W / 2 - bw / 2;
    const by = H / 2 - bh / 2;
    ctx.fillStyle = 'rgba(50,15,60,0.85)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill(); }
    else                  ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = currentLevel.color;
    ctx.lineWidth = 4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.stroke(); }
    else                  ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = currentLevel.color;
    ctx.shadowBlur = 18; ctx.shadowColor = currentLevel.color;
    ctx.fillText(text, W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

function render() {
    drawBg();
    for (const d of ducks) drawDuck(d);
    drawSplashes();
    drawPopups();
    drawLevelBanner();
}

// ================== Loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    update(dt);
    render();
    if (running) rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    start();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    scoreEl.textContent = '0';
    missesEl.textContent = '0';
    levelEl.textContent = '—';

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name: name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🦆 תפוס את הברווז</h2>' +
        '<p>מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">🦆 שחק</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', function (e) { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    // Render the bg behind the overlay
    drawBg();

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showGameOver() {
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = score === myBest && score > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === score && score > 0;
    const lvlReached = getLevelFor(score);

    let headline, msg;
    if (isKing && isNewRecord) {
        headline = '👑 מלך הברווזים!';
        msg = `${currentPlayer} עלה לראש הטבלה עם ${score} ברווזים (${lvlReached.name})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש!';
        msg = `${currentPlayer} תפס ${score} ברווזים, הגיע ל${lvlReached.name}!`;
    } else if (score >= 10) {
        headline = '🏆 ציד מוצלח!';
        msg = `${currentPlayer} תפס ${score} ברווזים (${lvlReached.name}). השיא: ${myBest}`;
    } else {
        headline = '🦆 הברווזים ניצחו!';
        msg = `${currentPlayer} תפס ${score} ברווזים (${lvlReached.name}).<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    setTimeout(showGameOver, 600);
}

function start() {
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();
    resetGame();
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

// ================== Mute ==================
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
});

// ================== Boot ==================
drawBg();
showPlayerSelect();
</script>
</body>
</html>
