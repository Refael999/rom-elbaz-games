<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הצפרדע חוצה כביש 🐸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #2e7d32, #66bb6a, #4fc3f7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: white;
            text-shadow: 0 2px 0 #1b5e20, 0 0 16px rgba(255,255,255,0.6);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.8em, 1.9vw, 1em);
            padding: 4px 12px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #2e7d32;
            border-radius: 25px;
            color: #1b3a1b;
            font-weight: bold;
        }
        #score   { color: #00a86b; }
        #misses  { color: #d22e2e; }
        #level   { color: #ff8a00; }
        #current-player { color: #1a78c2; }

        #game-wrap {
            position: relative;
            width:  min(96vw, calc(100vh - 160px));
            height: min(96vw, calc(100vh - 160px));
            max-width: 96vw;
            max-height: calc(100vh - 160px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid #2e7d32;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(46,125,50,0.5);
            background: #4fc3f7;
            touch-action: none;
            cursor: crosshair;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(15,40,20,0.92);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #ffdd57;
            text-shadow: 0 0 14px #ffdd57;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #e8ffe9;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #2e7d32;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #1b3a1b;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(27,58,27,0.5); }
        .name-input:focus { border-color: #ffdd57; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(46,125,50,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #ffdd57, #ff8a00);
            color: #1b3a1b;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255,221,87,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(102,187,106,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #ffdd57; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #e8ffe9; }
        .leaderboard tr.highlight td { background: rgba(255,221,87,0.25); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #ffdd57; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #2e7d32;
            color: #1b3a1b;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #ffdd57; }

        #hint {
            margin-top: 5px;
            color: white;
            text-shadow: 0 1px 0 #1b5e20;
            font-size: clamp(0.8em, 2vw, 0.95em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }

        /* On-screen D-pad for touch / small screens */
        #dpad {
            display: none;
            direction: ltr;
            margin-top: 8px;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 6px;
            justify-content: center;
        }
        .dbtn {
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
            color: white;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            font-size: 1.6em;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 0 #1b5e20, 0 6px 14px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .dbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b5e20, 0 2px 6px rgba(0,0,0,0.3); }
        #d-up    { grid-column: 2; grid-row: 1; }
        #d-left  { grid-column: 1; grid-row: 2; }
        #d-right { grid-column: 3; grid-row: 2; }
        #d-down  { grid-column: 2; grid-row: 3; }
        @media (pointer: coarse), (max-width: 768px) {
            #dpad { display: grid; }
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🐸 הצפרדע חוצה כביש! 🐸</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">💚 <span id="misses">3</span></div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
    <div class="status-pill">🎯 <span id="level">1</span></div>
</div>

<div id="game-wrap">
    <canvas id="c" width="700" height="700"></canvas>
    <div id="overlay"></div>
</div>

<p id="hint">⬆️⬇️⬅️➡️ או החלק עם האצבע 🐸</p>

<div id="dpad">
    <button class="dbtn" id="d-up" aria-label="למעלה">▲</button>
    <button class="dbtn" id="d-left" aria-label="שמאל">◀</button>
    <button class="dbtn" id="d-right" aria-label="ימין">▶</button>
    <button class="dbtn" id="d-down" aria-label="למטה">▼</button>
</div>

<script>
'use strict';

// ================== Setup ==================
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl  = document.getElementById('score');
const missesEl = document.getElementById('misses');
const levelEl  = document.getElementById('level');
const currentPlayerEl = document.getElementById('current-player');

const W = canvas.width;     // 700
const H = canvas.height;    // 700
const ROWS = 14;
const CELL = H / ROWS;      // 50
const COLS = W / CELL;      // 14

// Row layout (0 = top)
const ROW_GOAL   = 0;             // lily pads on grass
const RIVER_ROWS = [1, 2, 3, 4, 5];
const ROW_MID    = 6;             // mid safe strip
const ROAD_ROWS  = [7, 8, 9, 10, 11, 12];
const ROW_START  = 13;            // start safe strip

const PAD_COUNT = 5;

// ================== Levels ==================
const LEVELS = [
    { num: 1, name: 'שלב 1 · קל',         minScore: 0,   carSpeed: 90,  carDensity: 2, logSpeed: 60,  logsPerRow: 4, color: '#9bff66' },
    { num: 2, name: 'שלב 2 · קל-בינוני',   minScore: 15,  carSpeed: 110, carDensity: 2, logSpeed: 75,  logsPerRow: 4, color: '#cffd5e' },
    { num: 3, name: 'שלב 3 · בינוני',      minScore: 35,  carSpeed: 130, carDensity: 3, logSpeed: 90,  logsPerRow: 4, color: '#ffdd57' },
    { num: 4, name: 'שלב 4 · די קשה',      minScore: 60,  carSpeed: 150, carDensity: 3, logSpeed: 105, logsPerRow: 3, color: '#ffb347' },
    { num: 5, name: 'שלב 5 · קשה',         minScore: 90,  carSpeed: 175, carDensity: 4, logSpeed: 120, logsPerRow: 3, color: '#ff7733' },
    { num: 6, name: 'שלב 6 · קשה מאוד',    minScore: 130, carSpeed: 200, carDensity: 4, logSpeed: 140, logsPerRow: 3, color: '#ff3366' },
    { num: 7, name: 'שלב 7 · בטירוף 🔥',   minScore: 180, carSpeed: 235, carDensity: 5, logSpeed: 165, logsPerRow: 2, color: '#c92a52' },
];
function getLevelFor(score) {
    for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (score >= LEVELS[i].minScore) return LEVELS[i];
    }
    return LEVELS[0];
}
function nextLevelGoal(level) {
    const next = LEVELS.find(l => l.num === level.num + 1);
    return next ? next.minScore : null;
}

// ================== Scoreboard ==================
const STORAGE_KEY = 'rom_frog_scores_v1';
let currentPlayer = null;

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><p style="color:#aaa;font-size:0.85em;margin:0">עוד אין שחקנים — אתה תהיה הראשון! 🐸</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><table>${rows}</table></div>`;
}

// ================== Game state ==================
let running = false;
let rafId = null;
let score = 0;
let lives = 3;
let lastT = 0;
let currentLevel = LEVELS[0];
let levelBanner = null;
let bgPhase = 0;
let roadDash = 0;

// Frog state
let frog = null;
let cars = [];
let logs = [];
let pads = [];
let maxRowReached = ROW_START;
let splashes = [];
let popups = [];
let respawnTimer = 0;
let onLog = null;

function resetGame() {
    score = 0;
    lives = 3;
    currentLevel = LEVELS[0];
    levelBanner = { text: '🐸 ' + currentLevel.name, life: 1.8 };
    splashes = [];
    popups = [];
    pads = new Array(PAD_COUNT).fill(false);
    buildTraffic();
    spawnFrog();
    scoreEl.textContent = '0';
    missesEl.textContent = lives;
    updateLevelUi();
}

function updateLevelUi() {
    const goal = nextLevelGoal(currentLevel);
    levelEl.textContent = goal !== null
        ? `${currentLevel.num} (${score}/${goal})`
        : `${currentLevel.num} 🔥`;
}

function spawnFrog() {
    frog = {
        col: Math.floor(COLS / 2),
        row: ROW_START,
        x: 0, y: 0,
        targetX: 0, targetY: 0,
        hopT: 0,
        hopDur: 0.1,
        facing: 'up',
        alive: true,
    };
    frog.x = frog.col * CELL + CELL / 2;
    frog.y = frog.row * CELL + CELL / 2;
    frog.targetX = frog.x;
    frog.targetY = frog.y;
    maxRowReached = ROW_START;
    onLog = null;
}

function buildTraffic() {
    cars = [];
    logs = [];

    const carColors = ['#e53935', '#1e88e5', '#fdd835', '#fb8c00', '#8e24aa', '#00897b'];
    ROAD_ROWS.forEach((row, idx) => {
        const dir = idx % 2 === 0 ? 1 : -1;
        const speed = currentLevel.carSpeed * (0.85 + (idx * 0.06));
        const count = currentLevel.carDensity + (idx % 2);
        const spacing = W / count;
        const color = carColors[idx % carColors.length];
        for (let i = 0; i < count; i++) {
            const w = CELL * 1.6 + (idx % 2 === 0 ? 0 : CELL * 0.3);
            cars.push({
                row: row,
                x: i * spacing + Math.random() * 20,
                w: w,
                h: CELL * 0.7,
                dir: dir,
                speed: speed,
                color: color,
            });
        }
    });

    RIVER_ROWS.forEach((row, idx) => {
        const dir = idx % 2 === 0 ? -1 : 1;
        const speed = currentLevel.logSpeed * (0.9 + (idx * 0.08));
        const count = currentLevel.logsPerRow;
        const spacing = W / count;
        for (let i = 0; i < count; i++) {
            const w = CELL * (2 + Math.random() * 1.5);
            logs.push({
                row: row,
                x: i * spacing + Math.random() * 30,
                w: w,
                h: CELL * 0.7,
                dir: dir,
                speed: speed,
            });
        }
    });
}

// ================== Sound ==================
let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function playHop()    { tone(620, 0.06, 'square', 0.12, 0); tone(820, 0.06, 'square', 0.10, 0.04); }
function playSplash() { tone(180, 0.10, 'sawtooth', 0.15, 0); tone(110, 0.22, 'sawtooth', 0.18, 0.08); }
function playSquish() { tone(140, 0.05, 'square', 0.18, 0);  tone(90,  0.18, 'sawtooth', 0.18, 0.04); }
function playPad()    { tone(523, 0.08, 'triangle', 0.16, 0); tone(659, 0.08, 'triangle', 0.16, 0.08); tone(880, 0.16, 'triangle', 0.16, 0.16); }
function playStart() {
    tone(523, 0.10, 'triangle', 0.18, 0);
    tone(659, 0.10, 'triangle', 0.18, 0.10);
    tone(784, 0.16, 'triangle', 0.18, 0.20);
}
function playGameOver() {
    tone(392, 0.18, 'sawtooth', 0.16, 0);
    tone(294, 0.18, 'sawtooth', 0.16, 0.18);
    tone(196, 0.35, 'sawtooth', 0.16, 0.36);
}
function playLevelUp() {
    tone(523, 0.10, 'square', 0.16, 0);
    tone(659, 0.10, 'square', 0.16, 0.10);
    tone(784, 0.10, 'square', 0.16, 0.20);
    tone(1047,0.22, 'square', 0.18, 0.30);
}
const MUSIC_NOTES = [523, 659, 784, 880, 784, 659, 523, 440];
const BASS_NOTES  = [131, 131, 175, 175, 196, 196, 131, 131];
const NOTE_MS = 220;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.05, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.05, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Effects ==================
function spawnSplash(x, y, color) {
    for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 90 + Math.random() * 200;
        splashes.push({
            x: x, y: y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.45 + Math.random() * 0.3,
            color: color || '#4fc3f7',
            r: 3 + Math.random() * 4,
        });
    }
}
function popup(text, x, y, color) {
    popups.push({ text: text, x: x, y: y, vy: -50, life: 1.0, color: color || '#ffdd57' });
}

// ================== Frog movement ==================
function moveFrog(dx, dy) {
    if (!running || !frog || !frog.alive) return;
    if (frog.hopT > 0) return;

    let newCol = frog.col + dx;
    let newRow = frog.row + dy;
    if (newCol < 0 || newCol >= COLS) return;
    if (newRow < 0 || newRow >= ROWS) return;

    frog.col = newCol;
    frog.row = newRow;
    frog.targetX = newCol * CELL + CELL / 2;
    frog.targetY = newRow * CELL + CELL / 2;
    frog.hopT = frog.hopDur;
    if (dy < 0) frog.facing = 'up';
    else if (dy > 0) frog.facing = 'down';
    else if (dx < 0) frog.facing = 'left';
    else frog.facing = 'right';

    if (newRow < maxRowReached) {
        score += 1;
        scoreEl.textContent = score;
        maxRowReached = newRow;
        checkLevelUp();
    }
    onLog = null;
    playHop();
}

function checkLevelUp() {
    const lvl = getLevelFor(score);
    if (lvl.num !== currentLevel.num) {
        currentLevel = lvl;
        levelBanner = { text: lvl.name, life: 2.2 };
        playLevelUp();
        buildTraffic();
    }
    updateLevelUi();
}

// ================== Keyboard ==================
window.addEventListener('keydown', function (e) {
    if (!running) return;
    if (e.key === 'ArrowUp')         { e.preventDefault(); moveFrog(0, -1); }
    else if (e.key === 'ArrowDown')  { e.preventDefault(); moveFrog(0, 1); }
    else if (e.key === 'ArrowLeft')  { e.preventDefault(); moveFrog(-1, 0); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveFrog(1, 0); }
}, { passive: false });

// ================== D-pad ==================
function bindDpad(id, dx, dy) {
    const b = document.getElementById(id);
    const handler = function (e) {
        e.preventDefault();
        moveFrog(dx, dy);
    };
    b.addEventListener('touchstart', handler, { passive: false });
    b.addEventListener('mousedown', handler);
}
bindDpad('d-up', 0, -1);
bindDpad('d-down', 0, 1);
bindDpad('d-left', -1, 0);
bindDpad('d-right', 1, 0);

// ================== Swipe ==================
let swipeStart = null;
canvas.addEventListener('touchstart', function (e) {
    if (!running) return;
    const t = e.changedTouches[0];
    swipeStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', function (e) {
    if (!running || !swipeStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeStart.x;
    const dy = t.clientY - swipeStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const TH = 18;
    if (Math.max(ax, ay) < TH) { swipeStart = null; return; }
    if (ax > ay) moveFrog(dx > 0 ? 1 : -1, 0);
    else         moveFrog(0, dy > 0 ? 1 : -1);
    swipeStart = null;
}, { passive: true });

// ================== Update ==================
function update(dt) {
    bgPhase += dt * 0.5;
    roadDash = (roadDash + dt * 30) % 32;

    for (const c of cars) {
        c.x += c.dir * c.speed * dt;
        if (c.dir > 0 && c.x > W + 20) c.x = -c.w - 20;
        if (c.dir < 0 && c.x + c.w < -20) c.x = W + 20;
    }
    for (const l of logs) {
        l.x += l.dir * l.speed * dt;
        if (l.dir > 0 && l.x > W + 20) l.x = -l.w - 20;
        if (l.dir < 0 && l.x + l.w < -20) l.x = W + 20;
    }

    if (frog) {
        if (frog.hopT > 0) {
            frog.hopT -= dt;
            frog.x = frog.x + (frog.targetX - frog.x) * Math.min(1, dt * 18);
            frog.y = frog.y + (frog.targetY - frog.y) * Math.min(1, dt * 18);
            if (frog.hopT <= 0) {
                frog.x = frog.targetX;
                frog.y = frog.targetY;
                onLandedCell();
            }
        } else if (frog.alive) {
            if (RIVER_ROWS.indexOf(frog.row) >= 0 && onLog) {
                frog.x += onLog.dir * onLog.speed * dt;
                frog.targetX = frog.x;
                if (frog.x < CELL * 0.2 || frog.x > W - CELL * 0.2) {
                    die('splash');
                    return;
                }
            }
            checkRowHazards();
        }
    }

    if (respawnTimer > 0) {
        respawnTimer -= dt;
        if (respawnTimer <= 0) spawnFrog();
    }

    splashes = splashes.filter(function (s) {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 400 * dt;
        s.life -= dt;
        return s.life > 0;
    });
    popups = popups.filter(function (p) {
        p.y += p.vy * dt;
        p.life -= dt;
        return p.life > 0;
    });
    if (levelBanner) {
        levelBanner.life -= dt;
        if (levelBanner.life <= 0) levelBanner = null;
    }
}

function onLandedCell() {
    if (!frog || !frog.alive) return;
    const row = frog.row;

    if (row === ROW_GOAL) {
        // Map column to pad slot (5 slots over COLS columns)
        const slotW = COLS / PAD_COUNT;
        const padIdx = Math.floor(frog.col / slotW);
        const padCenterCol = Math.round((padIdx + 0.5) * slotW);
        if (Math.abs(frog.col - padCenterCol) <= 1 && padIdx >= 0 && padIdx < PAD_COUNT) {
            if (pads[padIdx]) {
                die('squish');
                return;
            }
            pads[padIdx] = true;
            score += 10;
            popup('+10', frog.x, frog.y - CELL * 0.6, '#ffdd57');
            scoreEl.textContent = score;
            playPad();
            if (pads.every(p => p)) {
                score += 50;
                popup('+50! כל הביצות!', W / 2, H / 2, '#ffdd57');
                scoreEl.textContent = score;
                pads = new Array(PAD_COUNT).fill(false);
                playLevelUp();
            }
            checkLevelUp();
            frog.alive = false;
            respawnTimer = 0.35;
            return;
        } else {
            die('squish');
            return;
        }
    }

    if (RIVER_ROWS.indexOf(row) >= 0) {
        const found = findLogAt(frog.x, row);
        if (!found) { die('splash'); return; }
        onLog = found;
        return;
    }

    onLog = null;
    checkRowHazards();
}

function checkRowHazards() {
    if (!frog.alive) return;
    const row = frog.row;
    if (ROAD_ROWS.indexOf(row) >= 0) {
        for (const c of cars) {
            if (c.row !== row) continue;
            if (frog.x > c.x - CELL * 0.25 && frog.x < c.x + c.w + CELL * 0.25) {
                die('squish');
                return;
            }
        }
    } else if (RIVER_ROWS.indexOf(row) >= 0) {
        if (!onLog) {
            const found = findLogAt(frog.x, row);
            if (!found) { die('splash'); return; }
            onLog = found;
        } else {
            if (frog.x < onLog.x - CELL * 0.1 || frog.x > onLog.x + onLog.w + CELL * 0.1) {
                const found = findLogAt(frog.x, row);
                if (!found) { die('splash'); return; }
                onLog = found;
            }
        }
    }
}

function findLogAt(x, row) {
    for (const l of logs) {
        if (l.row !== row) continue;
        if (x >= l.x && x <= l.x + l.w) return l;
    }
    return null;
}

function die(kind) {
    if (!frog || !frog.alive) return;
    frog.alive = false;
    lives--;
    missesEl.textContent = lives;
    if (kind === 'splash') {
        spawnSplash(frog.x, frog.y, '#4fc3f7');
        playSplash();
        popup('פלאש!', frog.x, frog.y, '#4fc3f7');
    } else {
        spawnSplash(frog.x, frog.y, '#d22e2e');
        playSquish();
        popup('בום!', frog.x, frog.y, '#ff5577');
    }
    if (lives <= 0) {
        gameOver();
        return;
    }
    respawnTimer = 0.6;
}

// ================== Render ==================
function drawBg() {
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(0, 0, W, H);

    drawGrassStrip(ROW_GOAL * CELL, CELL);
    drawWater(RIVER_ROWS[0] * CELL, RIVER_ROWS.length * CELL);
    drawSandStrip(ROW_MID * CELL, CELL);
    drawRoad(ROAD_ROWS[0] * CELL, ROAD_ROWS.length * CELL);
    drawGrassStrip(ROW_START * CELL, CELL);
    drawLilyPads();
}

function drawGrassStrip(y, h) {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, y, W, h);
    ctx.fillStyle = 'rgba(0,80,0,0.18)';
    for (let i = 0; i < 22; i++) {
        const gx = ((i * 53) % W);
        const gy = y + 4 + ((i * 17) % (h - 6));
        ctx.fillRect(gx, gy, 6, 3);
    }
}

function drawSandStrip(y, h) {
    ctx.fillStyle = '#c8a165';
    ctx.fillRect(0, y, W, h);
    ctx.fillStyle = 'rgba(120,80,30,0.25)';
    for (let i = 0; i < 16; i++) {
        const gx = ((i * 47) % W);
        const gy = y + 4 + ((i * 11) % (h - 6));
        ctx.beginPath(); ctx.arc(gx, gy, 2, 0, Math.PI * 2); ctx.fill();
    }
}

function drawWater(y, h) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#1976d2');
    g.addColorStop(1, '#0d47a1');
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    const rows = Math.floor(h / 12);
    for (let row = 0; row < rows; row++) {
        ctx.beginPath();
        for (let x = 0; x <= W; x += 16) {
            const yy = y + 6 + row * 12 + Math.sin((x + bgPhase * 80 + row * 25) * 0.05) * 2;
            if (x === 0) ctx.moveTo(x, yy);
            else ctx.lineTo(x, yy);
        }
        ctx.stroke();
    }
}

function drawRoad(y, h) {
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(0, y, W, h);
    ctx.fillStyle = '#eaeaea';
    ctx.fillRect(0, y, W, 2);
    ctx.fillRect(0, y + h - 2, W, 2);
    ctx.strokeStyle = '#fff59d';
    ctx.lineWidth = 3;
    ctx.setLineDash([18, 14]);
    ctx.lineDashOffset = -roadDash;
    for (let i = 1; i < ROAD_ROWS.length; i++) {
        const yy = y + i * CELL;
        ctx.beginPath();
        ctx.moveTo(0, yy);
        ctx.lineTo(W, yy);
        ctx.stroke();
    }
    ctx.setLineDash([]);
}

function drawLilyPads() {
    const slotW = W / PAD_COUNT;
    for (let i = 0; i < PAD_COUNT; i++) {
        const cx = i * slotW + slotW / 2;
        const cy = ROW_GOAL * CELL + CELL / 2;
        // lily pad
        ctx.fillStyle = '#2e7d32';
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, CELL * 0.55, CELL * 0.42, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        // notch
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + CELL * 0.55, cy - CELL * 0.05);
        ctx.lineTo(cx + CELL * 0.55, cy + CELL * 0.05);
        ctx.closePath();
        ctx.fill();
        if (pads[i]) {
            drawSmallFrog(cx, cy);
        } else {
            // pink lotus flower
            ctx.fillStyle = '#ffb3d1';
            for (let p = 0; p < 6; p++) {
                const ang = (p / 6) * Math.PI * 2;
                ctx.beginPath();
                ctx.ellipse(cx + Math.cos(ang) * 7, cy + Math.sin(ang) * 5, 5, 8, ang, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#ffdd57';
            ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
        }
    }
}

function drawSmallFrog(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(0.65, 0.65);
    drawFrogShape(0, 0, 'up', 0);
    ctx.restore();
}

function drawLogs() {
    for (const l of logs) {
        const y = l.row * CELL + (CELL - l.h) / 2;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(l.x + 3, y + 4, l.w, l.h, 14); ctx.fill(); }
        else ctx.fillRect(l.x + 3, y + 4, l.w, l.h);
        ctx.fillStyle = '#8d5524';
        ctx.strokeStyle = '#4e2e0e';
        ctx.lineWidth = 2;
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(l.x, y, l.w, l.h, 14); ctx.fill(); ctx.stroke(); }
        else { ctx.fillRect(l.x, y, l.w, l.h); ctx.strokeRect(l.x, y, l.w, l.h); }
        ctx.strokeStyle = '#4e2e0e';
        ctx.lineWidth = 2;
        for (let s = 1; s < 5; s++) {
            const sx = l.x + (l.w * s / 5);
            ctx.beginPath();
            ctx.moveTo(sx, y + 4);
            ctx.lineTo(sx, y + l.h - 4);
            ctx.stroke();
        }
        ctx.fillStyle = '#6e4520';
        ctx.beginPath(); ctx.arc(l.x + 4, y + l.h / 2, l.h * 0.35, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(l.x + l.w - 4, y + l.h / 2, l.h * 0.35, 0, Math.PI * 2); ctx.fill();
    }
}

function drawCars() {
    for (const c of cars) {
        const y = c.row * CELL + (CELL - c.h) / 2;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(c.x + 3, y + 4, c.w, c.h, 10); ctx.fill(); }
        else ctx.fillRect(c.x + 3, y + 4, c.w, c.h);
        ctx.fillStyle = c.color;
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(c.x, y, c.w, c.h, 10); ctx.fill(); ctx.stroke(); }
        else { ctx.fillRect(c.x, y, c.w, c.h); ctx.strokeRect(c.x, y, c.w, c.h); }
        // window
        ctx.fillStyle = 'rgba(180,230,255,0.85)';
        const wx = c.dir > 0 ? c.x + c.w * 0.45 : c.x + c.w * 0.15;
        ctx.fillRect(wx, y + 5, c.w * 0.4, c.h - 12);
        // wheels
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(c.x + c.w * 0.2, y + c.h - 2, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(c.x + c.w * 0.8, y + c.h - 2, 5, 0, Math.PI * 2); ctx.fill();
        // headlight
        ctx.fillStyle = '#fff59d';
        const hx = c.dir > 0 ? c.x + c.w - 4 : c.x + 1;
        ctx.fillRect(hx, y + c.h * 0.25, 3, c.h * 0.2);
        ctx.fillRect(hx, y + c.h * 0.55, 3, c.h * 0.2);
    }
}

function drawFrogShape(x, y, facing, hopPhase) {
    const squash = 1 + Math.sin(hopPhase * Math.PI) * 0.15;
    const stretch = 1 - Math.sin(hopPhase * Math.PI) * 0.1;
    const r = CELL * 0.4;

    ctx.save();
    ctx.translate(x, y);
    let rot = 0;
    if (facing === 'down') rot = Math.PI;
    else if (facing === 'left') rot = -Math.PI / 2;
    else if (facing === 'right') rot = Math.PI / 2;
    ctx.rotate(rot);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.9, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();

    // back legs
    ctx.fillStyle = '#388e3c';
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(-r * 0.7, r * 0.45, r * 0.35, r * 0.2, -0.6, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(r * 0.7, r * 0.45, r * 0.35, r * 0.2, 0.6, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // front legs
    ctx.beginPath();
    ctx.ellipse(-r * 0.55, -r * 0.2, r * 0.22, r * 0.14, -0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(r * 0.55, -r * 0.2, r * 0.22, r * 0.14, 0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // body
    ctx.fillStyle = '#43a047';
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * stretch, r * squash, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // belly highlight
    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.15, r * 0.55, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // spots
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(-r * 0.35, r * 0.1, r * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.05, r * 0.07, 0, Math.PI * 2); ctx.fill();

    // eye bumps
    ctx.fillStyle = '#43a047';
    ctx.strokeStyle = '#1b5e20';
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.65, r * 0.28, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.65, r * 0.28, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // whites
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.7, r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.7, r * 0.2, 0, Math.PI * 2); ctx.fill();
    // pupils
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.73, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.73, r * 0.1, 0, Math.PI * 2); ctx.fill();
    // pupil highlight
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.77, r * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.38, -r * 0.77, r * 0.04, 0, Math.PI * 2); ctx.fill();

    // smile
    ctx.strokeStyle = '#1b5e20';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -r * 0.05, r * 0.18, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
}

function drawFrog() {
    if (!frog || !frog.alive) return;
    const hopPhase = frog.hopT > 0 ? (1 - frog.hopT / frog.hopDur) : 0;
    drawFrogShape(frog.x, frog.y, frog.facing, hopPhase);
}

function drawSplashes() {
    for (const s of splashes) {
        ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 2));
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px Comic Sans MS, Arial';
    for (const p of popups) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.9));
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
}

function drawLevelBanner() {
    if (!levelBanner) return;
    const a = Math.min(1, levelBanner.life / 0.4);
    ctx.globalAlpha = a;
    ctx.font = 'bold 36px Comic Sans MS, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = levelBanner.text;
    const padX = 22, padY = 12;
    const m = ctx.measureText(text);
    const bw = m.width + padX * 2;
    const bh = 36 + padY * 2;
    const bx = W / 2 - bw / 2;
    const by = H / 2 - bh / 2;
    ctx.fillStyle = 'rgba(15,40,20,0.85)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill(); }
    else                  ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = currentLevel.color;
    ctx.lineWidth = 4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.stroke(); }
    else                  ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = currentLevel.color;
    ctx.shadowBlur = 18; ctx.shadowColor = currentLevel.color;
    ctx.fillText(text, W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
}

function render() {
    drawBg();
    drawLogs();
    drawCars();
    drawFrog();
    drawSplashes();
    drawPopups();
    drawLevelBanner();
}

// ================== Loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    update(dt);
    render();
    if (running) rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    start();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    scoreEl.textContent = '0';
    missesEl.textContent = '3';
    levelEl.textContent = '—';

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name: name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🐸 הצפרדע חוצה כביש</h2>' +
        '<p>מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">🐸 שחק</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', function (e) { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    drawBg();

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showGameOver() {
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = score === myBest && score > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === score && score > 0;
    const lvlReached = getLevelFor(score);

    let headline, msg;
    if (isKing && isNewRecord) {
        headline = '👑 מלך הצפרדעים!';
        msg = `${currentPlayer} עלה לראש הטבלה עם ${score} נקודות (${lvlReached.name})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש!';
        msg = `${currentPlayer} הגיע ל-${score} נקודות, ${lvlReached.name}!`;
    } else if (score >= 30) {
        headline = '🏆 קפיצה מוצלחת!';
        msg = `${currentPlayer} צבר ${score} נקודות (${lvlReached.name}). השיא: ${myBest}`;
    } else {
        headline = '🐸 ניסיון טוב!';
        msg = `${currentPlayer} צבר ${score} נקודות (${lvlReached.name}).<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    setTimeout(showGameOver, 600);
}

function start() {
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();
    resetGame();
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

// ================== Mute ==================
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
});

// ================== Boot ==================
drawBg();
showPlayerSelect();
</script>
</body>
</html>
