<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>חץ וקשת 🏹</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #2d5a3d, #6db36b, #a8d977);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: #fff8d6;
            text-shadow: 0 2px 0 #3a2415, 0 0 16px rgba(255,220,120,0.6);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.8em, 1.9vw, 1em);
            padding: 4px 12px;
            background: rgba(255,248,214,0.9);
            border: 3px solid #8b5a2b;
            border-radius: 25px;
            color: #3a2415;
            font-weight: bold;
        }
        #score   { color: #c97a00; }
        #arrows  { color: #b53b1e; }
        #level   { color: #2d6a4f; }
        #current-player { color: #5a3a1a; }

        #game-wrap {
            position: relative;
            width:  min(96vw, calc(100vh - 160px));
            height: min(96vw, calc(100vh - 160px));
            max-width: 96vw;
            max-height: calc(100vh - 160px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid #8b5a2b;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,200,80,0.5);
            background: #6db36b;
            touch-action: none;
            cursor: crosshair;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(20,40,25,0.93);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #ffd84a;
            text-shadow: 0 0 14px #ffd84a;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #f5f0d0;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #8b5a2b;
            border-radius: 12px;
            background: rgba(255,248,214,0.95);
            color: #3a2415;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(58,36,21,0.5); }
        .name-input:focus { border-color: #ffd84a; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #8b5a2b, #c97a00);
            color: white;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(139,90,43,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #ffd84a, #c97a00);
            color: #3a2415;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255,216,74,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,216,74,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #ffd84a; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #f5f0d0; }
        .leaderboard tr.highlight td { background: rgba(255,216,74,0.25); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #ffd84a; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,248,214,0.9);
            border: 3px solid #8b5a2b;
            color: #3a2415;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #ffd84a; }

        #hint {
            margin-top: 5px;
            color: #fff8d6;
            text-shadow: 0 1px 0 #3a2415;
            font-size: clamp(0.8em, 2vw, 0.95em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🏹 חץ וקשת 🎯</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">🎯 שלב <span id="level">1</span></div>
    <div class="status-pill">🏹 <span id="arrows">5</span></div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
</div>

<div id="game-wrap">
    <canvas id="c" width="700" height="700"></canvas>
    <div id="overlay"></div>
</div>

<p id="hint">הזז למעלה/למטה כדי לכוון · החזק וטעון · שחרר לירות 🏹</p>

<script>
'use strict';

// ================== Setup ==================
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl  = document.getElementById('score');
const arrowsEl = document.getElementById('arrows');
const levelEl  = document.getElementById('level');
const currentPlayerEl = document.getElementById('current-player');

const W = canvas.width;     // 700
const H = canvas.height;    // 700
const ARCHER_X = 90;
const ARCHER_Y = H * 0.62;
const GRAVITY = 600;

// ================== Levels ==================
// 5 shots per level. minScore = threshold to pass / reach this level.
const LEVELS = [
    { num: 1, name: 'שלב 1 · קל',           minScore: 0,   passScore: 60,  wind: 0,    targets: 2, moving: 0, bonus: 0, targetR: 70, color: '#9bff66' },
    { num: 2, name: 'שלב 2 · קל-בינוני',     minScore: 60,  passScore: 130, wind: 30,   targets: 2, moving: 0, bonus: 0, targetR: 62, color: '#cffd5e' },
    { num: 3, name: 'שלב 3 · בינוני',        minScore: 130, passScore: 210, wind: 60,   targets: 3, moving: 1, bonus: 0, targetR: 56, color: '#ffd84a' },
    { num: 4, name: 'שלב 4 · די קשה',        minScore: 210, passScore: 300, wind: 90,   targets: 3, moving: 1, bonus: 1, targetR: 50, color: '#ffb347' },
    { num: 5, name: 'שלב 5 · קשה',          minScore: 300, passScore: 400, wind: 120,  targets: 3, moving: 2, bonus: 1, targetR: 44, color: '#ff7733' },
    { num: 6, name: 'שלב 6 · קשה מאוד',     minScore: 400, passScore: 510, wind: 160,  targets: 4, moving: 2, bonus: 1, targetR: 40, color: '#ff3366' },
    { num: 7, name: 'שלב 7 · בטירוף 🔥',     minScore: 510, passScore: 630, wind: 200,  targets: 4, moving: 3, bonus: 2, targetR: 36, color: '#c92a52' },
];
function getLevelByNum(n) {
    return LEVELS[Math.max(0, Math.min(LEVELS.length - 1, n - 1))];
}

// ================== Scoreboard ==================
const STORAGE_KEY = 'rom_archery_scores_v1';
let currentPlayer = null;

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><p style="color:#aaa;font-size:0.85em;margin:0">עוד אין שחקנים — אתה תהיה הראשון! 🏹</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><table>${rows}</table></div>`;
}

// ================== Game state ==================
let running = false;
let rafId = null;
let score = 0;
let levelScore = 0;       // score earned within current level
let arrowsLeft = 5;
let currentLevel = LEVELS[0];
let bgPhase = 0;
let lastT = 0;

let aimAngle = -0.2;           // radians; - is up
let charging = false;
let chargeStart = 0;
let chargePower = 0;            // 0..1

let arrow = null;               // { x, y, vx, vy, trail: [], landed }
let targets = [];               // bullseye, balloon, bird, apple
let wind = 0;                    // px/s sideways accel
let particles = [];              // dust trails / impact
let popups = [];
let levelBanner = null;

// Keyboard
let keyUp = false, keyDown = false, keySpace = false;

function resetLevel(levelNum) {
    currentLevel = getLevelByNum(levelNum);
    levelScore = 0;
    arrowsLeft = 5;
    aimAngle = -0.2;
    charging = false;
    chargePower = 0;
    arrow = null;
    particles = [];
    popups = [];
    levelBanner = { text: currentLevel.name + ' · 5 חיצים', life: 2.0 };
    spawnTargets();
    setWind();
    updateUi();
}

function setWind() {
    const dir = Math.random() < 0.5 ? -1 : 1;
    wind = dir * (Math.random() * currentLevel.wind);
}

function spawnTargets() {
    targets = [];
    const lvl = currentLevel;
    // bullseye targets
    for (let i = 0; i < lvl.targets; i++) {
        const x = W * 0.55 + Math.random() * (W * 0.35);
        const y = H * 0.25 + Math.random() * (H * 0.5);
        targets.push({
            kind: 'bull', x, y, r: lvl.targetR,
            vy: 0, baseY: y, moving: false, alive: true,
        });
    }
    // moving bullseyes
    for (let i = 0; i < lvl.moving; i++) {
        const x = W * 0.6 + Math.random() * (W * 0.3);
        const y = H * 0.3 + Math.random() * (H * 0.4);
        targets.push({
            kind: 'bull', x, y, r: lvl.targetR - 6,
            vy: (Math.random() < 0.5 ? -1 : 1) * (80 + Math.random() * 60),
            baseY: y, range: 80 + Math.random() * 60,
            moving: true, alive: true,
        });
    }
    // bonus: apple-on-head, balloon, bird
    for (let i = 0; i < lvl.bonus; i++) {
        const kind = ['apple', 'balloon', 'bird'][Math.floor(Math.random() * 3)];
        if (kind === 'apple') {
            const x = W * 0.78 + Math.random() * (W * 0.12);
            const y = H * 0.55;
            targets.push({ kind: 'apple', x, y, r: 22, alive: true });
        } else if (kind === 'balloon') {
            const x = W * 0.65 + Math.random() * (W * 0.25);
            const y = H * 0.6 + Math.random() * (H * 0.2);
            targets.push({
                kind: 'balloon', x, y, r: 26,
                vy: -40 - Math.random() * 30, alive: true,
            });
        } else {
            const y = H * 0.15 + Math.random() * (H * 0.2);
            targets.push({
                kind: 'bird', x: W + 30, y, r: 24,
                vx: -120 - Math.random() * 60, alive: true,
            });
        }
    }
}

function updateUi() {
    scoreEl.textContent = score + levelScore;
    arrowsEl.textContent = arrowsLeft;
    levelEl.textContent = currentLevel.num;
}

// ================== Sound ==================
let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function toneSlide(f1, f2, duration, type, vol) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f1, t0);
    osc.frequency.exponentialRampToValueAtTime(f2, t0 + duration);
    gain.gain.setValueAtTime(vol == null ? 0.08 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function playDraw() { toneSlide(180, 380, 0.35, 'triangle', 0.05); }
function playRelease() {
    tone(600, 0.06, 'square', 0.16, 0);
    tone(300, 0.10, 'sawtooth', 0.12, 0.02);
}
function playWhoosh() { toneSlide(700, 400, 0.18, 'sine', 0.04); }
function playHit(points) {
    const f = 400 + points * 6;
    tone(f, 0.10, 'triangle', 0.18, 0);
    tone(f * 1.5, 0.14, 'triangle', 0.14, 0.06);
}
function playMiss() {
    tone(180, 0.18, 'sawtooth', 0.14, 0);
}
function playStart() {
    tone(523, 0.10, 'triangle', 0.18, 0);
    tone(659, 0.10, 'triangle', 0.18, 0.10);
    tone(784, 0.16, 'triangle', 0.18, 0.20);
}
function playGameOver() {
    tone(392, 0.18, 'sawtooth', 0.16, 0);
    tone(294, 0.18, 'sawtooth', 0.16, 0.18);
    tone(196, 0.35, 'sawtooth', 0.16, 0.36);
}
function playLevelUp() {
    tone(523, 0.10, 'square', 0.16, 0);
    tone(659, 0.10, 'square', 0.16, 0.10);
    tone(784, 0.10, 'square', 0.16, 0.20);
    tone(1047,0.22, 'square', 0.18, 0.30);
}
const MUSIC_NOTES = [523, 659, 784, 880, 784, 659, 523, 440];
const BASS_NOTES  = [131, 131, 175, 175, 196, 196, 131, 131];
const NOTE_MS = 240;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.04, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.04, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Input ==================
function canvasPointFromClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top)  * (H / rect.height),
    };
}

function aimFromY(py) {
    // Map y to angle -45deg..+45deg relative to archer
    const dy = py - ARCHER_Y;
    const t = Math.max(-1, Math.min(1, dy / (H * 0.45)));
    aimAngle = t * (Math.PI / 4);
}

function startCharge() {
    if (!running || arrow) return;
    if (charging) return;
    charging = true;
    chargeStart = performance.now();
    chargePower = 0;
    playDraw();
}

function releaseArrow() {
    if (!running || !charging) return;
    const dt = (performance.now() - chargeStart) / 1000;
    chargePower = Math.max(0.2, Math.min(1.5, dt)) / 1.5;
    charging = false;
    fireArrow(chargePower);
}

function fireArrow(power) {
    const speed = 280 + power * 700;
    const ang = aimAngle;
    arrow = {
        x: ARCHER_X + Math.cos(ang) * 40,
        y: ARCHER_Y + Math.sin(ang) * 40,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        angle: ang,
        trail: [],
        landed: false,
    };
    arrowsLeft--;
    updateUi();
    playRelease();
    setTimeout(playWhoosh, 60);
}

canvas.addEventListener('mousemove', function (e) {
    if (!running) return;
    const p = canvasPointFromClient(e.clientX, e.clientY);
    aimFromY(p.y);
});
canvas.addEventListener('mousedown', function (e) {
    if (!running) return;
    const p = canvasPointFromClient(e.clientX, e.clientY);
    aimFromY(p.y);
    startCharge();
});
canvas.addEventListener('mouseup', function () { releaseArrow(); });
canvas.addEventListener('mouseleave', function () { if (charging) releaseArrow(); });

canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (!running) return;
    const t = e.changedTouches[0];
    const p = canvasPointFromClient(t.clientX, t.clientY);
    aimFromY(p.y);
    startCharge();
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!running) return;
    const t = e.changedTouches[0];
    const p = canvasPointFromClient(t.clientX, t.clientY);
    aimFromY(p.y);
}, { passive: false });
canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    releaseArrow();
}, { passive: false });

document.addEventListener('keydown', function (e) {
    if (!running) return;
    if (e.key === 'ArrowUp')   { keyUp = true; e.preventDefault(); }
    if (e.key === 'ArrowDown') { keyDown = true; e.preventDefault(); }
    if (e.code === 'Space') {
        if (!keySpace) startCharge();
        keySpace = true;
        e.preventDefault();
    }
});
document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowUp')   keyUp = false;
    if (e.key === 'ArrowDown') keyDown = false;
    if (e.code === 'Space') {
        keySpace = false;
        releaseArrow();
    }
});

// ================== Update ==================
function update(dt) {
    bgPhase += dt * 0.5;

    // Keyboard aim
    if (keyUp)   aimAngle = Math.max(-Math.PI / 4, aimAngle - 1.2 * dt);
    if (keyDown) aimAngle = Math.min( Math.PI / 4, aimAngle + 1.2 * dt);

    // Charge meter
    if (charging) {
        const elapsed = (performance.now() - chargeStart) / 1000;
        chargePower = Math.max(0, Math.min(1, (elapsed - 0.2) / 1.3));
    }

    // Move targets
    for (const t of targets) {
        if (!t.alive) continue;
        if (t.kind === 'bull' && t.moving) {
            t.y += t.vy * dt;
            if (t.y < t.baseY - t.range) { t.y = t.baseY - t.range; t.vy *= -1; }
            if (t.y > t.baseY + t.range) { t.y = t.baseY + t.range; t.vy *= -1; }
        } else if (t.kind === 'balloon') {
            t.y += t.vy * dt;
            t.x += Math.sin(bgPhase + t.y * 0.01) * 12 * dt;
            if (t.y < -40) t.y = H + 40;
        } else if (t.kind === 'bird') {
            t.x += t.vx * dt;
            t.y += Math.sin(bgPhase * 2 + t.x * 0.02) * 18 * dt;
            if (t.x < -40) { t.x = W + 30; t.y = H * 0.15 + Math.random() * (H * 0.2); }
        }
    }

    // Update arrow
    if (arrow && !arrow.landed) {
        arrow.vy += GRAVITY * dt;
        arrow.vx += wind * dt;
        arrow.x  += arrow.vx * dt;
        arrow.y  += arrow.vy * dt;
        arrow.angle = Math.atan2(arrow.vy, arrow.vx);
        arrow.trail.push({ x: arrow.x, y: arrow.y, life: 0.4 });
        if (arrow.trail.length > 40) arrow.trail.shift();

        // Check hits
        let hit = false;
        for (const t of targets) {
            if (!t.alive) continue;
            const dx = arrow.x - t.x, dy = arrow.y - t.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < t.r) {
                resolveHit(t, d);
                hit = true;
                break;
            }
        }
        if (hit) {
            arrow.landed = true;
            setTimeout(advanceShot, 700);
        } else if (arrow.x > W + 40 || arrow.y > H + 40 || arrow.x < -40) {
            arrow.landed = true;
            playMiss();
            popup('פספוס!', W * 0.5, H * 0.45, '#ff5577');
            setTimeout(advanceShot, 500);
        }
    }

    // Trail particles
    for (const p of arrow ? arrow.trail : []) p.life -= dt;
    if (arrow) arrow.trail = arrow.trail.filter(p => p.life > 0);

    // Particles
    particles = particles.filter(function (p) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
        p.life -= dt;
        return p.life > 0;
    });

    // Popups
    popups = popups.filter(function (p) {
        p.y += p.vy * dt;
        p.life -= dt;
        return p.life > 0;
    });

    // Level banner
    if (levelBanner) {
        levelBanner.life -= dt;
        if (levelBanner.life <= 0) levelBanner = null;
    }
}

function resolveHit(t, d) {
    let points = 0, text = '', color = '#ffd84a';
    if (t.kind === 'bull') {
        const ringFrac = d / t.r;
        if      (ringFrac < 0.25) { points = 50; text = 'בול! +50'; color = '#ffd84a'; }
        else if (ringFrac < 0.50) { points = 30; text = '+30';      color = '#ff5577'; }
        else if (ringFrac < 0.75) { points = 20; text = '+20';      color = '#4aa3ff'; }
        else                       { points = 10; text = '+10';     color = '#222'; }
        t.alive = false;
    } else if (t.kind === 'apple') {
        points = 100; text = 'תפוח! +100'; color = '#ffd84a';
        t.alive = false;
    } else if (t.kind === 'balloon') {
        points = 30; text = 'בלון! +30'; color = '#ff6dba';
        t.alive = false;
    } else if (t.kind === 'bird') {
        points = 50; text = 'ציפור! +50'; color = '#9bff66';
        t.alive = false;
    }
    levelScore += points;
    spawnImpact(t.x, t.y, color);
    popup(text, t.x, t.y - 30, color);
    playHit(points);
    updateUi();
}

function spawnImpact(x, y, color) {
    for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 80 + Math.random() * 160;
        particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.5 + Math.random() * 0.3,
            color: color,
            r: 3 + Math.random() * 4,
        });
    }
}
function popup(text, x, y, color) {
    popups.push({ text, x, y, vy: -50, life: 1.1, color: color || '#ffd84a' });
}

function advanceShot() {
    arrow = null;
    chargePower = 0;
    // Check level end conditions
    if (arrowsLeft <= 0) {
        // End of level
        if (levelScore >= currentLevel.passScore) {
            score += levelScore;
            updateUi();
            if (currentLevel.num >= LEVELS.length) {
                // Beat the game!
                gameWin();
            } else {
                playLevelUp();
                setTimeout(() => resetLevel(currentLevel.num + 1), 500);
            }
        } else {
            score += levelScore;
            updateUi();
            gameOver();
        }
    } else {
        // Next shot — new wind
        setWind();
    }
}

// ================== Render ==================
function drawBg() {
    // Sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,   '#8fd0ff');
    g.addColorStop(0.55, '#c8e9b3');
    g.addColorStop(1,   '#6db36b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sun
    ctx.fillStyle = 'rgba(255,236,150,0.9)';
    ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, 38, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,236,150,0.25)';
    ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, 60, 0, Math.PI * 2); ctx.fill();

    // Distant hills
    ctx.fillStyle = '#5a8a4a';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.55);
    for (let x = 0; x <= W; x += 50) {
        const y = H * 0.55 + Math.sin((x + bgPhase * 20) * 0.01) * 18;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    // Nearer hill
    ctx.fillStyle = '#3d6f3a';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.7);
    for (let x = 0; x <= W; x += 60) {
        const y = H * 0.7 + Math.cos((x + bgPhase * 30) * 0.012) * 22;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    // Trees
    drawTree(W * 0.15, H * 0.62, 26);
    drawTree(W * 0.32, H * 0.68, 32);
    drawTree(W * 0.05, H * 0.66, 22);

    // Ground
    const gg = ctx.createLinearGradient(0, H * 0.78, 0, H);
    gg.addColorStop(0, '#8bbf4c');
    gg.addColorStop(1, '#4a7a2b');
    ctx.fillStyle = gg;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);

    // Waving grass blades
    ctx.strokeStyle = 'rgba(40,90,30,0.55)';
    ctx.lineWidth = 2;
    for (let x = 0; x < W; x += 14) {
        const sway = Math.sin(bgPhase * 2 + x * 0.05) * 6;
        ctx.beginPath();
        ctx.moveTo(x, H * 0.82);
        ctx.quadraticCurveTo(x + sway, H * 0.79 - 6, x + sway * 1.5, H * 0.76);
        ctx.stroke();
    }
}
function drawTree(x, y, r) {
    // Trunk
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(x - r * 0.12, y, r * 0.24, r * 0.9);
    // Foliage
    ctx.fillStyle = '#2d5a2d';
    ctx.beginPath(); ctx.arc(x, y - r * 0.2, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d7a3d';
    ctx.beginPath(); ctx.arc(x - r * 0.5, y - r * 0.05, r * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.05, r * 0.7, 0, Math.PI * 2); ctx.fill();
}

function drawArcher() {
    const ax = ARCHER_X, ay = ARCHER_Y;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(ax, ay + 70, 26, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#3a6b2d';
    ctx.fillRect(ax - 10, ay - 5, 20, 60);
    // Head
    ctx.fillStyle = '#f0c79a';
    ctx.beginPath(); ctx.arc(ax, ay - 22, 14, 0, Math.PI * 2); ctx.fill();
    // Hood
    ctx.fillStyle = '#3a6b2d';
    ctx.beginPath();
    ctx.arc(ax, ay - 24, 16, Math.PI, 2 * Math.PI);
    ctx.fill();
    // Legs
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(ax - 9, ay + 50, 8, 28);
    ctx.fillRect(ax + 1, ay + 50, 8, 28);

    // Bow at right hand
    const bx = ax + 18, by = ay + 10;
    drawBow(bx, by, aimAngle, charging ? chargePower : 0);
}

function drawBow(bx, by, angle, draw) {
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(angle);
    // Bow body (wooden arc — vertical)
    ctx.strokeStyle = '#6b3a14';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -55);
    ctx.quadraticCurveTo(28, 0, 0, 55);
    ctx.stroke();
    // Bow highlight
    ctx.strokeStyle = '#a86a30';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(2, -50);
    ctx.quadraticCurveTo(22, 0, 2, 50);
    ctx.stroke();

    // Bowstring
    const pull = draw * 22;
    ctx.strokeStyle = '#f5f0d0';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, -55);
    ctx.lineTo(-pull, 0);
    ctx.lineTo(0, 55);
    ctx.stroke();

    // Nocked arrow (when charging or idle)
    if (!arrow) {
        ctx.save();
        ctx.translate(-pull, 0);
        // Shaft
        ctx.strokeStyle = '#c9a06a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(50, 0); ctx.stroke();
        // Arrowhead
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.moveTo(50, 0);
        ctx.lineTo(44, -4);
        ctx.lineTo(60, 0);
        ctx.lineTo(44, 4);
        ctx.closePath();
        ctx.fill();
        // Feathers
        ctx.fillStyle = '#e84444';
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(-8, -5); ctx.lineTo(-2, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(-8, 5); ctx.lineTo(-2, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    ctx.restore();
}

function drawArrow(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    // Shaft
    ctx.strokeStyle = '#c9a06a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-30, 0); ctx.lineTo(20, 0); ctx.stroke();
    // Arrowhead
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.moveTo(20, 0); ctx.lineTo(14, -4); ctx.lineTo(30, 0); ctx.lineTo(14, 4); ctx.closePath();
    ctx.fill();
    // Feathers
    ctx.fillStyle = '#e84444';
    ctx.beginPath();
    ctx.moveTo(-30, 0); ctx.lineTo(-38, -5); ctx.lineTo(-22, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-30, 0); ctx.lineTo(-38, 5); ctx.lineTo(-22, 0); ctx.closePath(); ctx.fill();
    ctx.restore();

    // Trail dust
    for (const p of a.trail) {
        const alpha = Math.max(0, Math.min(1, p.life / 0.4));
        ctx.fillStyle = `rgba(220,210,180,${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawTrajectoryPreview() {
    if (!charging || arrow) return;
    const speed = 280 + chargePower * 700;
    const vx0 = Math.cos(aimAngle) * speed;
    const vy0 = Math.sin(aimAngle) * speed;
    let x = ARCHER_X + Math.cos(aimAngle) * 40;
    let y = ARCHER_Y + Math.sin(aimAngle) * 40;
    let vx = vx0, vy = vy0;
    const dt = 0.05;
    ctx.save();
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = `rgba(255,248,214,${0.35 + chargePower * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 30; i++) {
        vy += GRAVITY * dt;
        vx += wind * dt;
        x += vx * dt;
        y += vy * dt;
        if (x < 0 || x > W || y > H) break;
        ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function drawTargets() {
    for (const t of targets) {
        if (!t.alive) continue;
        if (t.kind === 'bull') drawBullseye(t);
        else if (t.kind === 'apple') drawApple(t);
        else if (t.kind === 'balloon') drawBalloon(t);
        else if (t.kind === 'bird') drawBird(t);
    }
}

function drawBullseye(t) {
    // Stand
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y + t.r);
    ctx.lineTo(t.x, t.y + t.r + 40);
    ctx.stroke();

    // Rings (outer to inner)
    const rings = [
        { r: t.r,        color: '#222' },
        { r: t.r * 0.75, color: '#3d8fff' },
        { r: t.r * 0.5,  color: '#e63946' },
        { r: t.r * 0.25, color: '#ffd84a' },
    ];
    for (const ring of rings) {
        ctx.fillStyle = ring.color;
        ctx.beginPath(); ctx.arc(t.x, t.y, ring.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(t.x, t.y, ring.r, 0, Math.PI * 2); ctx.stroke();
    }
    // Center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, Math.PI * 2); ctx.fill();
}

function drawApple(t) {
    // Little stand-person
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(t.x - 8, t.y + 22, 16, 60);
    ctx.fillStyle = '#f0c79a';
    ctx.beginPath(); ctx.arc(t.x, t.y + 18, 14, 0, Math.PI * 2); ctx.fill();
    // Apple
    ctx.fillStyle = '#e63946';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b52d3a';
    ctx.beginPath(); ctx.arc(t.x + 4, t.y + 4, t.r * 0.5, 0, Math.PI * 2); ctx.fill();
    // Leaf
    ctx.fillStyle = '#3a8a3a';
    ctx.beginPath();
    ctx.ellipse(t.x + 8, t.y - t.r * 0.8, 6, 3, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // Stem
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y - t.r * 0.8);
    ctx.lineTo(t.x, t.y - t.r * 0.95);
    ctx.stroke();
}

function drawBalloon(t) {
    ctx.fillStyle = '#ff6dba';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(t.x - 7, t.y - 8, 6, 0, Math.PI * 2); ctx.fill();
    // Tie
    ctx.fillStyle = '#b53b85';
    ctx.beginPath();
    ctx.moveTo(t.x - 4, t.y + t.r);
    ctx.lineTo(t.x + 4, t.y + t.r);
    ctx.lineTo(t.x, t.y + t.r + 6);
    ctx.closePath();
    ctx.fill();
    // String
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y + t.r + 6);
    ctx.quadraticCurveTo(t.x + 6, t.y + t.r + 25, t.x, t.y + t.r + 45);
    ctx.stroke();
}

function drawBird(t) {
    // Body
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath(); ctx.ellipse(t.x, t.y, t.r * 0.9, t.r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    // Wings flap
    const flap = Math.sin(bgPhase * 8) * 8;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y);
    ctx.lineTo(t.x - 14, t.y - 12 - flap);
    ctx.lineTo(t.x - 4, t.y - 4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(t.x, t.y);
    ctx.lineTo(t.x + 14, t.y - 12 - flap);
    ctx.lineTo(t.x + 4, t.y - 4);
    ctx.closePath(); ctx.fill();
    // Beak
    ctx.fillStyle = '#ff8a00';
    ctx.beginPath();
    ctx.moveTo(t.x - t.r * 0.85, t.y);
    ctx.lineTo(t.x - t.r * 1.15, t.y - 2);
    ctx.lineTo(t.x - t.r * 0.85, t.y + 2);
    ctx.closePath();
    ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(t.x - t.r * 0.55, t.y - 4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(t.x - t.r * 0.6, t.y - 4, 1.5, 0, Math.PI * 2); ctx.fill();
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px Comic Sans MS, Arial';
    for (const p of popups) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
}

function drawWindIndicator() {
    if (currentLevel.wind === 0) return;
    const wx = W - 90, wy = 36;
    // Background panel
    ctx.fillStyle = 'rgba(20,40,25,0.7)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(wx - 50, wy - 18, 100, 36, 8); ctx.fill(); }
    else                  ctx.fillRect(wx - 50, wy - 18, 100, 36);
    ctx.fillStyle = '#f5f0d0';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('💨 רוח', wx, wy - 4);
    // Arrow
    const dir = wind >= 0 ? 1 : -1;
    const mag = Math.abs(wind) / 200;
    ctx.strokeStyle = '#ffd84a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    const len = 18 + mag * 22;
    ctx.beginPath();
    ctx.moveTo(wx - dir * len / 2, wy + 8);
    ctx.lineTo(wx + dir * len / 2, wy + 8);
    ctx.stroke();
    // Arrowhead
    ctx.beginPath();
    ctx.moveTo(wx + dir * len / 2, wy + 8);
    ctx.lineTo(wx + dir * (len / 2 - 6), wy + 4);
    ctx.lineTo(wx + dir * (len / 2 - 6), wy + 12);
    ctx.closePath();
    ctx.fillStyle = '#ffd84a';
    ctx.fill();
}

function drawChargeMeter() {
    if (!charging) return;
    const mx = 20, my = H - 40, mw = 200, mh = 18;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(mx - 3, my - 3, mw + 6, mh + 6);
    const hue = 120 - chargePower * 120; // green to red
    ctx.fillStyle = `hsl(${hue}, 80%, 55%)`;
    ctx.fillRect(mx, my, mw * chargePower, mh);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(mx, my, mw, mh);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('כוח', mx, my - 6);
}

function drawHud() {
    // Level goal indicator (top center)
    ctx.fillStyle = 'rgba(20,40,25,0.65)';
    const text = `יעד: ${currentLevel.passScore} · יש: ${levelScore}`;
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(text).width;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2 - 12, 12, tw + 24, 28, 8); ctx.fill(); }
    else                  ctx.fillRect(W / 2 - tw / 2 - 12, 12, tw + 24, 28);
    ctx.fillStyle = '#ffd84a';
    ctx.fillText(text, W / 2, 31);
}

function drawLevelBanner() {
    if (!levelBanner) return;
    const a = Math.min(1, levelBanner.life / 0.4);
    ctx.globalAlpha = a;
    ctx.font = 'bold 36px Comic Sans MS, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = levelBanner.text;
    const padX = 22, padY = 12;
    const m = ctx.measureText(text);
    const bw = m.width + padX * 2;
    const bh = 36 + padY * 2;
    const bx = W / 2 - bw / 2;
    const by = H / 2 - bh / 2;
    ctx.fillStyle = 'rgba(20,40,25,0.9)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill(); }
    else                  ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = currentLevel.color;
    ctx.lineWidth = 4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.stroke(); }
    else                  ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = currentLevel.color;
    ctx.shadowBlur = 18; ctx.shadowColor = currentLevel.color;
    ctx.fillText(text, W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
}

function render() {
    drawBg();
    drawTargets();
    drawArcher();
    drawTrajectoryPreview();
    if (arrow) drawArrow(arrow);
    drawParticles();
    drawPopups();
    drawWindIndicator();
    drawChargeMeter();
    drawHud();
    drawLevelBanner();
}

// ================== Loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    update(dt);
    render();
    if (running) rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    start();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    scoreEl.textContent = '0';
    arrowsEl.textContent = '5';
    levelEl.textContent = '1';

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name: name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🏹 חץ וקשת</h2>' +
        '<p>מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">🏹 שחק</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', function (e) { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    drawBg();
    drawArcher();

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showGameOver(isWin) {
    const final = score;
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = final === myBest && final > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === final && final > 0;

    let headline, msg;
    if (isWin) {
        headline = '🏆 ניצחת את כל השלבים!';
        msg = `${currentPlayer} סיים את כל 7 השלבים עם ${final} נקודות! 🎉`;
    } else if (isKing && isNewRecord) {
        headline = '👑 מלך הקשתים!';
        msg = `${currentPlayer} עלה לראש הטבלה עם ${final} נקודות (שלב ${currentLevel.num})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש!';
        msg = `${currentPlayer} צבר ${final} נקודות בשלב ${currentLevel.num}!`;
    } else if (final >= 100) {
        headline = '🏹 ניסיון טוב!';
        msg = `${currentPlayer} צבר ${final} נקודות (שלב ${currentLevel.num}). השיא: ${myBest}`;
    } else {
        headline = '🏹 ניסיון טוב';
        msg = `${currentPlayer} צבר ${final} נקודות.<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    setTimeout(() => showGameOver(false), 600);
}
function gameWin() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playLevelUp();
    saveResult(currentPlayer, score);
    setTimeout(() => showGameOver(true), 600);
}

function start() {
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();
    score = 0;
    resetLevel(1);
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

// ================== Mute ==================
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
});

// ================== Boot ==================
drawBg();
showPlayerSelect();
</script>
</body>
</html>
