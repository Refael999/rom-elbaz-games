<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOX VS NOX 3D 🌳</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #1a3a2a, #2d5a3a, #4a7a3a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: white;
            text-shadow: 0 2px 0 #1a3a1a, 0 0 16px rgba(120,220,120,0.6);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.75em, 1.7vw, 0.95em);
            padding: 4px 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #4a7a3a;
            border-radius: 25px;
            color: #1a3a1a;
            font-weight: bold;
        }
        #hp        { color: #d22e2e; }
        #hunger    { color: #d2762e; }
        #wood      { color: #8b5a2b; }
        #bones     { color: #888; }
        #stone     { color: #555; }
        #score     { color: #00a86b; }
        #level     { color: #ff8a00; }
        #time-of-day { color: #1a78c2; }
        #current-player { color: #1a78c2; }

        #game-wrap {
            position: relative;
            width:  min(98vw, calc((100vh - 140px) * 16 / 9));
            height: min(55.125vw, calc(100vh - 140px));
            max-width: 98vw;
            max-height: calc(100vh - 140px);
            border: 5px solid #4a7a3a;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(74,122,58,0.6);
            background: #6cb0e8;
            overflow: hidden;
        }

        #three-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }
        #three-canvas:active { cursor: grabbing; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(15,30,20,0.94);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
            z-index: 50;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #9bff66;
            text-shadow: 0 0 14px #9bff66;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #d8f5d8;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #4a7a3a;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #1a3a1a;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(26,58,26,0.5); }
        .name-input:focus { border-color: #9bff66; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #4a7a3a, #2d5a3a);
            color: white;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(74,122,58,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 360px; margin-bottom: 10px; }
        .char-btn {
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(155,255,102,0.4);
            color: white;
            padding: 8px 4px;
            font-weight: bold;
            font-size: clamp(0.85em, 2vw, 1em);
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .char-btn.dox { border-color: #d22e2e; }
        .char-btn.nox { border-color: #7a3aa8; }
        .char-btn.rom { border-color: #3aa84a; }
        .char-btn.selected { background: rgba(155,255,102,0.25); transform: scale(1.05); }
        .char-emoji { font-size: 1.7em; display: block; margin-bottom: 2px; }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #9bff66, #4a7a3a);
            color: #1a3a1a;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(155,255,102,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(155,255,102,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #9bff66; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #d8f5d8; }
        .leaderboard tr.highlight td { background: rgba(155,255,102,0.25); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #9bff66; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #4a7a3a;
            color: #1a3a1a;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #9bff66; }

        #hint {
            margin-top: 5px;
            color: white;
            text-shadow: 0 1px 0 #1a3a1a;
            font-size: clamp(0.75em, 1.8vw, 0.9em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }

        /* --- In-game HUD --- */
        #build-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.55);
            padding: 6px 10px;
            border-radius: 14px;
            border: 2px solid #9bff66;
            z-index: 20;
            direction: ltr;
        }
        .build-btn {
            background: rgba(255,255,255,0.85);
            color: #1a3a1a;
            border: 2px solid transparent;
            padding: 6px 10px;
            font-size: clamp(0.7em, 1.6vw, 0.85em);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-width: 56px;
            text-align: center;
            line-height: 1.1;
        }
        .build-btn.active { background: #9bff66; border-color: #1a3a1a; }
        .build-btn .be { font-size: 1.2em; display: block; }

        #night-banner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,15,40,0.85);
            border: 4px solid #c08bff;
            color: #fff;
            padding: 16px 32px;
            border-radius: 18px;
            font-size: clamp(1.3em, 4vw, 2.4em);
            font-weight: bold;
            text-shadow: 0 0 12px #c08bff;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #night-banner.show { opacity: 1; }

        /* Touch controls */
        #touch-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        body.touch #touch-controls { display: block; }

        #joystick {
            position: absolute;
            bottom: 14px;
            left: 14px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(0,0,0,0.25);
            border: 3px solid rgba(255,255,255,0.4);
            pointer-events: auto;
            touch-action: none;
        }
        #joy-knob {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(155,255,102,0.85);
            border: 3px solid #1a3a1a;
            pointer-events: none;
        }

        .touch-btn {
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            color: white;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid rgba(255,255,255,0.6);
            pointer-events: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .touch-btn:active { transform: scale(0.92); }
        #btn-attack {
            bottom: 80px; right: 14px;
            width: 78px; height: 78px;
            background: rgba(180,40,40,0.75);
            font-size: 2em;
        }
        #btn-action {
            bottom: 14px; right: 100px;
            width: 64px; height: 64px;
            background: rgba(220,180,40,0.75);
            font-size: 1.5em;
        }
        #btn-build {
            bottom: 14px; right: 14px;
            width: 64px; height: 64px;
            background: rgba(40,120,200,0.75);
            font-size: 1.5em;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        body.has-build-ghost #crosshair { display: block; }

        /* --- Tutorial panel --- */
        #tutorial {
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15,30,20,0.88);
            border: 3px solid #9bff66;
            border-radius: 14px;
            padding: 8px 14px;
            max-width: 90%;
            text-align: center;
            z-index: 26;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: none;
        }
        #tutorial .tut-text { font-size: clamp(0.8em, 2vw, 1.05em); font-weight: bold; color: #eafff0; }
        #tutorial .tut-skip {
            display: inline-block; margin-top: 4px;
            font-size: 0.78em; color: #9bff66; text-decoration: underline;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }

        /* --- Quest tracker --- */
        #quests {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(15,30,20,0.78);
            border: 2px solid rgba(155,255,102,0.7);
            border-radius: 12px;
            padding: 6px 10px;
            z-index: 18;
            max-width: 46%;
            font-size: clamp(0.64em, 1.5vw, 0.8em);
            direction: rtl;
            display: none;
        }
        #quests .q-title { color: #9bff66; font-weight: bold; margin-bottom: 3px; font-size: 1.05em; }
        .q-row { color: #d8f5d8; padding: 1px 0; line-height: 1.35; }
        .q-row.done { color: #8fd98f; text-decoration: line-through; opacity: 0.75; }
        .q-row .q-prog { color: #ffdd57; font-weight: bold; }

        /* --- Toast --- */
        #toast {
            position: absolute;
            top: 64px; left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(20,40,25,0.92);
            border: 3px solid #ffdd57;
            color: #fff;
            padding: 8px 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: clamp(0.9em, 2.4vw, 1.2em);
            text-shadow: 0 0 10px #ffdd57;
            z-index: 40;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* --- Minimap --- */
        #minimap {
            position: absolute;
            top: 8px; left: 8px;
            width: 116px; height: 116px;
            border-radius: 12px;
            border: 3px solid rgba(155,255,102,0.8);
            background: rgba(10,25,15,0.55);
            z-index: 18;
            pointer-events: none;
        }
        body.touch #minimap { width: 92px; height: 92px; }

        /* --- Boss health bar --- */
        #boss-bar {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            width: 70%; max-width: 360px;
            z-index: 28;
            text-align: center;
            display: none;
        }
        #boss-bar .boss-name {
            color: #ff7a7a; font-weight: bold;
            font-size: clamp(0.85em, 2.3vw, 1.15em);
            text-shadow: 0 0 10px #ff2222; margin-bottom: 2px;
        }
        #boss-bar .boss-track {
            width: 100%; height: 16px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff5555;
            border-radius: 10px; overflow: hidden;
        }
        #boss-bar .boss-fill {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8844);
            transition: width 0.2s;
        }

        /* --- Inventory / Crafting panels --- */
        .panel-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,20,14,0.55);
            display: none;
            align-items: center; justify-content: center;
            z-index: 45;
            direction: rtl;
        }
        .panel-overlay.show { display: flex; }
        .panel-box {
            background: rgba(18,34,24,0.97);
            border: 4px solid #9bff66;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 92%;
            max-height: 88%;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        .panel-box h3 {
            color: #9bff66; text-align: center;
            font-size: clamp(1em, 3vw, 1.4em); margin-bottom: 8px;
            text-shadow: 0 0 10px #9bff66;
        }
        .panel-close {
            float: left; background: rgba(255,90,90,0.85);
            color: white; border: none; border-radius: 50%;
            width: 30px; height: 30px; font-size: 1em; font-weight: bold;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
            gap: 8px; margin-top: 6px; min-width: min(80vw, 340px);
        }
        .inv-slot {
            background: rgba(0,0,0,0.35);
            border: 2px solid rgba(155,255,102,0.4);
            border-radius: 12px;
            padding: 6px 2px; text-align: center;
        }
        .inv-slot .inv-emoji { font-size: 1.7em; display: block; }
        .inv-slot .inv-label { font-size: 0.7em; color: #d8f5d8; }
        .inv-slot .inv-count { font-size: 1.05em; font-weight: bold; color: #ffdd57; }

        .craft-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; min-width: min(80vw, 340px); }
        .craft-item {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.35);
            border: 2px solid rgba(155,255,102,0.4);
            border-radius: 12px; padding: 8px 10px;
        }
        .craft-item.locked { opacity: 0.5; border-color: rgba(150,150,150,0.4); }
        .craft-emoji { font-size: 1.8em; }
        .craft-info { flex: 1; }
        .craft-name { font-weight: bold; color: #eafff0; font-size: 0.95em; }
        .craft-cost { font-size: 0.78em; color: #ffdd57; }
        .craft-desc { font-size: 0.72em; color: #b8d8b8; }
        .craft-btn {
            background: linear-gradient(135deg, #9bff66, #4a7a3a);
            color: #1a3a1a; border: none; border-radius: 12px;
            padding: 8px 12px; font-weight: bold; cursor: pointer;
            -webkit-tap-highlight-color: transparent; font-size: 0.85em;
        }
        .craft-btn:disabled { background: rgba(120,120,120,0.5); color: #ddd; cursor: not-allowed; }

        /* extra touch buttons (inventory / craft) */
        #btn-inv {
            bottom: 90px; right: 100px;
            width: 56px; height: 56px;
            background: rgba(120,90,40,0.8);
            font-size: 1.4em;
        }
        #btn-craft {
            bottom: 90px; right: 14px;
            width: 56px; height: 56px;
            background: rgba(150,80,40,0.8);
            font-size: 1.4em;
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🌳 DOX VS NOX — שורד התלת-ממד 🌙</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">❤️ <span id="hp">100</span></div>
    <div class="status-pill">🍞 <span id="hunger">100</span></div>
    <div class="status-pill">🪵 <span id="wood">0</span></div>
    <div class="status-pill">🪨 <span id="stone">0</span></div>
    <div class="status-pill">🦴 <span id="bones">0</span></div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
    <div class="status-pill">🎯 <span id="level">1</span></div>
    <div class="status-pill"><span id="time-of-day">☀️</span></div>
</div>

<div id="game-wrap">
    <canvas id="three-canvas"></canvas>
    <div id="crosshair"></div>
    <div id="night-banner"></div>

    <div id="build-bar" style="display:none"></div>

    <canvas id="minimap" width="116" height="116"></canvas>
    <div id="tutorial"><div class="tut-text"></div><span class="tut-skip">דלג ✖️</span></div>
    <div id="quests"></div>
    <div id="toast"></div>
    <div id="boss-bar">
        <div class="boss-name">👹</div>
        <div class="boss-track"><div class="boss-fill"></div></div>
    </div>

    <div id="touch-controls">
        <div id="joystick"><div id="joy-knob"></div></div>
        <div class="touch-btn" id="btn-attack">⚔️</div>
        <div class="touch-btn" id="btn-action">🤝</div>
        <div class="touch-btn" id="btn-build">🏗️</div>
        <div class="touch-btn" id="btn-inv">🎒</div>
        <div class="touch-btn" id="btn-craft">🔨</div>
    </div>

    <div class="panel-overlay" id="inv-panel">
        <div class="panel-box">
            <button class="panel-close" data-close="inv">✖️</button>
            <h3>🎒 התיק שלי</h3>
            <div class="inv-grid" id="inv-grid"></div>
        </div>
    </div>

    <div class="panel-overlay" id="craft-panel">
        <div class="panel-box">
            <button class="panel-close" data-close="craft">✖️</button>
            <h3>🔨 ייצור</h3>
            <div class="craft-list" id="craft-list"></div>
        </div>
    </div>

    <div id="overlay"></div>
</div>

<p id="hint">🎮 WASD לזוז · רווח לחטוב · B לבנות · E לאסוף · G לכלב · I תיק · C ייצור 🌳</p>

<script>
'use strict';

// ================== Detect touch ==================
const IS_TOUCH = ('ontouchstart' in window) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
if (IS_TOUCH) document.body.classList.add('touch');

// ================== DOM ==================
const wrap     = document.getElementById('game-wrap');
const canvas   = document.getElementById('three-canvas');
const overlay  = document.getElementById('overlay');
const hpEl     = document.getElementById('hp');
const hungerEl = document.getElementById('hunger');
const woodEl   = document.getElementById('wood');
const stoneEl  = document.getElementById('stone');
const bonesEl  = document.getElementById('bones');
const scoreEl  = document.getElementById('score');
const levelEl  = document.getElementById('level');
const todEl    = document.getElementById('time-of-day');
const currentPlayerEl = document.getElementById('current-player');
const buildBarEl = document.getElementById('build-bar');
const nightBannerEl = document.getElementById('night-banner');
const tutorialEl = document.getElementById('tutorial');
const questsEl = document.getElementById('quests');
const toastEl = document.getElementById('toast');
const minimapEl = document.getElementById('minimap');
const minimapCtx = minimapEl.getContext('2d');

// ================== Persistence ==================
const STORAGE_KEY = 'rom_doxnox_scores_v1';
let currentPlayer = null;
let currentCharKey = 'dox';

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השורדים</div><p style="color:#aaa;font-size:0.85em;margin:0">עוד אין שורדים — אתה תהיה הראשון! 🌳</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השורדים</div><table>${rows}</table></div>`;
}

let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}

let MUSIC_NOTES = MUSIC_NOTES_DAY;
let BASS_NOTES  = BASS_NOTES_DAY;
const NOTE_MS = 260;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.045, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.05, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Build world ==================
function initThree() {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    resizeRenderer();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x88c8ff);
    scene.fog = new THREE.Fog(0x88c8ff, 30, 130);

    camera = new THREE.PerspectiveCamera(75, getAspect(), 0.1, 500);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 1, 0);

    ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);

    sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(40, 60, 20);
    scene.add(sun);

    sunMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 10), MAT.sunM);
    scene.add(sunMesh);
    moonMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 12, 10), MAT.moonM);
    scene.add(moonMesh);
    moonMesh.visible = false;
}

function getAspect() {
    const r = wrap.getBoundingClientRect();
    return Math.max(0.5, r.width / Math.max(1, r.height));
}

function resizeRenderer() {
    const r = wrap.getBoundingClientRect();
    const w = Math.max(2, Math.floor(r.width));
    const h = Math.max(2, Math.floor(r.height));
    renderer.setSize(w, h, false);
    if (camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
}

function buildWorld() {
    worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(WORLD_HALF * 2, WORLD_HALF * 2, 16, 16);
    // Color variation via vertex colors
    const colors = [];
    const baseColor = new THREE.Color(0x4f8a3a);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const c = baseColor.clone();
        const v = 0.85 + Math.random() * 0.3;
        c.r *= v; c.g *= v; c.b *= v;
        colors.push(c.r, c.g, c.b);
    }
    groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true });
    groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0;
    worldGroup.add(groundMesh);

    // Sand ring around lake
    const sandGeo = new THREE.RingGeometry(LAKE_R, LAKE_R + 3, 32);
    sandMesh = new THREE.Mesh(sandGeo, MAT.sand);
    sandMesh.rotation.x = -Math.PI / 2;
    sandMesh.position.set(LAKE_X, 0.02, LAKE_Z);
    worldGroup.add(sandMesh);

    // Lake
    const lakeGeo = new THREE.CircleGeometry(LAKE_R, 32);
    lakeMesh = new THREE.Mesh(lakeGeo, MAT.lake);
    lakeMesh.rotation.x = -Math.PI / 2;
    lakeMesh.position.set(LAKE_X, 0.04, LAKE_Z);
    worldGroup.add(lakeMesh);

    // Trees
    for (let i = 0; i < 70; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnTree(p.x, p.z);
    }
    // Stones
    for (let i = 0; i < 25; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnStone(p.x, p.z);
    }
    // Bushes
    for (let i = 0; i < 14; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnBush(p.x, p.z);
    }
    // Bones
    for (let i = 0; i < 6; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnBoneItem(p.x, p.z);
    }
}

function inLake(x, z) {
    const dx = x - LAKE_X, dz = z - LAKE_Z;
    return (dx * dx + dz * dz) < (LAKE_R + 1.5) * (LAKE_R + 1.5);
}
function randomLandPoint() {
    for (let t = 0; t < 30; t++) {
        const x = (Math.random() * 2 - 1) * (WORLD_HALF - 6);
        const z = (Math.random() * 2 - 1) * (WORLD_HALF - 6);
        if (inLake(x, z)) continue;
        if (Math.hypot(x, z) < 6) continue; // keep spawn area clear
        return { x, z };
    }
    return null;
}

function spawnTree(x, z) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(GEO.trunk, MAT.trunk);
    trunk.position.y = 1.2;
    g.add(trunk);
    const useCone = Math.random() < 0.7;
    const canopy = new THREE.Mesh(useCone ? GEO.canopy : GEO.canopy2, useCone ? MAT.canopy : MAT.canopy2);
    canopy.position.y = useCone ? 3.4 : 3.0;
    g.add(canopy);
    g.position.set(x, 0, z);
    worldGroup.add(g);
    trees.push({ mesh: g, x, z, hp: 3, falling: false, fallT: 0, alive: true });
}

function spawnStone(x, z) {
    const m = new THREE.Mesh(GEO.stone, MAT.stone);
    m.position.set(x, 0.45, z);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    const s = 0.7 + Math.random() * 0.7;
    m.scale.set(s, s * 0.8, s);
    worldGroup.add(m);
    stones.push({ mesh: m, x, z, hp: 3, alive: true });
}

function spawnBush(x, z) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(GEO.bush, MAT.bush);
    b.position.y = 0.45;
    g.add(b);
    const berries = [];
    for (let i = 0; i < 5; i++) {
        const br = new THREE.Mesh(GEO.berry, MAT.berry);
        const a = (i / 5) * Math.PI * 2;
        br.position.set(Math.cos(a) * 0.45, 0.55 + Math.random() * 0.2, Math.sin(a) * 0.45);
        g.add(br);
        berries.push(br);
    }
    g.position.set(x, 0, z);
    worldGroup.add(g);
    bushes.push({ mesh: g, x, z, ripe: true, regrow: 0, berries });
}

function spawnBoneItem(x, z) {
    const m = new THREE.Mesh(GEO.boneG, MAT.bone);
    m.position.set(x, 0.2, z);
    m.rotation.y = Math.random() * Math.PI;
    worldGroup.add(m);
    boneItems.push({ mesh: m, x, z });
}

function buildHumanoid(charKey, scale, withAxe) {
    const ch = CHARS[charKey] || CHARS.dox;
    const g = new THREE.Group();

function buildEnemyMesh(type) {
    const g = new THREE.Group();
    let mat = MAT.zombie, bodyH = 0.7, height = 1.6;
    if (type === 'wolf') { mat = MAT.wolf; bodyH = 0.5; height = 1.2; }
    else if (type === 'bear') { mat = MAT.bear; bodyH = 0.9; height = 2.0; }
    else if (type === 'zombie') { mat = MAT.zombie; bodyH = 0.8; height = 1.8; }

    if (type === 'wolf') {
        // quadruped
        const body = new THREE.Mesh(GEO.dogBody, mat);
        body.rotation.z = Math.PI / 2;
        body.scale.set(1.3, 1.3, 1.3);
        body.position.y = 0.7;
        g.add(body);
        const head = new THREE.Mesh(GEO.dogHead, mat);
        head.scale.set(1.3, 1.3, 1.3);
        head.position.set(0, 0.95, 0.75);
        g.add(head);
        // glowing eyes
        const eye = new THREE.SphereGeometry(0.06, 6, 5);
        const em = new THREE.MeshBasicMaterial({ color: 0xff2222 });
        const ey1 = new THREE.Mesh(eye, em); ey1.position.set(-0.1, 1.0, 0.95);
        const ey2 = new THREE.Mesh(eye, em); ey2.position.set( 0.1, 1.0, 0.95);
        g.add(ey1); g.add(ey2);
        const legOffsets = [[-0.22, 0.55], [0.22, 0.55], [-0.22, -0.3], [0.22, -0.3]];
        for (const [lx, lz] of legOffsets) {
            const l = new THREE.Mesh(GEO.dogLeg, mat);
            l.position.set(lx, 0.22, lz);
            l.scale.set(1.3, 1.3, 1.3);
            g.add(l);
        }
    } else {
        // bipedal
        const body = new THREE.Mesh(GEO.bodyG, mat);
        const s = type === 'bear' ? 1.45 : 1.0;
        body.scale.set(s, s, s);
        body.position.y = 1.05 * s;
        g.add(body);
        const head = new THREE.Mesh(GEO.headG, mat);
        head.scale.set(s, s, s);
        head.position.y = 1.95 * s;
        g.add(head);
        const eye = new THREE.SphereGeometry(0.05, 6, 5);
        const em = new THREE.MeshBasicMaterial({ color: type === 'zombie' ? 0xffff66 : 0xff3322 });
        const ey1 = new THREE.Mesh(eye, em); ey1.position.set(-0.1 * s, 1.95 * s, 0.3 * s);
        const ey2 = new THREE.Mesh(eye, em); ey2.position.set( 0.1 * s, 1.95 * s, 0.3 * s);
        g.add(ey1); g.add(ey2);
        // arms / legs
        const armL = new THREE.Mesh(GEO.armG, mat); armL.position.set(-0.5 * s, 1.15 * s, 0); armL.scale.set(s, s, s); g.add(armL);
        const armR = new THREE.Mesh(GEO.armG, mat); armR.position.set( 0.5 * s, 1.15 * s, 0); armR.scale.set(s, s, s); g.add(armR);
        const legL = new THREE.Mesh(GEO.legG, mat); legL.position.set(-0.18 * s, 0.35 * s, 0); legL.scale.set(s, s, s); g.add(legL);
        const legR = new THREE.Mesh(GEO.legG, mat); legR.position.set( 0.18 * s, 0.35 * s, 0); legR.scale.set(s, s, s); g.add(legR);
    }
    return g;
}

// ================== Camera follow ==================
function updateCamera(dt) {
    if (!player) return;
    const px = player.mesh.position.x;
    const py = player.mesh.position.y;
    const pz = player.mesh.position.z;

    // Camera offset from yaw + pitch
    const cosP = Math.cos(camPitch);
    const sinP = Math.sin(camPitch);
    const ox = -Math.sin(camYaw) * CAM_DIST * cosP;
    const oz = -Math.cos(camYaw) * CAM_DIST * cosP;
    const oy = CAM_DIST * sinP + 1.2;

    camTarget.set(px + ox, py + oy, pz + oz);
    camPos.lerp(camTarget, Math.min(1, dt * 8));
    camera.position.copy(camPos);
    camera.lookAt(px, py + 1.5, pz);
}

// ================== Day/night ==================
function updateDayNight(dt) {
    dayTime += dt;
    const phase = dayTime % FULL_CYCLE;
    const wasNight = isNight;
    isNight = phase >= DAY_LEN;

    if (isNight !== wasNight) {
        if (isNight) {
            nightCount++;
            showNightBanner('🌙 לילה ' + nightCount + '!');
            MUSIC_NOTES = MUSIC_NOTES_NIGHT;
            BASS_NOTES  = BASS_NOTES_NIGHT;
            playNight();
            spawnNightEnemies();
            if (nightCount >= 5 && bossSpawnedNight === 0) {
                bossSpawnedNight = nightCount;
                spawnBoss();
            }
            saveWorld();
        } else {
            showNightBanner('☀️ יום ' + (nightCount + 1));
            MUSIC_NOTES = MUSIC_NOTES_DAY;
            BASS_NOTES  = BASS_NOTES_DAY;
            playDay();
            // survived a night
            missionProgress('nights', nightCount);
            // Clear remaining enemies on daybreak (boss survives until killed)
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (enemies[i].isBoss) continue;
                scene.remove(enemies[i].mesh);
                enemies.splice(i, 1);
            }
        }
    }

    // Day progress 0..1
    let t01;
    if (!isNight) {
        t01 = phase / DAY_LEN; // 0..1 day arc
    } else {
        t01 = 1 + (phase - DAY_LEN) / NIGHT_LEN; // 1..2 night
    }

    // Sun arc: rises east, sets west
    const dayProg = !isNight ? t01 : 0;
    const nightProg = isNight ? (t01 - 1) : 0;

    // Sun position (visible during day)
    const sunAng = !isNight ? (t01 * Math.PI) : Math.PI;
    sun.position.set(Math.cos(sunAng) * 60, Math.sin(sunAng) * 50 + 10, 20);
    sunMesh.position.copy(sun.position).multiplyScalar(1.5);
    sunMesh.visible = !isNight;

    // Moon
    moonMesh.visible = isNight;
    if (isNight) {
        const mAng = nightProg * Math.PI;
        moonMesh.position.set(Math.cos(mAng) * 60, Math.sin(mAng) * 50 + 8, -20);
    }

    // Sun intensity & color
    if (!isNight) {
        sun.intensity = 0.55 + Math.sin(t01 * Math.PI) * 0.6;
        ambient.intensity = 0.45 + Math.sin(t01 * Math.PI) * 0.25;
    } else {
        sun.intensity = 0.05;
        ambient.intensity = 0.18;
    }

    // Sky color
    let skyColor;
    if (!isNight) {
        // 0 sunrise pink, 0.5 daylight blue, 1 sunset orange
        if (t01 < 0.15) {
            skyColor = lerpColor(0xffc7d8, 0x88c8ff, t01 / 0.15);
        } else if (t01 < 0.85) {
            skyColor = 0x88c8ff;
        } else {
            skyColor = lerpColor(0x88c8ff, 0xffa44a, (t01 - 0.85) / 0.15);
        }
    } else {
        if (nightProg < 0.15) {
            skyColor = lerpColor(0xffa44a, 0x14143a, nightProg / 0.15);
        } else if (nightProg < 0.85) {
            skyColor = 0x14143a;
        } else {
            skyColor = lerpColor(0x14143a, 0xffc7d8, (nightProg - 0.85) / 0.15);
        }
    }
    scene.background.setHex(skyColor);
    scene.fog.color.setHex(skyColor);
    if (isNight) {
        scene.fog.near = 8;
        scene.fog.far = 60;
    } else {
        scene.fog.near = 30;
        scene.fog.far = 130;
    }

    // UI
    todEl.textContent = isNight ? ('🌙 לילה ' + nightCount) : '☀️ יום';
}

function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return (r << 16) | (g << 8) | bl;
}

function showNightBanner(text) {
    nightBannerEl.textContent = text;
    nightBannerEl.classList.add('show');
    setTimeout(() => nightBannerEl.classList.remove('show'), 2000);
}

function spawnNightEnemies() {
    const want = currentLevel.enemyCount;
    let spawned = 0;
    while (spawned < want) {
        const r = Math.random();
        if (currentLevel.num >= 3 && r < 0.18) {
            spawnEnemy('bear'); spawned++;
        } else if (r < 0.5) {
            // wolves hunt in small packs
            const pack = 1 + Math.floor(Math.random() * 2);
            for (let p = 0; p < pack && spawned < want; p++) { spawnEnemy('wolf'); spawned++; }
        } else {
            // zombies come in larger numbers
            const horde = 1 + Math.floor(Math.random() * 2);
            for (let p = 0; p < horde && spawned < want; p++) { spawnEnemy('zombie'); spawned++; }
        }
    }
}

window.addEventListener('keydown', e => {
    // Store BOTH the key character AND the physical code so the game works
    // with Hebrew, Russian, or any other keyboard layout.
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
    if (e.key === 'Escape') {
        if (invOpen) { toggleInventory(false); return; }
        if (craftOpen) { toggleCraft(false); return; }
        if (buildMode) { toggleBuild(); return; }
    }
    if (invOpen || craftOpen) return;   // panels open: ignore game keys
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); doSwing(); }
    if (e.key.toLowerCase() === 'b' || e.code === 'KeyB') toggleBuild();
    if (e.key.toLowerCase() === 'e' || e.code === 'KeyE') tryInteract();
    if (e.key.toLowerCase() === 'g' || e.code === 'KeyG') tryGiveBone();
    if (e.key.toLowerCase() === 'i' || e.code === 'KeyI') toggleInventory();
    if (e.key.toLowerCase() === 'c' || e.code === 'KeyC') toggleCraft();
    if (e.key >= '1' && e.key <= '9' && buildMode) {
        const bi = parseInt(e.key, 10) - 1;
        if (bi < BUILDS.length) { buildIndex = bi; updateBuildBarUi(); spawnBuildGhost(); }
    }
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
});

canvas.addEventListener('mousedown', e => {
    if (!running) return;
    if (e.button === 0) {
        if (buildMode) tryPlaceBuilding();
        else doSwing();
    }
    mouseDown = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
window.addEventListener('mousemove', e => {
    if (!running) return;
    if (mouseDown) {
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        camYaw   -= dx * 0.006;
        camPitch += dy * 0.004;
        camPitch = Math.max(0.05, Math.min(1.1, camPitch));
    }
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

// Touch controls — virtual joystick + camera drag on right half
const joystickEl = document.getElementById('joystick');
const joyKnobEl  = document.getElementById('joy-knob');

function joyHandle(touch, type) {
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const max = rect.width / 2 - 8;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joyKnobEl.style.left = (rect.width / 2 + dx) + 'px';
    joyKnobEl.style.top  = (rect.height / 2 + dy) + 'px';
    joyKnobEl.style.transform = 'translate(-50%, -50%)';
    joyDX = dx / max;
    joyDY = dy / max;
}
function joyReset() {
    joyActive = false; joyTouchId = null;
    joyDX = 0; joyDY = 0;
    joyKnobEl.style.left = '50%';
    joyKnobEl.style.top  = '50%';
    joyKnobEl.style.transform = 'translate(-50%, -50%)';
}

joystickEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joyTouchId === null) {
        const t = e.changedTouches[0];
        joyTouchId = t.identifier;
        joyActive = true;
        joyHandle(t);
    }
}, { passive: false });
joystickEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joyTouchId) { joyHandle(t); break; }
    }
}, { passive: false });
function joyEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) { joyReset(); break; }
    }
}
joystickEl.addEventListener('touchend', joyEnd);
joystickEl.addEventListener('touchcancel', joyEnd);

// Camera drag on canvas (right side) — but exclude touches on joystick / buttons
canvas.addEventListener('touchstart', e => {
    if (!running) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const rect = canvas.getBoundingClientRect();
        const lx = t.clientX - rect.left;
        if (lx > rect.width / 2 && camTouchId === null) {
            camTouchId = t.identifier;
            camLastTX = t.clientX;
            camLastTY = t.clientY;
            camDragActive = true;
            return;
        }
    }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    if (camTouchId === null) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === camTouchId) {
            const dx = t.clientX - camLastTX;
            const dy = t.clientY - camLastTY;
            camYaw   -= dx * 0.008;
            camPitch += dy * 0.006;
            camPitch = Math.max(0.05, Math.min(1.1, camPitch));
            camLastTX = t.clientX; camLastTY = t.clientY;
        }
    }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === camTouchId) {
            camTouchId = null; camDragActive = false;
        }
    }
});

// ================== Build mode ==================
function toggleBuild() {
    if (invOpen) toggleInventory(false);
    if (craftOpen) toggleCraft(false);
    buildMode = !buildMode;
    if (buildMode) {
        tutorialMark('built');
        buildBarEl.style.display = 'flex';
        updateBuildBarUi();
        spawnBuildGhost();
        document.body.classList.add('has-build-ghost');
    } else {
        buildBarEl.style.display = 'none';
        if (buildGhostMesh) { scene.remove(buildGhostMesh); buildGhostMesh = null; }
        document.body.classList.remove('has-build-ghost');
    }
}

function updateBuildBarUi() {
    buildBarEl.innerHTML = BUILDS.map((b, i) =>
        `<div class="build-btn${i === buildIndex ? ' active' : ''}" data-i="${i}">
            <span class="be">${b.icon}</span>${b.name}<br>${b.wood ? '🪵' + b.wood : ''}${b.stone ? '🪨' + b.stone : ''}
        </div>`
    ).join('');
    buildBarEl.querySelectorAll('.build-btn').forEach(el => {
        el.addEventListener('click', () => {
            buildIndex = parseInt(el.dataset.i, 10);
            updateBuildBarUi();
            spawnBuildGhost();
        });
        el.addEventListener('touchstart', e => {
            e.preventDefault();
            buildIndex = parseInt(el.dataset.i, 10);
            updateBuildBarUi();
            spawnBuildGhost();
        }, { passive: false });
    });
}

function spawnBuildGhost() {
    if (buildGhostMesh) { scene.remove(buildGhostMesh); buildGhostMesh = null; }
    const b = BUILDS[buildIndex];
    const g = new THREE.BoxGeometry(b.w, b.h, b.d);
    buildGhostMesh = new THREE.Mesh(g, MAT.ghost);
    scene.add(buildGhostMesh);
}

function getBuildTarget() {
    // Ghost position: ~3 units in front of player along camera-forward (horizontal)
    const fx = Math.sin(camYaw);
    const fz = Math.cos(camYaw);
    const x = player.x + fx * 3.5;
    const z = player.z + fz * 3.5;
    return { x, z, yaw: camYaw };
}

function updateBuildGhost() {
    if (!buildGhostMesh) return;
    const b = BUILDS[buildIndex];
    const t = getBuildTarget();
    buildGhostMesh.position.set(t.x, b.h / 2, t.z);
    buildGhostMesh.rotation.y = t.yaw;
}

function tryPlaceBuilding() {
    const b = BUILDS[buildIndex];
    if (player.wood < b.wood || player.stone < b.stone) {
        popupText('אין מספיק חומרים', 0xff5555);
        return;
    }
    const t = getBuildTarget();
    if (inLake(t.x, t.z)) return;
    player.wood  -= b.wood;
    player.stone -= b.stone;
    addBuilding(b.key, t.x, t.z, t.yaw);
    playBuild();
    // shelter mission counts wall + swall pieces
    if (b.key === 'wall' || b.key === 'swall') {
        const walls = buildings.filter(bb => bb.type === 'wall' || bb.type === 'swall').length;
        missionProgress('shelter', walls);
    }
    updateHud();
}

// Build a structure mesh from its type. Returns the building record.
function buildingMeshFor(key, x, z, yaw) {
    const b = BUILDS.find(bb => bb.key === key);
    if (b) {
        const g = new THREE.BoxGeometry(b.w, b.h, b.d);
        const opacity = (key === 'window') ? 0.5 : 1;
        const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({
            color: b.color, transparent: opacity < 1, opacity
        }));
        m.position.set(x, b.h / 2, z);
        m.rotation.y = yaw || 0;
        return m;
    }
    return null;
}

function addBuilding(key, x, z, yaw) {
    const m = buildingMeshFor(key, x, z, yaw);
    if (!m) return null;
    scene.add(m);
    const rec = { mesh: m, x, z, yaw: yaw || 0, type: key, hp: 100, open: false };
    buildings.push(rec);
    return rec;
}

// Crafted placeables: campfire & trap, placed in front of player.
function placeCraftedBuild(kind) {
    const t = getBuildTarget();
    placeCraftedAt(kind, t.x, t.z, true);
}

// ================== Interactions ==================
function tryInteract() {
    if (!player) return;
    // Bed: sleep to skip the night (only at night, no enemies very close)
    for (const b of buildings) {
        if (b.type !== 'bed') continue;
        if (Math.hypot(player.x - b.x, player.z - b.z) < 2.0) {
            if (!isNight) { showToast('🛏️ אפשר לישון רק בלילה'); return; }
            const enemyNear = enemies.some(e => Math.hypot(e.x - player.x, e.z - player.z) < 8);
            if (enemyNear) { showToast('😱 יש אויבים קרובים מדי!'); return; }
            // skip to next morning
            const phase = dayTime % FULL_CYCLE;
            dayTime += (FULL_CYCLE - phase) + 0.1;
            player.hp = Math.min(player.hpMax, player.hp + 35);
            playDay();
            spawnParticles(player.x, 1.6, player.z, 0x9bff66, 14);
            showToast('😴 ישנת! בוקר טוב ☀️');
            updateHud();
            return;
        }
    }
    // Berries pickup
    for (const bush of bushes) {
        if (!bush.ripe) continue;
        if (Math.hypot(player.x - bush.x, player.z - bush.z) < 1.6) {
            bush.ripe = false;
            bush.regrow = 20;
            for (const br of bush.berries) br.visible = false;
            player.food += 2;
            player.hunger = Math.min(player.hungerMax, player.hunger + 12);
            score += 1;
            playBerry();
            updateHud();
            return;
        }
    }
    // Bone pickup
    for (let i = boneItems.length - 1; i >= 0; i--) {
        const b = boneItems[i];
        if (Math.hypot(player.x - b.x, player.z - b.z) < 1.4) {
            scene.remove(b.mesh);
            boneItems.splice(i, 1);
            player.bones += 1;
            playBonePick();
            updateHud();
            return;
        }
    }
}

function tryGiveBone() {
    if (!dog || dog.state === 'ally') return;
    if (player.bones < 1) return;
    if (Math.hypot(player.x - dog.x, player.z - dog.z) > 2.0) return;
    player.bones -= 1;
    dog.state = 'ally';
    dog.mesh.userData.heart.visible = true;
    playBark();
    tutorialMark('dog');
    completeMission('dog');
    showToast('🐕 הכלב הוא חבר שלך עכשיו! 🦴');
    updateHud();
}

function doSwing() {
    if (!player) return;
    if (player.swingT > 0) return;
    player.swingT = player.hasBetterAxe ? 0.18 : 0.3;
    playSwing();

    // Find chop target in front
    const fx = Math.sin(player.yaw);
    const fz = Math.cos(player.yaw);
    const range = 2.4;

    // Trees
    for (const tr of trees) {
        if (!tr.alive || tr.falling) continue;
        const dx = tr.x - player.x, dz = tr.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.2) {
                tr.hp -= 1;
                playChop();
                spawnParticles(tr.x, 1.2, tr.z, 0x8b5a2b, 6);
                if (tr.hp <= 0) {
                    tr.falling = true;
                    tr.fallT = 0;
                    const wd = (2 + Math.floor(Math.random() * 3)) * (player.hasBetterAxe ? 2 : 1);
                    player.wood += wd;
                    score += 2;
                    onWoodCollected(wd);
                    updateHud();
                }
                return;
            }
        }
    }
    // Stones
    for (const st of stones) {
        if (!st.alive) continue;
        const dx = st.x - player.x, dz = st.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.2) {
                st.hp -= 1;
                playMine();
                spawnParticles(st.x, 0.6, st.z, 0x888888, 6);
                if (st.hp <= 0) {
                    st.alive = false;
                    scene.remove(st.mesh);
                    player.stone += 2;
                    score += 1;
                    updateHud();
                }
                return;
            }
        }
    }
    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = e.x - player.x, dz = e.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range + 0.4) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.0) {
                e.hp -= player.hasBetterAxe ? 30 : 18;
                e.hitFlash = 0.18;
                playHit();
                spawnParticles(e.x, 1.2, e.z, 0xff3333, 6);
                if (e.hp <= 0) {
                    killEnemy(e, i, true);
                }
                return;
            }
        }
    }
    // Dog hit by accident
    if (dog && dog.state !== 'ally') {
        const dx = dog.x - player.x, dz = dog.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.2) {
                dog.state = 'hostile';
                playGrowl();
            }
        }
    }
}

// ================== Enemy death (shared) ==================
function killEnemy(e, idx, byPlayer) {
    scene.remove(e.mesh);
    if (idx == null) idx = enemies.indexOf(e);
    if (idx >= 0) enemies.splice(idx, 1);
    const t = ENEMY_TYPES[e.type] || ENEMY_TYPES.zombie;

    if (e.isBoss) {
        score += 100;
        bossActive = null;
        bossBarEl.style.display = 'none';
        spawnParticles(e.x, 2, e.z, 0xffdd57, 30);
        spawnParticles(e.x, 1, e.z, 0xff66aa, 24);
        playLevelUp();
        showToast('👑 ניצחת את הבוס! 🎉');
        completeMission('boss');
        updateHud();
        return;
    }

    score += t.scoreVal;
    if (Math.random() < 0.4) spawnBoneItem(e.x, e.z);
    if (Math.random() < 0.3) player.wood += 1;
    const lvl = getLevelFor(score);
    if (lvl.num !== currentLevel.num) {
        currentLevel = lvl;
        playLevelUp();
        showNightBanner(lvl.name);
    }
    updateHud();
}

const TUTORIAL_KEY = 'rom_doxnox_tutorial_done';
let tutorialActive = false;
let tutorialStep = 0;
const TUTORIAL_STEPS = [
    { text: IS_TOUCH ? 'זוז עם הג\'ויסטיק 🕹️' : 'זוז עם WASD או החיצים ⬆️⬇️', flag: 'moved' },
    { text: IS_TOUCH ? 'תקרב לעץ ולחץ ⚔️ כדי לחטוב עץ 🪓' : 'תקרב לעץ ולחץ רווח כדי לחטוב עץ 🪓', flag: 'chopped' },
    { text: IS_TOUCH ? 'לחץ 🏗️ כדי לבנות 🏠' : 'לחץ B כדי לבנות 🏠', flag: 'built' },
    { text: IS_TOUCH ? 'אסוף עצם 🦴 ולחץ 🤝 ליד הכלב' : 'תן עצם לכלב עם G כדי שיהיה חבר 🦴🐕', flag: 'dog' },
];
const tutDone = { moved: false, chopped: false, built: false, dog: false };

function startTutorial(force) {
    let alreadyDone = false;
    try { alreadyDone = localStorage.getItem(TUTORIAL_KEY) === '1'; } catch (e) {}
    if (alreadyDone && !force) { tutorialActive = false; tutorialEl.style.display = 'none'; return; }
    tutorialActive = true;
    tutorialStep = 0;
    tutDone.moved = tutDone.chopped = tutDone.built = tutDone.dog = false;
    tutorialEl.style.display = 'block';
    renderTutorial();
}
function renderTutorial() {
    if (!tutorialActive || tutorialStep >= TUTORIAL_STEPS.length) {
        tutorialEl.style.display = 'none';
        tutorialActive = false;
        try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
        return;
    }
    tutorialEl.querySelector('.tut-text').textContent =
        '(' + (tutorialStep + 1) + '/4) ' + TUTORIAL_STEPS[tutorialStep].text;
}
function tutorialMark(flag) {
    if (!tutorialActive) return;
    if (tutDone[flag]) return;
    tutDone[flag] = true;
    if (TUTORIAL_STEPS[tutorialStep] && TUTORIAL_STEPS[tutorialStep].flag === flag) {
        tutorialStep++;
        playBerry();
        renderTutorial();
    }
}
function skipTutorial() {
    tutorialActive = false;
    tutorialEl.style.display = 'none';
    try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
}

const MISSIONS = [
    { id: 'wood',  text: 'אסוף 20 עץ 🪓',          goal: 20, prog: 0, done: false, reward: 10 },
    { id: 'shelter', text: 'בנה מחסה (4 קירות) 🏠', goal: 4,  prog: 0, done: false, reward: 15 },
    { id: 'dog',   text: 'הפוך את הכלב לחבר 🦴',     goal: 1,  prog: 0, done: false, reward: 12 },
    { id: 'nights', text: 'שרוד 3 לילות 🌙',        goal: 3,  prog: 0, done: false, reward: 25 },
    { id: 'boss',  text: 'הבס את הבוס בלילה 5 👹',   goal: 1,  prog: 0, done: false, reward: 50 },
];
function getMission(id) { return MISSIONS.find(m => m.id === id); }
function renderQuests() {
    let html = '<div class="q-title">📜 משימות</div>';
    for (const m of MISSIONS) {
        const check = m.done ? '✅' : '⬜';
        const prog = (!m.done && m.goal > 1) ? ` <span class="q-prog">${Math.min(m.prog, m.goal)}/${m.goal}</span>` : '';
        html += `<div class="q-row${m.done ? ' done' : ''}">${check} ${m.text}${prog}</div>`;
    }
    questsEl.innerHTML = html;
}
function completeMission(id) {
    const m = getMission(id);
    if (!m || m.done) return;
    m.done = true;
    m.prog = m.goal;
    score += m.reward;
    playLevelUp();
    if (player) spawnParticles(player.x, 1.6, player.z, 0xffdd57, 18);
    showToast('משימה הושלמה! ✓ +' + m.reward);
    renderQuests();
    updateHud();
}
function missionProgress(id, value) {
    const m = getMission(id);
    if (!m || m.done) return;
    m.prog = Math.max(m.prog, value);
    if (m.prog >= m.goal) completeMission(id);
    else renderQuests();
}

}

const RECIPES = [
    { id: 'axe',     emoji: '🪓', name: 'גרזן משופר', desc: 'חוטב מהר וחזק יותר', wood: 5, stone: 3, food: 0 },
