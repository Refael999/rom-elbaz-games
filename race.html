<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מירוץ במהירות 🏎️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #ff5e3a, #ff9a3c, #2b2b3a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: white;
            text-shadow: 0 2px 0 #8b1d1d, 0 0 16px rgba(255,180,80,0.6);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.8em, 1.9vw, 1em);
            padding: 4px 12px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #ff5e3a;
            border-radius: 25px;
            color: #3a1a1a;
            font-weight: bold;
        }
        #score   { color: #ff8a00; }
        #lives   { color: #d22e2e; }
        #level   { color: #c92a52; }
        #current-player { color: #1a78c2; }

        #game-wrap {
            position: relative;
            width:  min(96vw, calc(100vh - 160px));
            height: min(96vw, calc(100vh - 160px));
            max-width: 96vw;
            max-height: calc(100vh - 160px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid #ff5e3a;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,94,58,0.5);
            background: #2b2b3a;
            touch-action: none;
            cursor: pointer;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(30,15,30,0.92);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #ffce5e;
            text-shadow: 0 0 14px #ff8a00;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #ffe9d6;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #ff5e3a;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #3a1a1a;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(58,26,26,0.5); }
        .name-input:focus { border-color: #ffce5e; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #ff5e3a, #ff8a00);
            color: white;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255,94,58,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #ffce5e, #ff8a00);
            color: #3a1a1a;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255,206,94,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,94,58,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #ffce5e; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #ffe9d6; }
        .leaderboard tr.highlight td { background: rgba(255,206,94,0.25); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #ffce5e; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #ff5e3a;
            color: #3a1a1a;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #ffce5e; }

        #hint {
            margin-top: 5px;
            color: white;
            text-shadow: 0 1px 0 #8b1d1d;
            font-size: clamp(0.8em, 2vw, 0.95em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }

        #dpad {
            display: none;
            margin-top: 8px;
            gap: 30px;
            direction: ltr;
        }
        .dpad-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: 4px solid #ff5e3a;
            color: #3a1a1a;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }
        .dpad-btn:active { background: #ffce5e; transform: scale(0.95); }

        @media (pointer: coarse), (max-width: 768px) {
            #dpad { display: flex; }
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🏎️ מירוץ במהירות 🏁</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">❤️ <span id="lives">3</span></div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
    <div class="status-pill">🎯 <span id="level">1</span></div>
</div>

<div id="game-wrap">
    <canvas id="c" width="700" height="700"></canvas>
    <div id="overlay"></div>
</div>

<p id="hint">⬅️➡️ או הקלק שמאל/ימין כדי להחליף מסלול 🏎️</p>

<div id="dpad">
    <button class="dpad-btn" id="btn-left" aria-label="שמאלה">⬅️</button>
    <button class="dpad-btn" id="btn-right" aria-label="ימינה">➡️</button>
</div>

<script>
'use strict';

// ================== Setup ==================
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl  = document.getElementById('score');
const livesEl  = document.getElementById('lives');
const levelEl  = document.getElementById('level');
const currentPlayerEl = document.getElementById('current-player');

const W = canvas.width;     // 700
const H = canvas.height;    // 700

// Highway config
const NUM_LANES = 4;
const ROAD_LEFT = 90;
const ROAD_RIGHT = W - 90;
const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;
const LANE_WIDTH = ROAD_WIDTH / NUM_LANES;
const CAR_W = 70;
const CAR_H = 110;
const PLAYER_Y = H - 140;

function laneCenterX(i) { return ROAD_LEFT + LANE_WIDTH * (i + 0.5); }

// ================== Levels ==================
const LEVELS = [
    { num: 1, name: 'שלב 1 · קל',         minScore: 0,   scrollSpeed: 280, spawnMs: 1200, npcSpeedMin: -40, npcSpeedMax: 80,  obstacleChance: 0.10, color: '#9bff66' },
    { num: 2, name: 'שלב 2 · קל-בינוני',   minScore: 30,  scrollSpeed: 340, spawnMs: 1050, npcSpeedMin: -50, npcSpeedMax: 100, obstacleChance: 0.14, color: '#cffd5e' },
    { num: 3, name: 'שלב 3 · בינוני',      minScore: 70,  scrollSpeed: 400, spawnMs: 900,  npcSpeedMin: -70, npcSpeedMax: 120, obstacleChance: 0.18, color: '#ffdd57' },
    { num: 4, name: 'שלב 4 · די קשה',      minScore: 120, scrollSpeed: 460, spawnMs: 780,  npcSpeedMin: -80, npcSpeedMax: 140, obstacleChance: 0.22, color: '#ffb347' },
    { num: 5, name: 'שלב 5 · קשה',        minScore: 180, scrollSpeed: 520, spawnMs: 660,  npcSpeedMin: -100,npcSpeedMax: 160, obstacleChance: 0.26, color: '#ff7733' },
    { num: 6, name: 'שלב 6 · קשה מאוד',   minScore: 250, scrollSpeed: 580, spawnMs: 560,  npcSpeedMin: -120,npcSpeedMax: 180, obstacleChance: 0.30, color: '#ff3366' },
    { num: 7, name: 'שלב 7 · בטירוף 🔥',   minScore: 340, scrollSpeed: 660, spawnMs: 460,  npcSpeedMin: -140,npcSpeedMax: 220, obstacleChance: 0.34, color: '#c92a52' },
];
function getLevelFor(score) {
    for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (score >= LEVELS[i].minScore) return LEVELS[i];
    }
    return LEVELS[0];
}
function nextLevelGoal(level) {
    const next = LEVELS.find(l => l.num === level.num + 1);
    return next ? next.minScore : null;
}

// ================== Scoreboard ==================
const STORAGE_KEY = 'rom_race_scores_v1';
let currentPlayer = null;

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><p style="color:#aaa;font-size:0.85em;margin:0">עוד אין שחקנים — אתה תהיה הראשון! 🏎️</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><table>${rows}</table></div>`;
}

// ================== Game state ==================
let running = false;
let rafId = null;

let player = {
    lane: 1,
    x: laneCenterX(1),
    targetX: laneCenterX(1),
    invincibleTime: 0,
    oilTime: 0,
    wobble: 0,
};
let npcCars = [];
let coins = [];
let obstacles = [];
let particles = [];
let popups = [];
let speedLines = [];

let roadOffset = 0;
let score = 0;
let scoreFloat = 0;
let lives = 3;
let lastSpawn = 0;
let lastCoinSpawn = 0;
let lastT = 0;
let currentLevel = LEVELS[0];
let levelBanner = null;
let shake = 0;

const NPC_COLORS = [
    { body: '#3a7bd5', roof: '#bcd9ff' },
    { body: '#ffd000', roof: '#fff3a0' },
    { body: '#2bb673', roof: '#a8e6c1' },
    { body: '#f0f0f0', roof: '#ffffff' },
    { body: '#1a1a1a', roof: '#555555' },
    { body: '#9c27b0', roof: '#e1b3ec' },
];

function resetGame() {
    npcCars = [];
    coins = [];
    obstacles = [];
    particles = [];
    popups = [];
    speedLines = [];
    score = 0;
    scoreFloat = 0;
    lives = 3;
    roadOffset = 0;
    shake = 0;
    player.lane = Math.floor(NUM_LANES / 2);
    player.x = laneCenterX(player.lane);
    player.targetX = player.x;
    player.invincibleTime = 0;
    player.oilTime = 0;
    player.wobble = 0;
    currentLevel = LEVELS[0];
    levelBanner = { text: '🏎️ ' + currentLevel.name, life: 1.8 };
    lastSpawn = performance.now() - 600;
    lastCoinSpawn = performance.now();
    scoreEl.textContent = '0';
    livesEl.textContent = '❤️❤️❤️';
    updateLevelUi();
}

function updateLevelUi() {
    const goal = nextLevelGoal(currentLevel);
    levelEl.textContent = goal !== null
        ? `${currentLevel.num} (${score}/${goal})`
        : `${currentLevel.num} 🔥`;
}

function updateLivesUi() {
    livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) || '0';
}

// ================== Sound ==================
let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function playLaneChange() {
    tone(440, 0.06, 'sine', 0.10, 0);
    tone(620, 0.05, 'sine', 0.08, 0.04);
}
function playCoin() {
    tone(1200, 0.05, 'square', 0.12, 0);
    tone(1600, 0.08, 'square', 0.12, 0.05);
    tone(2000, 0.10, 'triangle', 0.10, 0.10);
}
function playCrash() {
    tone(120, 0.25, 'sawtooth', 0.22, 0);
    tone(80,  0.30, 'sawtooth', 0.20, 0.05);
    tone(60,  0.40, 'square',   0.16, 0.12);
}
function playOil() {
    tone(500, 0.30, 'sawtooth', 0.10, 0);
    tone(300, 0.35, 'sawtooth', 0.08, 0.10);
    tone(200, 0.40, 'sine',     0.08, 0.20);
}
function playStart() {
    tone(523, 0.10, 'triangle', 0.18, 0);
    tone(659, 0.10, 'triangle', 0.18, 0.10);
    tone(784, 0.16, 'triangle', 0.18, 0.20);
}
function playGameOver() {
    tone(392, 0.18, 'sawtooth', 0.16, 0);
    tone(294, 0.18, 'sawtooth', 0.16, 0.18);
    tone(196, 0.35, 'sawtooth', 0.16, 0.36);
}
function playLevelUp() {
    tone(523, 0.10, 'square', 0.16, 0);
    tone(659, 0.10, 'square', 0.16, 0.10);
    tone(784, 0.10, 'square', 0.16, 0.20);
    tone(1047,0.22, 'square', 0.18, 0.30);
}
const MUSIC_NOTES = [392, 494, 587, 659, 587, 494, 392, 330];
const BASS_NOTES  = [98,  98,  131, 131, 147, 147, 98,  98];
const NOTE_MS = 220;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.05, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.06, 0);
    // Engine hum
    tone(60 + (currentLevel.scrollSpeed / 10), NOTE_MS / 1000 * 1.2, 'sawtooth', 0.025, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Spawning ==================
function pickLane() { return Math.floor(Math.random() * NUM_LANES); }

function laneIsClearAtTop(lane) {
    for (const c of npcCars) {
        if (c.lane === lane && c.y < CAR_H * 1.8) return false;
    }
    for (const o of obstacles) {
        if (o.lane === lane && o.y < CAR_H * 1.8) return false;
    }
    return true;
}

function spawnNpc() {
    // Try to pick a lane that isn't blocked at the spawn
    let lane = -1;
    for (let t = 0; t < 6; t++) {
        const candidate = pickLane();
        if (laneIsClearAtTop(candidate)) { lane = candidate; break; }
    }
    if (lane === -1) return;

    const color = NPC_COLORS[Math.floor(Math.random() * NPC_COLORS.length)];
    const speedRel = currentLevel.npcSpeedMin + Math.random() * (currentLevel.npcSpeedMax - currentLevel.npcSpeedMin);
    npcCars.push({
        lane: lane,
        x: laneCenterX(lane),
        y: -CAR_H - 10,
        speed: speedRel,
        color: color,
    });
}

function spawnObstacle() {
    let lane = -1;
    for (let t = 0; t < 6; t++) {
        const candidate = pickLane();
        if (laneIsClearAtTop(candidate)) { lane = candidate; break; }
    }
    if (lane === -1) return;
    const type = Math.random() < 0.55 ? 'cone' : 'oil';
    obstacles.push({
        lane: lane,
        x: laneCenterX(lane),
        y: -60,
        type: type,
        spin: 0,
    });
}

function spawnCoin() {
    const lane = pickLane();
    coins.push({
        lane: lane,
        x: laneCenterX(lane),
        y: -40,
        rot: 0,
        collected: false,
    });
}

function spawnParticles(x, y, color, count, speed) {
    const n = count || 14;
    const sp = speed || 200;
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = sp * (0.5 + Math.random());
        particles.push({
            x: x, y: y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.4 + Math.random() * 0.35,
            color: color,
            r: 2 + Math.random() * 4,
        });
    }
}
function popup(text, x, y, color) {
    popups.push({ text: text, x: x, y: y, vy: -60, life: 0.9, color: color || '#ffce5e' });
}

// ================== Controls ==================
function changeLane(delta) {
    if (!running) return;
    if (player.oilTime > 0) return; // locked during oil
    const newLane = Math.max(0, Math.min(NUM_LANES - 1, player.lane + delta));
    if (newLane === player.lane) return;
    player.lane = newLane;
    player.targetX = laneCenterX(newLane);
    playLaneChange();
}

// Keyboard
window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { changeLane(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { changeLane(+1); e.preventDefault(); }
}, { passive: false });

// D-pad
document.getElementById('btn-left').addEventListener('click',  function () { changeLane(-1); });
document.getElementById('btn-right').addEventListener('click', function () { changeLane(+1); });

// Touch / click on canvas
function canvasPointFromClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top)  * (H / rect.height),
    };
}

let touchStartX = null;
let touchStartT = 0;
canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartT = performance.now();
}, { passive: false });
canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    if (touchStartX === null) return;
    const dx = t.clientX - touchStartX;
    const dtMs = performance.now() - touchStartT;
    if (Math.abs(dx) > 25 && dtMs < 400) {
        // Swipe: dx > 0 means swipe to the right => lane index +1 (canvas x increases L→R)
        changeLane(dx > 0 ? +1 : -1);
    } else {
        // Tap: use tap location relative to canvas
        const p = canvasPointFromClient(t.clientX, t.clientY);
        if (p.x < W / 2) changeLane(-1);
        else changeLane(+1);
    }
    touchStartX = null;
}, { passive: false });

// Mouse click (desktop fallback for tapping)
canvas.addEventListener('mousedown', function (e) {
    if (!running) return;
    const p = canvasPointFromClient(e.clientX, e.clientY);
    if (p.x < W / 2) changeLane(-1);
    else changeLane(+1);
});

// ================== Collision ==================
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2;
}

function handleHit() {
    if (player.invincibleTime > 0) return;
    lives--;
    updateLivesUi();
    player.invincibleTime = 1.5;
    shake = 18;
    spawnParticles(player.x, PLAYER_Y, '#ff5e3a', 22, 320);
    spawnParticles(player.x, PLAYER_Y, '#ffce5e', 14, 260);
    popup('💥', player.x, PLAYER_Y - 60, '#ff3366');
    playCrash();
    if (lives <= 0) gameOver();
}

function handleOil() {
    if (player.oilTime > 0) return;
    player.oilTime = 1.0;
    player.wobble = 0;
    popup('💧', player.x, PLAYER_Y - 60, '#88ccff');
    playOil();
}

// ================== Update ==================
function update(dt) {
    // Smooth lane slide (~150ms)
    const slideSpeed = 1 / 0.15;
    const dx = player.targetX - player.x;
    if (Math.abs(dx) > 0.5) {
        player.x += dx * Math.min(1, dt * slideSpeed);
    } else {
        player.x = player.targetX;
    }

    // Oil wobble
    if (player.oilTime > 0) {
        player.oilTime -= dt;
        player.wobble += dt * 18;
    } else {
        player.wobble = 0;
    }

    if (player.invincibleTime > 0) player.invincibleTime -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 60);

    // Road scrolling
    roadOffset = (roadOffset + currentLevel.scrollSpeed * dt) % 80;

    // Score from distance (1 per second)
    scoreFloat += dt;
    while (scoreFloat >= 1) {
        scoreFloat -= 1;
        score++;
        scoreEl.textContent = score;
        const lvl = getLevelFor(score);
        if (lvl.num !== currentLevel.num) {
            currentLevel = lvl;
            levelBanner = { text: lvl.name, life: 2.2 };
            playLevelUp();
        }
        updateLevelUi();
    }

    // Spawn NPCs / obstacles
    if (performance.now() - lastSpawn > currentLevel.spawnMs) {
        if (Math.random() < currentLevel.obstacleChance) spawnObstacle();
        else spawnNpc();
        lastSpawn = performance.now();
    }

    // Coins (separate cadence, common)
    if (performance.now() - lastCoinSpawn > 850 + Math.random() * 600) {
        spawnCoin();
        lastCoinSpawn = performance.now();
    }

    // NPC cars
    for (let i = npcCars.length - 1; i >= 0; i--) {
        const c = npcCars[i];
        // NPC moves down at (scrollSpeed - c.speed). speed>0 means slower than us (we overtake)
        // For visual flow: scrollSpeed pushes everything down; npc has own forward velocity. relative_y_speed = scrollSpeed - npc.speed.
        c.y += (currentLevel.scrollSpeed - c.speed) * dt;
        // Collision
        if (rectsOverlap(player.x, PLAYER_Y, CAR_W * 0.78, CAR_H * 0.86, c.x, c.y, CAR_W * 0.78, CAR_H * 0.86)) {
            handleHit();
            // bounce npc off-screen so we don't repeatedly collide
            c.y = H + 200;
        }
        if (c.y > H + CAR_H) npcCars.splice(i, 1);
    }

    // Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.y += currentLevel.scrollSpeed * dt;
        o.spin += dt * 4;
        const ow = o.type === 'cone' ? 50 : 100;
        const oh = o.type === 'cone' ? 60 : 50;
        if (rectsOverlap(player.x, PLAYER_Y, CAR_W * 0.72, CAR_H * 0.8, o.x, o.y, ow, oh)) {
            if (o.type === 'cone') {
                handleHit();
            } else {
                handleOil();
            }
            o.y = H + 200; // consume
        }
        if (o.y > H + 80) obstacles.splice(i, 1);
    }

    // Coins
    for (let i = coins.length - 1; i >= 0; i--) {
        const co = coins[i];
        co.y += currentLevel.scrollSpeed * dt;
        co.rot += dt * 6;
        if (!co.collected && rectsOverlap(player.x, PLAYER_Y, CAR_W * 0.78, CAR_H * 0.86, co.x, co.y, 36, 36)) {
            co.collected = true;
            score += 5;
            scoreEl.textContent = score;
            spawnParticles(co.x, co.y, '#ffce5e', 12, 200);
            popup('+5', co.x, co.y - 18, '#ffce5e');
            playCoin();
            const lvl = getLevelFor(score);
            if (lvl.num !== currentLevel.num) {
                currentLevel = lvl;
                levelBanner = { text: lvl.name, life: 2.2 };
                playLevelUp();
            }
            updateLevelUi();
        }
        if (co.y > H + 60 || co.collected) coins.splice(i, 1);
    }

    // Particles
    particles = particles.filter(function (p) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 280 * dt;
        p.life -= dt;
        return p.life > 0;
    });

    // Popups
    popups = popups.filter(function (p) {
        p.y += p.vy * dt;
        p.life -= dt;
        return p.life > 0;
    });

    // Level banner
    if (levelBanner) {
        levelBanner.life -= dt;
        if (levelBanner.life <= 0) levelBanner = null;
    }

    // Speed lines
    if (Math.random() < 0.6) {
        const side = Math.random() < 0.5 ? 0 : 1;
        const x = side === 0
            ? 10 + Math.random() * (ROAD_LEFT - 20)
            : ROAD_RIGHT + 10 + Math.random() * (W - ROAD_RIGHT - 20);
        speedLines.push({ x: x, y: -20, life: 1 });
    }
    speedLines = speedLines.filter(function (s) {
        s.y += currentLevel.scrollSpeed * 1.6 * dt;
        s.life -= dt * 0.6;
        return s.y < H + 60 && s.life > 0;
    });
}

// ================== Render ==================
function drawScenery() {
    // Sky / side area at top
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 80);
    skyGrad.addColorStop(0, '#ff5e3a');
    skyGrad.addColorStop(1, '#ff9a3c');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, 80);

    // Side (desert/grass) full height under sky
    const sideGrad = ctx.createLinearGradient(0, 80, 0, H);
    sideGrad.addColorStop(0, '#d6794b');
    sideGrad.addColorStop(1, '#8a4a2a');
    ctx.fillStyle = sideGrad;
    ctx.fillRect(0, 80, W, H - 80);

    // Distant horizon strip
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(0, 78, W, 4);
}

function drawRoad() {
    // Asphalt
    ctx.fillStyle = '#2b2b3a';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, H);

    // Solid edge lines
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ROAD_LEFT - 4, 0, 4, H);
    ctx.fillRect(ROAD_RIGHT,    0, 4, H);

    // Dashed lane dividers (animated)
    ctx.fillStyle = '#ffe066';
    const dashH = 40, gap = 40;
    for (let lane = 1; lane < NUM_LANES; lane++) {
        const x = ROAD_LEFT + LANE_WIDTH * lane - 3;
        for (let y = -gap + roadOffset; y < H; y += dashH + gap) {
            ctx.fillRect(x, y, 6, dashH);
        }
    }
}

function drawSpeedLines() {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    for (const s of speedLines) {
        ctx.globalAlpha = Math.max(0, Math.min(1, s.life));
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x, s.y + 30);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

function drawCar(x, y, bodyColor, roofColor, isPlayer) {
    const w = CAR_W, h = CAR_H;
    const left = x - w / 2;
    const top  = y - h / 2;

    // Shadow under car
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(left + 4, top + 8, w, h, 14);
        ctx.fill();
    } else {
        ctx.fillRect(left + 4, top + 8, w, h);
    }

    // Body
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 3;
    if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(left, top, w, h, 14);
        ctx.fill();
        ctx.stroke();
    } else {
        ctx.fillRect(left, top, w, h);
        ctx.strokeRect(left, top, w, h);
    }

    // Hood detail line
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left + 8, top + h * 0.45);
    ctx.lineTo(left + w - 8, top + h * 0.45);
    ctx.stroke();

    // Roof / windshield (white-ish)
    ctx.fillStyle = roofColor;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 2;
    if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(left + 10, top + h * 0.20, w - 20, h * 0.22, 6);
        ctx.fill(); ctx.stroke();
        // Rear window
        ctx.beginPath();
        ctx.roundRect(left + 10, top + h * 0.62, w - 20, h * 0.18, 6);
        ctx.fill(); ctx.stroke();
    } else {
        ctx.fillRect(left + 10, top + h * 0.20, w - 20, h * 0.22);
        ctx.fillRect(left + 10, top + h * 0.62, w - 20, h * 0.18);
    }

    // Wheels (4 corners)
    ctx.fillStyle = '#111';
    const wheelW = 10, wheelH = 22;
    ctx.fillRect(left - 4,        top + h * 0.10, wheelW, wheelH);
    ctx.fillRect(left + w - 6,    top + h * 0.10, wheelW, wheelH);
    ctx.fillRect(left - 4,        top + h * 0.72, wheelW, wheelH);
    ctx.fillRect(left + w - 6,    top + h * 0.72, wheelW, wheelH);

    // Headlights at front (top of player car; bottom of NPC since NPCs face down)
    if (isPlayer) {
        ctx.fillStyle = '#fffec8';
        ctx.shadowBlur = 14; ctx.shadowColor = '#ffec88';
        ctx.fillRect(left + 8, top + 4, 14, 6);
        ctx.fillRect(left + w - 22, top + 4, 14, 6);
        ctx.shadowBlur = 0;
        // Brake lights (rear, red)
        ctx.fillStyle = '#ff2222';
        ctx.shadowBlur = 10; ctx.shadowColor = '#ff2222';
        ctx.fillRect(left + 8, top + h - 8, 14, 5);
        ctx.fillRect(left + w - 22, top + h - 8, 14, 5);
        ctx.shadowBlur = 0;
    } else {
        // NPC faces downward (they drive same direction as player visually, but from player POV they appear to come from front)
        // We'll show headlights at the BOTTOM (their front from our view) and rear lights at top
        ctx.fillStyle = '#fffec8';
        ctx.shadowBlur = 12; ctx.shadowColor = '#ffec88';
        ctx.fillRect(left + 8, top + h - 9, 14, 6);
        ctx.fillRect(left + w - 22, top + h - 9, 14, 6);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(left + 8, top + 4, 14, 4);
        ctx.fillRect(left + w - 22, top + 4, 14, 4);
    }
}

function drawPlayer() {
    let x = player.x;
    if (player.oilTime > 0) {
        x += Math.sin(player.wobble) * 12;
    }
    // Blink during invincibility
    if (player.invincibleTime > 0) {
        const blink = Math.floor(player.invincibleTime * 10) % 2;
        if (blink === 0) {
            ctx.globalAlpha = 0.4;
        }
    }
    drawCar(x, PLAYER_Y, '#e63946', '#ffe9e9', true);
    ctx.globalAlpha = 1;
}

function drawNpcs() {
    for (const c of npcCars) {
        drawCar(c.x, c.y, c.color.body, c.color.roof, false);
    }
}

function drawCoin(co) {
    ctx.save();
    ctx.translate(co.x, co.y);
    // Simulate 3D rotation by squashing width
    const sx = Math.abs(Math.cos(co.rot));
    ctx.scale(sx + 0.15, 1);
    // Outer ring
    ctx.fillStyle = '#ffd000';
    ctx.strokeStyle = '#a86d00';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Inner shine
    ctx.fillStyle = '#fff3a0';
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
    // Star symbol
    ctx.fillStyle = '#a86d00';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 1);
    ctx.restore();
}

function drawCoins() {
    for (const co of coins) drawCoin(co);
}

function drawCone(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    // Base shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(2, 26, 26, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cone body (triangle)
    ctx.fillStyle = '#ff6a00';
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(22, 26);
    ctx.lineTo(-22, 26);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // White stripes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-12, 2); ctx.lineTo(12, 2); ctx.lineTo(14, 10); ctx.lineTo(-14, 10);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8, -12); ctx.lineTo(8, -12); ctx.lineTo(10, -6); ctx.lineTo(-10, -6);
    ctx.closePath(); ctx.fill();
    // Base rectangle
    ctx.fillStyle = '#cc4400';
    ctx.fillRect(-26, 24, 52, 6);
    ctx.restore();
}

function drawOil(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    // Glossy dark ellipse
    ctx.fillStyle = '#0a0a14';
    ctx.beginPath();
    ctx.ellipse(0, 0, 48, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    // Reflective shine moving
    const sh = (Math.sin(o.spin) + 1) / 2;
    ctx.fillStyle = `rgba(120,150,255,${0.3 + sh * 0.3})`;
    ctx.beginPath();
    ctx.ellipse(-10 + sh * 20, -4, 18, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.15 + sh * 0.2})`;
    ctx.beginPath();
    ctx.ellipse(12, 6, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawObstacles() {
    for (const o of obstacles) {
        if (o.type === 'cone') drawCone(o);
        else drawOil(o);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px Comic Sans MS, Arial';
    for (const p of popups) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.9));
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 4;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
}

function drawLevelBanner() {
    if (!levelBanner) return;
    const a = Math.min(1, levelBanner.life / 0.4);
    ctx.globalAlpha = a;
    ctx.font = 'bold 36px Comic Sans MS, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = levelBanner.text;
    const padX = 22, padY = 12;
    const m = ctx.measureText(text);
    const bw = m.width + padX * 2;
    const bh = 36 + padY * 2;
    const bx = W / 2 - bw / 2;
    const by = H / 2 - bh / 2;
    ctx.fillStyle = 'rgba(30,15,30,0.88)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill(); }
    else                  ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = currentLevel.color;
    ctx.lineWidth = 4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.stroke(); }
    else                  ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = currentLevel.color;
    ctx.shadowBlur = 18; ctx.shadowColor = currentLevel.color;
    ctx.fillText(text, W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
}

function render() {
    ctx.save();
    if (shake > 0) {
        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;
        ctx.translate(sx, sy);
    }
    drawScenery();
    drawRoad();
    drawSpeedLines();
    drawCoins();
    drawObstacles();
    drawNpcs();
    drawPlayer();
    drawParticles();
    drawPopups();
    drawLevelBanner();
    ctx.restore();
}

// ================== Loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    update(dt);
    render();
    if (running) rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    start();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    scoreEl.textContent = '0';
    livesEl.textContent = '❤️❤️❤️';
    levelEl.textContent = '—';

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name: name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🏎️ מירוץ במהירות</h2>' +
        '<p>מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">🏁 התחל מירוץ</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', function (e) { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    // Draw bg behind overlay
    drawScenery();
    drawRoad();

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showGameOver() {
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = score === myBest && score > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === score && score > 0;
    const lvlReached = getLevelFor(score);

    let headline, msg;
    if (isKing && isNewRecord) {
        headline = '👑 מלך המירוץ!';
        msg = `${currentPlayer} עלה לראש הטבלה עם ${score} נקודות (${lvlReached.name})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש!';
        msg = `${currentPlayer} השיג ${score} נקודות, הגיע ל${lvlReached.name}!`;
    } else if (score >= 50) {
        headline = '🏆 נהיגה מצוינת!';
        msg = `${currentPlayer} השיג ${score} נקודות (${lvlReached.name}). השיא: ${myBest}`;
    } else {
        headline = '🏎️ ניסיון טוב!';
        msg = `${currentPlayer} השיג ${score} נקודות (${lvlReached.name}).<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    setTimeout(showGameOver, 600);
}

function start() {
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();
    resetGame();
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

// ================== Mute ==================
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
});

// ================== Boot ==================
drawScenery();
drawRoad();
showPlayerSelect();
</script>
</body>
</html>
