<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>בריחה מהר געש 🌋</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #1a0000, #4a0a00, #8a1500, #ff4500);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: #ffdd57;
            text-shadow: 0 2px 0 #8a1500, 0 0 16px rgba(255,100,0,0.8);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.8em, 1.9vw, 1em);
            padding: 4px 12px;
            background: rgba(255,240,200,0.92);
            border: 3px solid #ff4500;
            border-radius: 25px;
            color: #4a0a00;
            font-weight: bold;
        }
        #score   { color: #d97300; }
        #lives   { color: #c92a52; }
        #level   { color: #b85a00; }
        #height  { color: #5a2a00; }
        #current-player { color: #8a1500; }

        #game-wrap {
            position: relative;
            width:  min(96vw, calc(100vh - 160px));
            height: min(96vw, calc(100vh - 160px));
            max-width: 96vw;
            max-height: calc(100vh - 160px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 5px solid #ff4500;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,80,0,0.7);
            background: #2a0500;
            touch-action: none;
            cursor: crosshair;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(30,5,0,0.94);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #ffdd57;
            text-shadow: 0 0 14px #ff4500;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #ffe0c2;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #ff4500;
            border-radius: 12px;
            background: rgba(255,240,220,0.95);
            color: #4a0a00;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(74,10,0,0.5); }
        .name-input:focus { border-color: #ffdd57; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #ff4500, #ffdd57);
            color: #4a0a00;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255,80,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #ffdd57, #ff4500);
            color: #4a0a00;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255,200,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,200,100,0.6);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,80,0,0.6);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #ffdd57; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #ffe0c2; }
        .leaderboard tr.highlight td { background: rgba(255,221,87,0.28); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #ffdd57; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,240,200,0.9);
            border: 3px solid #ff4500;
            color: #4a0a00;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #ffdd57; }

        #hint {
            margin-top: 5px;
            color: #ffe0c2;
            text-shadow: 0 1px 0 #4a0a00;
            font-size: clamp(0.8em, 2vw, 0.95em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }

        #dpad {
            display: none;
            direction: ltr;
            margin-top: 8px;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .dpad-btn {
            background: linear-gradient(135deg, #ff4500, #8a1500);
            border: 3px solid #ffdd57;
            color: white;
            font-size: 1.6em;
            font-weight: bold;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dpad-btn:active { transform: scale(0.92); background: linear-gradient(135deg, #ffdd57, #ff4500); }
        #jump-btn {
            width: 78px; height: 78px;
            font-size: 1.8em;
            background: linear-gradient(135deg, #ffdd57, #ff8a00);
            color: #4a0a00;
        }

        @media (pointer: coarse), (max-width: 768px) {
            #dpad { display: flex; }
        }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🌋 בריחה מהר געש! 🌋</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">❤️ <span id="lives">3</span></div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
    <div class="status-pill">🎯 <span id="level">1</span></div>
    <div class="status-pill">📏 <span id="height">0</span></div>
</div>

<div id="game-wrap">
    <canvas id="c" width="700" height="700"></canvas>
    <div id="overlay"></div>
</div>

<div id="dpad">
    <button class="dpad-btn" id="left-btn" aria-label="שמאלה">◀</button>
    <button class="dpad-btn" id="jump-btn" aria-label="קפוץ">▲</button>
    <button class="dpad-btn" id="right-btn" aria-label="ימינה">▶</button>
</div>

<p id="hint">⬅️➡️ זוז · ⬆️/רווח לקפוץ · ברח מהלבה! 🌋</p>

<script>
'use strict';

// ================== Setup ==================
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl  = document.getElementById('score');
const livesEl  = document.getElementById('lives');
const levelEl  = document.getElementById('level');
const heightEl = document.getElementById('height');
const currentPlayerEl = document.getElementById('current-player');

const W = canvas.width;     // 700
const H = canvas.height;    // 700

// Player constants
const PLAYER_W = 42;
const PLAYER_H = 58;
const GRAVITY = 1500;
const JUMP_VEL = -700;
const MOVE_SPEED = 320;
const AIR_CONTROL = 0.7;
const COYOTE_TIME = 0.10;

// ================== Levels ==================
const LEVELS = [
    { num: 1, name: 'שלב 1 · קל',         minScore: 0,   lavaSpeed: 30,  platMinW: 140, platMaxW: 200, rockChance: 0.10, ventChance: 0.05, skullChance: 0.04, color: '#ffdd57' },
    { num: 2, name: 'שלב 2 · קל-בינוני',   minScore: 50,  lavaSpeed: 40,  platMinW: 130, platMaxW: 190, rockChance: 0.15, ventChance: 0.08, skullChance: 0.06, color: '#ffb347' },
    { num: 3, name: 'שלב 3 · בינוני',      minScore: 120, lavaSpeed: 50,  platMinW: 120, platMaxW: 180, rockChance: 0.20, ventChance: 0.11, skullChance: 0.08, color: '#ff8a00' },
    { num: 4, name: 'שלב 4 · די קשה',      minScore: 200, lavaSpeed: 62,  platMinW: 110, platMaxW: 170, rockChance: 0.26, ventChance: 0.14, skullChance: 0.10, color: '#ff5a00' },
    { num: 5, name: 'שלב 5 · קשה',         minScore: 300, lavaSpeed: 75,  platMinW: 100, platMaxW: 160, rockChance: 0.32, ventChance: 0.18, skullChance: 0.13, color: '#ff3300' },
    { num: 6, name: 'שלב 6 · קשה מאוד',    minScore: 420, lavaSpeed: 90,  platMinW: 95,  platMaxW: 150, rockChance: 0.40, ventChance: 0.22, skullChance: 0.16, color: '#e62200' },
    { num: 7, name: 'שלב 7 · בטירוף 🔥',   minScore: 560, lavaSpeed: 110, platMinW: 90,  platMaxW: 140, rockChance: 0.50, ventChance: 0.28, skullChance: 0.20, color: '#c92a52' },
];
function getLevelFor(score) {
    for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (score >= LEVELS[i].minScore) return LEVELS[i];
    }
    return LEVELS[0];
}
function nextLevelGoal(level) {
    const next = LEVELS.find(l => l.num === level.num + 1);
    return next ? next.minScore : null;
}

// ================== Scoreboard ==================
const STORAGE_KEY = 'rom_volcano_scores_v1';
let currentPlayer = null;

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><p style="color:#ffb;font-size:0.85em;margin:0">עוד אין שחקנים — אתה תהיה הראשון! 🌋</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השיאים</div><table>${rows}</table></div>`;
}

// ================== Game state ==================
let running = false;
let rafId = null;
let player = null;
let platforms = [];
let gems = [];
let coins = [];
let hearts = [];
let boosts = [];
let fallingRocks = [];
let particles = [];
let popups = [];
let bgPhase = 0;
let score = 0;
let lives = 3;
let lastT = 0;
let currentLevel = LEVELS[0];
let levelBanner = null;
let cameraY = 0;             // world y of top of camera (smaller = higher)
let lavaY = 0;               // world y of lava top surface
let highestY = 0;            // highest (smallest) y the player has reached
let invincibleT = 0;
let boostT = 0;
let shakeT = 0;
let nextPlatformY = 0;       // next world y to spawn platform above
let deathAnim = 0;
let gameOverTriggered = false;
const keys = { left: false, right: false, jump: false };
let jumpQueued = false;

function resetGame() {
    platforms = [];
    gems = [];
    coins = [];
    hearts = [];
    boosts = [];
    fallingRocks = [];
    particles = [];
    popups = [];
    score = 0;
    lives = 3;
    bgPhase = 0;
    currentLevel = LEVELS[0];
    levelBanner = { text: '🌋 ' + currentLevel.name, life: 1.8 };
    invincibleT = 0;
    boostT = 0;
    shakeT = 0;
    deathAnim = 0;
    gameOverTriggered = false;

    // Player starts on starting platform near bottom
    // World y: 0 at start position of bottom of canvas
    cameraY = -H + 200;       // camera shows world y from cameraY to cameraY + H
    // Place starting platform at world y = 80 from bottom
    const startPlat = makePlatform(W / 2 - 110, -120, 220, true);
    platforms.push(startPlat);

    player = {
        x: W / 2 - PLAYER_W / 2,
        y: startPlat.y - PLAYER_H,
        vx: 0,
        vy: 0,
        onGround: true,
        coyote: 0,
        facing: 1,
        runPhase: 0,
        dead: false,
    };

    highestY = player.y;
    lavaY = H + 50;           // lava starts below view
    nextPlatformY = startPlat.y - 90;
    // Pre-generate platforms going up
    for (let i = 0; i < 30; i++) generateNextPlatform();

    scoreEl.textContent = '0';
    livesEl.textContent = '3';
    heightEl.textContent = '0';
    updateLevelUi();
}

function updateLevelUi() {
    const goal = nextLevelGoal(currentLevel);
    levelEl.textContent = goal !== null
        ? `${currentLevel.num} (${score}/${goal})`
        : `${currentLevel.num} 🔥`;
}

// ================== Sound ==================
let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function playJump() {
    tone(420, 0.07, 'square', 0.14, 0);
    tone(680, 0.09, 'square', 0.13, 0.06);
}
function playLand() { tone(140, 0.08, 'sine', 0.10, 0); }
function playGem() {
    tone(880, 0.06, 'triangle', 0.14, 0);
    tone(1320,0.10, 'triangle', 0.14, 0.05);
}
function playCoin() { tone(1100, 0.06, 'square', 0.10, 0); }
function playHeart() {
    tone(440, 0.10, 'sine', 0.16, 0);
    tone(660, 0.14, 'sine', 0.16, 0.08);
}
function playHit() {
    tone(180, 0.18, 'sawtooth', 0.18, 0);
    tone(110, 0.24, 'sawtooth', 0.16, 0.12);
}
function playRock() {
    tone(90, 0.22, 'sawtooth', 0.20, 0);
    tone(60, 0.28, 'square', 0.18, 0.05);
}
function playStart() {
    tone(523, 0.10, 'triangle', 0.18, 0);
    tone(659, 0.10, 'triangle', 0.18, 0.10);
    tone(784, 0.16, 'triangle', 0.18, 0.20);
}
function playGameOver() {
    tone(392, 0.20, 'sawtooth', 0.18, 0);
    tone(294, 0.20, 'sawtooth', 0.18, 0.20);
    tone(196, 0.40, 'sawtooth', 0.18, 0.40);
}
function playLevelUp() {
    tone(523, 0.10, 'square', 0.16, 0);
    tone(659, 0.10, 'square', 0.16, 0.10);
    tone(784, 0.10, 'square', 0.16, 0.20);
    tone(1047,0.22, 'square', 0.18, 0.30);
}
const MUSIC_NOTES = [196, 247, 294, 392, 294, 247, 196, 165];
const BASS_NOTES  = [98, 98, 131, 131, 147, 147, 98, 98];
const NOTE_MS = 240;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.05, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.05, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Platforms & spawning ==================
function makePlatform(x, y, w, isStart) {
    const plat = { x: x, y: y, w: w, h: 18, vent: null, skull: null };
    if (!isStart) {
        // chance for fire vent on top of platform
        if (Math.random() < currentLevel.ventChance && w >= 110) {
            plat.vent = { offsetX: 20 + Math.random() * (w - 70), phase: Math.random() * Math.PI * 2 };
        }
        // chance for skeleton standing
        if (!plat.vent && Math.random() < currentLevel.skullChance && w >= 100) {
            plat.skull = { offsetX: 15 + Math.random() * (w - 50), phase: Math.random() * Math.PI * 2 };
        }
    }
    return plat;
}

function generateNextPlatform() {
    const minW = currentLevel.platMinW;
    const maxW = currentLevel.platMaxW;
    const w = minW + Math.random() * (maxW - minW);
    const x = 20 + Math.random() * (W - w - 40);
    const y = nextPlatformY;
    const plat = makePlatform(x, y, w, false);
    platforms.push(plat);

    // gems above platform
    if (Math.random() < 0.35) {
        gems.push({ x: x + w / 2 - 12, y: y - 50, phase: Math.random() * Math.PI * 2, alive: true });
    }
    // coins
    if (Math.random() < 0.55) {
        const count = 1 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
            coins.push({ x: x + 20 + (w - 40) * (i / Math.max(1, count - 1)), y: y - 30 - Math.random() * 25, phase: Math.random() * Math.PI * 2, alive: true });
        }
    }
    // hearts (rare)
    if (Math.random() < 0.04 && lives < 3) {
        hearts.push({ x: x + w / 2 - 14, y: y - 80, phase: Math.random() * Math.PI * 2, alive: true });
    }
    // speed boost
    if (Math.random() < 0.05) {
        boosts.push({ x: x + w / 2 - 14, y: y - 75, phase: Math.random() * Math.PI * 2, alive: true });
    }

    nextPlatformY -= 75 + Math.random() * 50;
}

function spawnFallingRock() {
    const x = 40 + Math.random() * (W - 80);
    const targetY = cameraY + 100 + Math.random() * (H - 250);
    fallingRocks.push({
        x: x,
        y: cameraY - 60,
        vy: 0,
        size: 22 + Math.random() * 14,
        warning: 0.8,           // warning time
        warnX: x,
        warnY: targetY,
        falling: false,
        landed: false,
    });
}

function spawnParticles(x, y, color, count, spread) {
    count = count || 12;
    spread = spread || 200;
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = spread * (0.4 + Math.random() * 0.8);
        particles.push({
            x: x, y: y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 50,
            life: 0.5 + Math.random() * 0.4,
            color: color,
            r: 3 + Math.random() * 4,
        });
    }
}
function popup(text, x, y, color) {
    popups.push({ text: text, x: x, y: y, vy: -60, life: 1.0, color: color || '#ffdd57' });
}

// ================== Input ==================
window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { keys.left = true;  e.preventDefault(); }
    else if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === ' ' || e.code === 'Space') {
        if (!keys.jump) jumpQueued = true;
        keys.jump = true;
        e.preventDefault();
    }
});
window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft')  keys.left = false;
    else if (e.key === 'ArrowRight') keys.right = false;
    else if (e.key === 'ArrowUp' || e.key === ' ' || e.code === 'Space') keys.jump = false;
});

// D-pad
function bindHold(btn, prop) {
    btn.addEventListener('mousedown', function (e) { keys[prop] = true; e.preventDefault(); });
    btn.addEventListener('mouseup', function () { keys[prop] = false; });
    btn.addEventListener('mouseleave', function () { keys[prop] = false; });
    btn.addEventListener('touchstart', function (e) { keys[prop] = true; e.preventDefault(); }, { passive: false });
    btn.addEventListener('touchend', function (e) { keys[prop] = false; e.preventDefault(); }, { passive: false });
    btn.addEventListener('touchcancel', function () { keys[prop] = false; });
}
bindHold(document.getElementById('left-btn'), 'left');
bindHold(document.getElementById('right-btn'), 'right');
const jumpBtn = document.getElementById('jump-btn');
jumpBtn.addEventListener('mousedown', function (e) { jumpQueued = true; keys.jump = true; e.preventDefault(); });
jumpBtn.addEventListener('mouseup', function () { keys.jump = false; });
jumpBtn.addEventListener('mouseleave', function () { keys.jump = false; });
jumpBtn.addEventListener('touchstart', function (e) { jumpQueued = true; keys.jump = true; e.preventDefault(); }, { passive: false });
jumpBtn.addEventListener('touchend', function (e) { keys.jump = false; e.preventDefault(); }, { passive: false });

// Touch on canvas: drag to move, tap to jump
let canvasTouch = null;
canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (!running) return;
    const t = e.changedTouches[0];
    canvasTouch = { id: t.identifier, startX: t.clientX, startY: t.clientY, lastX: t.clientX, moved: false, time: performance.now() };
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!canvasTouch) return;
    for (const t of e.changedTouches) {
        if (t.identifier !== canvasTouch.id) continue;
        const dx = t.clientX - canvasTouch.lastX;
        if (Math.abs(t.clientX - canvasTouch.startX) > 8) canvasTouch.moved = true;
        if (dx < -2) { keys.left = true; keys.right = false; }
        else if (dx > 2) { keys.right = true; keys.left = false; }
        canvasTouch.lastX = t.clientX;
    }
}, { passive: false });
canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (!canvasTouch) return;
    for (const t of e.changedTouches) {
        if (t.identifier !== canvasTouch.id) continue;
        const dt = performance.now() - canvasTouch.time;
        if (!canvasTouch.moved && dt < 300) {
            jumpQueued = true;
        }
        keys.left = false; keys.right = false;
        canvasTouch = null;
    }
}, { passive: false });

// ================== Update ==================
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update(dt) {
    bgPhase += dt * 0.4;

    if (deathAnim > 0) {
        deathAnim -= dt;
        // particles only during death
        particles = particles.filter(function (p) {
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vy += 400 * dt; p.life -= dt;
            return p.life > 0;
        });
        if (deathAnim <= 0 && !gameOverTriggered) {
            gameOverTriggered = true;
            gameOver();
        }
        return;
    }

    // Boost timer
    if (boostT > 0) boostT -= dt;
    if (invincibleT > 0) invincibleT -= dt;
    if (shakeT > 0) shakeT -= dt;

    // Player horizontal
    const speed = MOVE_SPEED * (boostT > 0 ? 1.15 : 1);
    let targetVx = 0;
    if (keys.left)  targetVx -= speed;
    if (keys.right) targetVx += speed;
    if (player.onGround) {
        player.vx = targetVx;
    } else {
        // air control
        player.vx += (targetVx - player.vx) * AIR_CONTROL * dt * 6;
    }
    if (targetVx > 0) player.facing = 1;
    else if (targetVx < 0) player.facing = -1;

    // Jump
    const canJump = player.onGround || player.coyote > 0;
    if (jumpQueued && canJump) {
        player.vy = JUMP_VEL * (boostT > 0 ? 1.5 : 1);
        player.onGround = false;
        player.coyote = 0;
        playJump();
    }
    jumpQueued = false;

    // Apply gravity
    player.vy += GRAVITY * dt;
    if (player.vy > 900) player.vy = 900;

    // Horizontal move
    player.x += player.vx * dt;
    // wrap walls
    if (player.x < -PLAYER_W * 0.5) player.x = W - PLAYER_W * 0.5;
    if (player.x > W - PLAYER_W * 0.5) player.x = -PLAYER_W * 0.5;

    // Vertical move with platform collision
    const prevY = player.y;
    player.y += player.vy * dt;

    let landed = false;
    if (player.vy > 0) {
        for (const p of platforms) {
            const wasAbove = (prevY + PLAYER_H) <= p.y + 1;
            const nowBelow = (player.y + PLAYER_H) >= p.y;
            const overlapsX = (player.x + PLAYER_W * 0.85) > p.x && (player.x + PLAYER_W * 0.15) < (p.x + p.w);
            if (wasAbove && nowBelow && overlapsX) {
                player.y = p.y - PLAYER_H;
                player.vy = 0;
                if (!player.onGround) playLand();
                player.onGround = true;
                landed = true;
                break;
            }
        }
    }
    if (!landed) {
        if (player.onGround) player.coyote = COYOTE_TIME;
        player.onGround = false;
    }
    if (player.coyote > 0) player.coyote -= dt;

    // Run animation phase
    if (player.onGround && Math.abs(player.vx) > 30) {
        player.runPhase += dt * 12;
    }

    // Update camera: smoothly follow player upward only
    if (player.y < highestY) highestY = player.y;
    const targetCam = highestY - H * 0.45;
    cameraY += (targetCam - cameraY) * Math.min(1, dt * 4);

    // Lava rises (in world coords, lavaY decreases)
    const lavaSpeed = currentLevel.lavaSpeed * (boostT > 0 ? 0.8 : 1);
    lavaY -= lavaSpeed * dt;
    // But lava should never be lower than camera bottom + some, keep visible threat
    const lavaScreenY = lavaY - cameraY;
    // If lava is below the visible area too far, snap it up so it always threatens
    if (lavaScreenY > H + 200) lavaY = cameraY + H + 200;

    // Score from height climbed (1 per meter; 1 meter = ~15px)
    const climbed = Math.max(0, Math.floor((-highestY + 120) / 15));
    if (climbed > score) {
        const newScore = climbed;
        // Add only the increment that came from climbing — but the bonuses (gems/coins) are
        // separately added via direct score++. We just bump baseline:
        // To keep it simple: score = climb + bonuses tracked together. Use a separate counter:
    }

    // Generate platforms ahead of camera
    while (nextPlatformY > cameraY - 100) {
        generateNextPlatform();
    }
    // Cull old platforms way below
    platforms = platforms.filter(p => p.y < cameraY + H + 200);
    gems = gems.filter(g => g.alive && g.y < cameraY + H + 100);
    coins = coins.filter(c => c.alive && c.y < cameraY + H + 100);
    hearts = hearts.filter(h => h.alive && h.y < cameraY + H + 100);
    boosts = boosts.filter(b => b.alive && b.y < cameraY + H + 100);

    // Update gems/coins animation + collect
    const px = player.x, py = player.y, pw = PLAYER_W, ph = PLAYER_H;
    for (const g of gems) {
        g.phase += dt * 3;
        if (g.alive && rectsOverlap(px, py, pw, ph, g.x, g.y, 24, 24)) {
            g.alive = false;
            score += 5;
            scoreEl.textContent = score;
            popup('+5', g.x + 12, g.y, '#7afaff');
            playGem();
            checkLevelUp();
        }
    }
    for (const c of coins) {
        c.phase += dt * 4;
        if (c.alive && rectsOverlap(px, py, pw, ph, c.x, c.y, 18, 18)) {
            c.alive = false;
            score += 1;
            scoreEl.textContent = score;
            popup('+1', c.x + 9, c.y, '#ffdd57');
            playCoin();
            checkLevelUp();
        }
    }
    for (const h of hearts) {
        h.phase += dt * 3;
        if (h.alive && rectsOverlap(px, py, pw, ph, h.x, h.y, 28, 28)) {
            h.alive = false;
            if (lives < 3) {
                lives++;
                livesEl.textContent = lives;
            }
            popup('❤️+1', h.x + 14, h.y, '#ff5577');
            playHeart();
        }
    }
    for (const b of boosts) {
        b.phase += dt * 4;
        if (b.alive && rectsOverlap(px, py, pw, ph, b.x, b.y, 26, 26)) {
            b.alive = false;
            boostT = 5;
            popup('⚡ קפיצה!', b.x + 13, b.y, '#ffdd57');
            playGem();
        }
    }

    // Fire vents — damage if standing in their flame
    for (const p of platforms) {
        if (!p.vent) continue;
        p.vent.phase += dt * 4;
        const flameStrong = 0.5 + 0.5 * Math.sin(p.vent.phase);
        if (flameStrong > 0.4 && invincibleT <= 0) {
            const vx = p.x + p.vent.offsetX;
            const vy = p.y - 50;
            if (rectsOverlap(px, py, pw, ph, vx - 8, vy, 16, 50)) {
                hitPlayer();
            }
        }
    }

    // Skeletons — damage on contact
    for (const p of platforms) {
        if (!p.skull) continue;
        if (invincibleT > 0) continue;
        const sx = p.x + p.skull.offsetX;
        const sy = p.y - 36;
        if (rectsOverlap(px, py, pw, ph, sx - 12, sy, 24, 36)) {
            hitPlayer();
        }
    }

    // Falling rocks
    // Spawn rocks based on level
    if (Math.random() < currentLevel.rockChance * dt) {
        spawnFallingRock();
    }
    for (let i = fallingRocks.length - 1; i >= 0; i--) {
        const r = fallingRocks[i];
        if (!r.falling) {
            r.warning -= dt;
            if (r.warning <= 0) {
                r.falling = true;
                r.y = cameraY - 30;
                r.vy = 0;
            }
        } else if (!r.landed) {
            r.vy += 1200 * dt;
            r.y += r.vy * dt;
            // collision with player
            if (invincibleT <= 0 && rectsOverlap(px, py, pw, ph, r.x - r.size / 2, r.y - r.size / 2, r.size, r.size)) {
                hitPlayer();
                spawnParticles(r.x, r.y, '#7a4a2a', 14, 220);
                fallingRocks.splice(i, 1);
                continue;
            }
            // collide with any platform
            for (const p of platforms) {
                if (r.x > p.x && r.x < p.x + p.w && r.y + r.size / 2 >= p.y && r.y < p.y + 20) {
                    r.landed = true;
                    shakeT = 0.25;
                    playRock();
                    spawnParticles(r.x, p.y, '#7a4a2a', 16, 240);
                    break;
                }
            }
            // gone off screen
            if (r.y > cameraY + H + 60) fallingRocks.splice(i, 1);
        } else {
            // landed rocks fade
            r.fadeT = (r.fadeT || 1.2) - dt;
            if (r.fadeT <= 0) fallingRocks.splice(i, 1);
        }
    }

    // Lava collision = instant game over
    if (player.y + PLAYER_H >= lavaY) {
        triggerDeath('lava');
        return;
    }
    // Falling off bottom of screen (lava chase)
    if (player.y > cameraY + H + 80) {
        triggerDeath('lava');
        return;
    }

    // Particles update
    particles = particles.filter(function (p) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 400 * dt; p.life -= dt;
        return p.life > 0;
    });

    // Popups
    popups = popups.filter(function (p) {
        p.y += p.vy * dt;
        p.life -= dt;
        return p.life > 0;
    });

    // Level banner
    if (levelBanner) {
        levelBanner.life -= dt;
        if (levelBanner.life <= 0) levelBanner = null;
    }

    // Score from climbing
    const climbScore = Math.max(0, Math.floor((-highestY - (-(-120))) / 15)); // simplified
    // We want height in meters: how far above start
    const startY = -120;
    const heightMeters = Math.max(0, Math.floor((startY - highestY) / 15));
    heightEl.textContent = heightMeters;
    // Score includes height
    const heightBonus = heightMeters;
    // We track collectible-score separately:
    if (heightBonus > playerHeightScore) {
        const diff = heightBonus - playerHeightScore;
        playerHeightScore = heightBonus;
        score += diff;
        scoreEl.textContent = score;
        checkLevelUp();
    }
}

let playerHeightScore = 0;

function checkLevelUp() {
    const lvl = getLevelFor(score);
    if (lvl.num !== currentLevel.num) {
        currentLevel = lvl;
        levelBanner = { text: lvl.name, life: 2.2 };
        playLevelUp();
        updateLevelUi();
    } else {
        updateLevelUi();
    }
}

function hitPlayer() {
    if (invincibleT > 0) return;
    lives--;
    livesEl.textContent = lives;
    invincibleT = 1.4;
    shakeT = 0.18;
    playHit();
    popup('-1 ❤️', player.x + PLAYER_W / 2, player.y - 10, '#ff3366');
    spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#ff3366', 14, 220);
    // small knockback up
    player.vy = -340;
    if (lives <= 0) {
        triggerDeath('hazard');
    }
}

function triggerDeath(cause) {
    if (deathAnim > 0 || gameOverTriggered) return;
    deathAnim = 1.0;
    player.dead = true;
    spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2,
        cause === 'lava' ? '#ff5500' : '#ff3366', 30, 320);
}

// ================== Render ==================
function worldToScreen(y) { return y - cameraY; }

function drawBg() {
    // Volcanic cave: dark gradient with red glow
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a0500');
    g.addColorStop(0.5, '#3a0a00');
    g.addColorStop(1, '#5a1500');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Parallax rocky cave walls (parallax based on cameraY)
    const para = cameraY * 0.3;
    ctx.fillStyle = 'rgba(80,25,10,0.6)';
    for (let i = 0; i < 14; i++) {
        const rx = (i * 73) % W;
        const ry = ((i * 137 - para) % H + H) % H;
        const rr = 30 + (i * 13) % 40;
        ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.fill();
    }
    // Foreground rocky shapes
    const para2 = cameraY * 0.6;
    ctx.fillStyle = 'rgba(40,10,5,0.7)';
    for (let i = 0; i < 10; i++) {
        const rx = ((i * 113) % W);
        const ry = ((i * 191 - para2) % H + H) % H;
        const rr = 18 + (i * 11) % 26;
        ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.fill();
    }

    // Glowing red dust particles in air
    for (let i = 0; i < 16; i++) {
        const t = bgPhase * 30 + i * 50;
        const px = (i * 89 + Math.sin(t * 0.02) * 30) % W;
        const py = ((t * 0.5 - cameraY * 0.5) % H + H) % H;
        ctx.fillStyle = 'rgba(255,120,30,' + (0.3 + 0.3 * Math.sin(t * 0.05)) + ')';
        ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
    }
}

function drawPlatform(p) {
    const sy = worldToScreen(p.y);
    if (sy > H + 30 || sy + p.h < -10) return;
    // Stone body
    ctx.fillStyle = '#5a3422';
    ctx.fillRect(p.x, sy, p.w, p.h);
    // Top highlight (mossy/lighter)
    ctx.fillStyle = '#8a5a3a';
    ctx.fillRect(p.x, sy, p.w, 5);
    // Bottom dark
    ctx.fillStyle = '#2a1808';
    ctx.fillRect(p.x, sy + p.h - 4, p.w, 4);
    // Edge cracks
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < 4; i++) {
        const cx = p.x + (p.w * i / 4);
        ctx.moveTo(cx, sy + 5);
        ctx.lineTo(cx + 3, sy + p.h - 5);
    }
    ctx.stroke();
    // Outline
    ctx.strokeStyle = '#1a0805';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, sy, p.w, p.h);

    // Fire vent on top
    if (p.vent) {
        const vx = p.x + p.vent.offsetX;
        const vy = sy;
        const flameH = 38 + Math.sin(p.vent.phase) * 12;
        // vent base
        ctx.fillStyle = '#1a0805';
        ctx.fillRect(vx - 9, vy - 4, 18, 8);
        // flame layers
        const grad = ctx.createLinearGradient(vx, vy - flameH, vx, vy);
        grad.addColorStop(0, 'rgba(255,255,200,0)');
        grad.addColorStop(0.3, '#ffdd57');
        grad.addColorStop(0.7, '#ff6600');
        grad.addColorStop(1, '#cc1100');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(vx - 8, vy);
        ctx.quadraticCurveTo(vx - 6, vy - flameH * 0.6, vx, vy - flameH);
        ctx.quadraticCurveTo(vx + 6, vy - flameH * 0.6, vx + 8, vy);
        ctx.closePath();
        ctx.fill();
        // inner flame
        ctx.fillStyle = 'rgba(255,255,180,0.7)';
        ctx.beginPath();
        ctx.moveTo(vx - 4, vy);
        ctx.quadraticCurveTo(vx - 3, vy - flameH * 0.5, vx, vy - flameH * 0.7);
        ctx.quadraticCurveTo(vx + 3, vy - flameH * 0.5, vx + 4, vy);
        ctx.closePath();
        ctx.fill();
    }

    // Skeleton
    if (p.skull) {
        const sx = p.x + p.skull.offsetX;
        const baseY = sy;
        const bob = Math.sin(p.skull.phase) * 2;
        // body bones
        ctx.fillStyle = '#e8e2c8';
        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 2;
        // legs
        ctx.fillRect(sx - 6, baseY - 14 + bob, 4, 14);
        ctx.fillRect(sx + 2, baseY - 14 + bob, 4, 14);
        ctx.strokeRect(sx - 6, baseY - 14 + bob, 4, 14);
        ctx.strokeRect(sx + 2, baseY - 14 + bob, 4, 14);
        // ribcage
        ctx.fillRect(sx - 8, baseY - 24 + bob, 16, 10);
        ctx.strokeRect(sx - 8, baseY - 24 + bob, 16, 10);
        // skull head
        ctx.beginPath(); ctx.arc(sx, baseY - 30 + bob, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // eye sockets
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(sx - 3, baseY - 31 + bob, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 3, baseY - 31 + bob, 2, 0, Math.PI * 2); ctx.fill();
        // teeth
        ctx.fillStyle = '#222';
        ctx.fillRect(sx - 3, baseY - 26 + bob, 6, 2);
    }
}

function drawGem(g) {
    const sy = worldToScreen(g.y);
    if (sy > H + 30 || sy < -30) return;
    const bob = Math.sin(g.phase) * 3;
    const cx = g.x + 12, cy = sy + 12 + bob;
    // glow
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
    glow.addColorStop(0, 'rgba(120,250,255,0.6)');
    glow.addColorStop(1, 'rgba(120,250,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.fill();
    // diamond shape
    ctx.fillStyle = '#7afaff';
    ctx.strokeStyle = '#2a8aff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 10);
    ctx.lineTo(cx + 9, cy);
    ctx.lineTo(cx, cy + 10);
    ctx.lineTo(cx - 9, cy);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // sparkle
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(g.phase * 2)) + ')';
    ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 2, 0, Math.PI * 2); ctx.fill();
}

function drawCoin(c) {
    const sy = worldToScreen(c.y);
    if (sy > H + 30 || sy < -30) return;
    const bob = Math.sin(c.phase) * 2;
    const cx = c.x + 9, cy = sy + 9 + bob;
    const sw = 8 + Math.abs(Math.sin(c.phase)) * 1;
    // outer
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.ellipse(cx, cy, sw, 8, 0, 0, Math.PI * 2); ctx.fill();
    // inner
    ctx.fillStyle = '#ffdd57';
    ctx.beginPath(); ctx.ellipse(cx, cy, sw * 0.7, 6, 0, 0, Math.PI * 2); ctx.fill();
    // star
    ctx.fillStyle = '#b87000';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', cx, cy);
}

function drawHeart(h) {
    const sy = worldToScreen(h.y);
    if (sy > H + 30 || sy < -30) return;
    const bob = Math.sin(h.phase) * 3;
    const cx = h.x + 14, cy = sy + 14 + bob;
    ctx.fillStyle = '#ff3366';
    ctx.strokeStyle = '#990022';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 10);
    ctx.bezierCurveTo(cx - 14, cy - 4, cx - 10, cy - 14, cx, cy - 6);
    ctx.bezierCurveTo(cx + 10, cy - 14, cx + 14, cy - 4, cx, cy + 10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.ellipse(cx - 4, cy - 4, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBoost(b) {
    const sy = worldToScreen(b.y);
    if (sy > H + 30 || sy < -30) return;
    const bob = Math.sin(b.phase) * 3;
    const cx = b.x + 14, cy = sy + 14 + bob;
    // glow
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 24);
    glow.addColorStop(0, 'rgba(255,255,100,0.7)');
    glow.addColorStop(1, 'rgba(255,255,100,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI * 2); ctx.fill();
    // lightning bolt
    ctx.fillStyle = '#ffdd57';
    ctx.strokeStyle = '#b87000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + 2, cy - 12);
    ctx.lineTo(cx - 6, cy + 2);
    ctx.lineTo(cx, cy + 2);
    ctx.lineTo(cx - 2, cy + 12);
    ctx.lineTo(cx + 6, cy - 2);
    ctx.lineTo(cx, cy - 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
}

function drawPlayer() {
    if (!player) return;
    const sy = worldToScreen(player.y);
    if (sy > H + 60 || sy < -60) return;
    // Flicker if invincible
    if (invincibleT > 0 && Math.floor(invincibleT * 18) % 2 === 0) return;
    // Death animation: shrink + tint
    let scaleY = 1, scaleX = 1, alpha = 1;
    if (player.dead) {
        const t = 1 - deathAnim;
        scaleY = 1 - t * 0.6;
        scaleX = 1 + t * 0.2;
        alpha = deathAnim;
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    const px = player.x + PLAYER_W / 2;
    const py = sy + PLAYER_H;
    ctx.translate(px, py);
    ctx.scale(player.facing * scaleX, scaleY);
    // Legs (run animation)
    const legSwing = player.onGround && Math.abs(player.vx) > 30 ? Math.sin(player.runPhase) * 4 : 0;
    const legBack = !player.onGround ? -3 : 0;
    ctx.fillStyle = '#2a4a8a';
    // left leg
    ctx.fillRect(-10, -18, 8, 18 + legSwing);
    // right leg
    ctx.fillRect(2, -18, 8, 18 - legSwing + legBack);
    // boots
    ctx.fillStyle = '#2a1408';
    ctx.fillRect(-11, -2 + legSwing, 10, 4);
    ctx.fillRect(1, -2 - legSwing + legBack, 10, 4);
    // Bag on back
    ctx.fillStyle = '#5a3a1a';
    ctx.strokeStyle = '#2a1808';
    ctx.lineWidth = 2;
    ctx.fillRect(-18, -42, 8, 18);
    ctx.strokeRect(-18, -42, 8, 18);
    // bag strap
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, -42); ctx.lineTo(-2, -45); ctx.stroke();
    // Body / red shirt
    ctx.fillStyle = '#cc2233';
    ctx.strokeStyle = '#660011';
    ctx.lineWidth = 2;
    ctx.fillRect(-12, -42, 24, 24);
    ctx.strokeRect(-12, -42, 24, 24);
    // shirt detail (collar)
    ctx.fillStyle = '#992211';
    ctx.fillRect(-12, -42, 24, 4);
    // Arms
    ctx.fillStyle = '#cc2233';
    const armSwing = player.onGround && Math.abs(player.vx) > 30 ? Math.sin(player.runPhase + Math.PI) * 3 : 0;
    ctx.fillRect(-16, -40 + armSwing, 5, 16);
    ctx.fillRect(11, -40 - armSwing, 5, 16);
    // skin hands
    ctx.fillStyle = '#f4c89a';
    ctx.fillRect(-16, -25 + armSwing, 5, 5);
    ctx.fillRect(11, -25 - armSwing, 5, 5);
    // Head
    ctx.fillStyle = '#f4c89a';
    ctx.strokeStyle = '#7a3a10';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -50, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Hair line
    ctx.fillStyle = '#3a1a08';
    ctx.fillRect(-9, -56, 18, 4);
    // Hat (brown explorer hat)
    ctx.fillStyle = '#6a3a1a';
    ctx.strokeStyle = '#2a1408';
    ctx.lineWidth = 2;
    // hat brim
    ctx.beginPath();
    ctx.ellipse(0, -57, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // hat top
    ctx.fillRect(-7, -66, 14, 10);
    ctx.strokeRect(-7, -66, 14, 10);
    // hat band
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(-7, -60, 14, 3);
    // Eyes
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-3, -50, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -50, 1.5, 0, Math.PI * 2); ctx.fill();
    // Mouth (determined)
    ctx.strokeStyle = '#5a2a10';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-3, -46); ctx.lineTo(3, -46); ctx.stroke();

    ctx.restore();

    // Boost glow aura
    if (boostT > 0) {
        ctx.save();
        const aura = ctx.createRadialGradient(player.x + PLAYER_W / 2, sy + PLAYER_H / 2, 5,
            player.x + PLAYER_W / 2, sy + PLAYER_H / 2, 50);
        aura.addColorStop(0, 'rgba(255,255,100,0.35)');
        aura.addColorStop(1, 'rgba(255,255,100,0)');
        ctx.fillStyle = aura;
        ctx.beginPath(); ctx.arc(player.x + PLAYER_W / 2, sy + PLAYER_H / 2, 50, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

function drawFallingRocks() {
    for (const r of fallingRocks) {
        if (!r.falling) {
            // Warning shadow at target
            const sy = worldToScreen(r.warnY);
            if (sy < -20 || sy > H + 20) continue;
            const blink = 0.4 + 0.4 * Math.sin(performance.now() * 0.02);
            ctx.fillStyle = `rgba(255,40,0,${blink})`;
            ctx.beginPath(); ctx.ellipse(r.warnX, sy, r.size * 0.9, r.size * 0.4, 0, 0, Math.PI * 2); ctx.fill();
            // Warning marker symbol falling from sky
            ctx.fillStyle = 'rgba(255,80,0,0.7)';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('!', r.warnX, Math.max(20, sy - 40 - blink * 10));
        } else {
            const sy = worldToScreen(r.y);
            if (sy < -50 || sy > H + 50) continue;
            // Rock
            ctx.save();
            ctx.translate(r.x, sy);
            ctx.fillStyle = '#5a3a22';
            ctx.strokeStyle = '#2a1808';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const s = r.size / 2;
            ctx.moveTo(-s, 0);
            ctx.lineTo(-s * 0.5, -s);
            ctx.lineTo(s * 0.6, -s * 0.8);
            ctx.lineTo(s, s * 0.2);
            ctx.lineTo(s * 0.4, s);
            ctx.lineTo(-s * 0.7, s * 0.6);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            // highlight
            ctx.fillStyle = '#8a5a3a';
            ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.3, s * 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    }
}

function drawLava() {
    const sy = worldToScreen(lavaY);
    if (sy > H + 20) return;
    // Heat shimmer above lava
    const shimmerH = 30;
    for (let i = 0; i < 5; i++) {
        const a = 0.08 + 0.03 * Math.sin(bgPhase * 3 + i);
        ctx.fillStyle = `rgba(255,180,80,${a})`;
        ctx.fillRect(0, sy - shimmerH - i * 8, W, 6);
    }
    // Lava surface (wavy)
    ctx.fillStyle = '#ff5500';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, sy);
    const waveAmp = 8;
    const segs = 30;
    for (let i = 0; i <= segs; i++) {
        const xx = (i / segs) * W;
        const yy = sy + Math.sin(bgPhase * 4 + i * 0.6) * waveAmp;
        ctx.lineTo(xx, yy);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    // gradient
    const lg = ctx.createLinearGradient(0, sy - 10, 0, H);
    lg.addColorStop(0, '#ffee44');
    lg.addColorStop(0.2, '#ff8800');
    lg.addColorStop(0.6, '#ff3300');
    lg.addColorStop(1, '#aa0a00');
    ctx.fillStyle = lg;
    ctx.fill();
    // Glow above lava
    const glow = ctx.createLinearGradient(0, sy - 60, 0, sy);
    glow.addColorStop(0, 'rgba(255,80,0,0)');
    glow.addColorStop(1, 'rgba(255,80,0,0.45)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, sy - 60, W, 60);
    // Bubbles
    for (let i = 0; i < 6; i++) {
        const t = bgPhase * 0.7 + i;
        const bx = ((i * 117 + Math.sin(t) * 50 + bgPhase * 30) % W + W) % W;
        const cyc = ((Math.sin(t * 1.7) + 1) * 0.5);
        const by = sy + 8 + cyc * 24;
        const br = 4 + Math.sin(t * 2) * 2 + 2;
        ctx.fillStyle = 'rgba(255,220,80,0.85)';
        ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,200,0.6)';
        ctx.beginPath(); ctx.arc(bx - br * 0.3, by - br * 0.3, br * 0.3, 0, Math.PI * 2); ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, worldToScreen(p.y) + cameraY - p.y + p.y, 0, 0, 0); // particles in screen space
        ctx.fill();
        // simpler: draw at p.x, p.y directly (we store screen-space y where created with player)
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawPopups() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Comic Sans MS, Arial';
    for (const p of popups) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.lineWidth = 4;
        const sy = worldToScreen(p.y);
        ctx.strokeText(p.text, p.x, sy);
        ctx.fillText(p.text, p.x, sy);
    }
    ctx.globalAlpha = 1;
}

function drawLevelBanner() {
    if (!levelBanner) return;
    const a = Math.min(1, levelBanner.life / 0.4);
    ctx.globalAlpha = a;
    ctx.font = 'bold 36px Comic Sans MS, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = levelBanner.text;
    const padX = 22, padY = 12;
    const m = ctx.measureText(text);
    const bw = m.width + padX * 2;
    const bh = 36 + padY * 2;
    const bx = W / 2 - bw / 2;
    const by = H / 2 - bh / 2;
    ctx.fillStyle = 'rgba(40,5,0,0.9)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.fill(); }
    else                  ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = currentLevel.color;
    ctx.lineWidth = 4;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14); ctx.stroke(); }
    else                  ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = currentLevel.color;
    ctx.shadowBlur = 18; ctx.shadowColor = currentLevel.color;
    ctx.fillText(text, W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

function render() {
    ctx.save();
    if (shakeT > 0) {
        const mag = shakeT * 28;
        ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }
    drawBg();
    for (const p of platforms) drawPlatform(p);
    for (const g of gems) if (g.alive) drawGem(g);
    for (const c of coins) if (c.alive) drawCoin(c);
    for (const h of hearts) if (h.alive) drawHeart(h);
    for (const b of boosts) if (b.alive) drawBoost(b);
    drawFallingRocks();
    drawPlayer();
    drawLava();
    drawParticles();
    drawPopups();
    drawLevelBanner();
    ctx.restore();
}

// ================== Loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    update(dt);
    render();
    if (running) rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    start();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    scoreEl.textContent = '0';
    livesEl.textContent = '3';
    levelEl.textContent = '—';
    heightEl.textContent = '0';

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name: name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🌋 בריחה מהר געש</h2>' +
        '<p>מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">🌋 שחק</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', function (e) { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    drawBg();

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showGameOver() {
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = score === myBest && score > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === score && score > 0;
    const lvlReached = getLevelFor(score);
    const heightReached = parseInt(heightEl.textContent, 10) || 0;

    let headline, msg;
    if (isKing && isNewRecord) {
        headline = '👑 מלך ההישרדות';
        msg = `${currentPlayer} עלה לראש הטבלה עם ${score} נקודות, ${heightReached} מטר (${lvlReached.name})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש';
        msg = `${currentPlayer} הגיע ל-${score} נקודות, טיפס ${heightReached} מטר ב${lvlReached.name}!`;
    } else {
        headline = '🌋 ניסיון טוב';
        msg = `${currentPlayer} צבר ${score} נקודות, ${heightReached} מטר (${lvlReached.name}).<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    setTimeout(showGameOver, 500);
}

function start() {
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();
    playerHeightScore = 0;
    resetGame();
    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

// ================== Mute ==================
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
});

// ================== Boot ==================
drawBg();
showPlayerSelect();
</script>
</body>
