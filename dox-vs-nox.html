<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOX VS NOX 3D 🌳</title>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            background: linear-gradient(135deg, #1a3a2a, #2d5a3a, #4a7a3a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Comic Sans MS', Arial, sans-serif;
            color: white;
            padding: 6px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: clamp(1em, 3.3vw, 1.6em);
            margin: 4px 0;
            color: white;
            text-shadow: 0 2px 0 #1a3a1a, 0 0 16px rgba(120,220,120,0.6);
            text-align: center;
        }

        #status-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .status-pill {
            font-size: clamp(0.75em, 1.7vw, 0.95em);
            padding: 4px 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #4a7a3a;
            border-radius: 25px;
            color: #1a3a1a;
            font-weight: bold;
        }
        #hp        { color: #d22e2e; }
        #hunger    { color: #d2762e; }
        #wood      { color: #8b5a2b; }
        #bones     { color: #888; }
        #stone     { color: #555; }
        #score     { color: #00a86b; }
        #level     { color: #ff8a00; }
        #time-of-day { color: #1a78c2; }
        #current-player { color: #1a78c2; }

        #game-wrap {
            position: relative;
            width:  min(98vw, calc((100vh - 140px) * 16 / 9));
            height: min(55.125vw, calc(100vh - 140px));
            max-width: 98vw;
            max-height: calc(100vh - 140px);
            border: 5px solid #4a7a3a;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(74,122,58,0.6);
            background: #6cb0e8;
            overflow: hidden;
        }

        #three-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }
        #three-canvas:active { cursor: grabbing; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            background: rgba(15,30,20,0.94);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
            z-index: 50;
        }
        #overlay h2 {
            font-size: clamp(1.1em, 3.8vw, 1.9em);
            color: #9bff66;
            text-shadow: 0 0 14px #9bff66;
            margin-bottom: 6px;
        }
        #overlay p {
            font-size: clamp(0.85em, 2.2vw, 1.05em);
            color: #d8f5d8;
            margin-bottom: 8px;
        }

        .name-form { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: clamp(1em, 2.4vw, 1.1em);
            font-family: 'Comic Sans MS', Arial, sans-serif;
            border: 3px solid #4a7a3a;
            border-radius: 12px;
            background: rgba(255,255,255,0.95);
            color: #1a3a1a;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .name-input::placeholder { color: rgba(26,58,26,0.5); }
        .name-input:focus { border-color: #9bff66; }

        .recent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; width: 100%; max-width: 360px; margin-bottom: 8px; }
        .player-btn {
            background: linear-gradient(135deg, #4a7a3a, #2d5a3a);
            color: white;
            border: none;
            padding: 8px 6px;
            font-size: clamp(0.85em, 2.2vw, 1em);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(74,122,58,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .player-btn:active { transform: scale(1.08); }

        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 360px; margin-bottom: 10px; }
        .char-btn {
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(155,255,102,0.4);
            color: white;
            padding: 8px 4px;
            font-weight: bold;
            font-size: clamp(0.85em, 2vw, 1em);
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .char-btn.dox { border-color: #d22e2e; }
        .char-btn.nox { border-color: #7a3aa8; }
        .char-btn.rom { border-color: #3aa84a; }
        .char-btn.selected { background: rgba(155,255,102,0.25); transform: scale(1.05); }
        .char-emoji { font-size: 1.7em; display: block; margin-bottom: 2px; }

        .end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .primary-btn {
            background: linear-gradient(135deg, #9bff66, #4a7a3a);
            color: #1a3a1a;
            border: none;
            padding: 10px 26px;
            font-size: clamp(0.95em, 2.3vw, 1.1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(155,255,102,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .secondary-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            font-size: clamp(0.9em, 2.1vw, 1em);
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .leaderboard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(155,255,102,0.5);
            border-radius: 10px;
            padding: 6px 12px;
            margin: 4px 0 8px;
            width: 100%;
            max-width: 320px;
        }
        .leaderboard-title { color: #9bff66; font-size: 0.95em; margin-bottom: 4px; font-weight: bold; }
        .leaderboard table { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 0.9em; }
        .leaderboard td { padding: 3px 5px; color: #d8f5d8; }
        .leaderboard tr.highlight td { background: rgba(155,255,102,0.25); color: white; }
        .leaderboard tr.highlight td:first-child { border-radius: 6px 0 0 6px; }
        .leaderboard tr.highlight td:last-child  { border-radius: 0 6px 6px 0; }
        .leaderboard td:first-child { width: 26px; text-align: center; font-size: 1.1em; }
        .leaderboard td:last-child  { text-align: left; color: #9bff66; font-weight: bold; width: 50px; }

        #mute {
            position: fixed;
            top: 10px; left: 10px;
            background: rgba(255,255,255,0.85);
            border: 3px solid #4a7a3a;
            color: #1a3a1a;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #mute:active { background: #9bff66; }

        #hint {
            margin-top: 5px;
            color: white;
            text-shadow: 0 1px 0 #1a3a1a;
            font-size: clamp(0.75em, 1.8vw, 0.9em);
            text-align: center;
            padding: 0 10px;
            font-weight: bold;
        }

        /* --- In-game HUD --- */
        #build-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.55);
            padding: 6px 10px;
            border-radius: 14px;
            border: 2px solid #9bff66;
            z-index: 20;
            direction: ltr;
        }
        .build-btn {
            background: rgba(255,255,255,0.85);
            color: #1a3a1a;
            border: 2px solid transparent;
            padding: 6px 10px;
            font-size: clamp(0.7em, 1.6vw, 0.85em);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-width: 56px;
            text-align: center;
            line-height: 1.1;
        }
        .build-btn.active { background: #9bff66; border-color: #1a3a1a; }
        .build-btn .be { font-size: 1.2em; display: block; }

        #night-banner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,15,40,0.85);
            border: 4px solid #c08bff;
            color: #fff;
            padding: 16px 32px;
            border-radius: 18px;
            font-size: clamp(1.3em, 4vw, 2.4em);
            font-weight: bold;
            text-shadow: 0 0 12px #c08bff;
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #night-banner.show { opacity: 1; }

        /* Touch controls */
        #touch-controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        body.touch #touch-controls { display: block; }

        #joystick {
            position: absolute;
            bottom: 14px;
            left: 14px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(0,0,0,0.25);
            border: 3px solid rgba(255,255,255,0.4);
            pointer-events: auto;
            touch-action: none;
        }
        #joy-knob {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(155,255,102,0.85);
            border: 3px solid #1a3a1a;
            pointer-events: none;
        }

        .touch-btn {
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            color: white;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid rgba(255,255,255,0.6);
            pointer-events: auto;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .touch-btn:active { transform: scale(0.92); }
        #btn-attack {
            bottom: 80px; right: 14px;
            width: 78px; height: 78px;
            background: rgba(180,40,40,0.75);
            font-size: 2em;
        }
        #btn-action {
            bottom: 14px; right: 100px;
            width: 64px; height: 64px;
            background: rgba(220,180,40,0.75);
            font-size: 1.5em;
        }
        #btn-build {
            bottom: 14px; right: 14px;
            width: 64px; height: 64px;
            background: rgba(40,120,200,0.75);
            font-size: 1.5em;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        body.has-build-ghost #crosshair { display: block; }
    </style>
</head>
<body>

<button id="mute" aria-label="השתק">🔊</button>

<h1>🌳 DOX VS NOX — שורד התלת-ממד 🌙</h1>

<div id="status-bar">
    <div class="status-pill">👤 <span id="current-player">—</span></div>
    <div class="status-pill">❤️ <span id="hp">100</span></div>
    <div class="status-pill">🍞 <span id="hunger">100</span></div>
    <div class="status-pill">🪵 <span id="wood">0</span></div>
    <div class="status-pill">🪨 <span id="stone">0</span></div>
    <div class="status-pill">🦴 <span id="bones">0</span></div>
    <div class="status-pill">⚡ <span id="score">0</span></div>
    <div class="status-pill">🎯 <span id="level">1</span></div>
    <div class="status-pill"><span id="time-of-day">☀️</span></div>
</div>

<div id="game-wrap">
    <canvas id="three-canvas"></canvas>
    <div id="crosshair"></div>
    <div id="night-banner"></div>

    <div id="build-bar" style="display:none"></div>

    <div id="touch-controls">
        <div id="joystick"><div id="joy-knob"></div></div>
        <div class="touch-btn" id="btn-attack">⚔️</div>
        <div class="touch-btn" id="btn-action">🤝</div>
        <div class="touch-btn" id="btn-build">🏗️</div>
    </div>

    <div id="overlay"></div>
</div>

<p id="hint">🎮 WASD לזוז · עכבר/גרירה לסובב מצלמה · רווח/קליק לאקסיון 🌳</p>

<script>
'use strict';

// ================== Detect touch ==================
const IS_TOUCH = ('ontouchstart' in window) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
if (IS_TOUCH) document.body.classList.add('touch');

// ================== DOM ==================
const wrap     = document.getElementById('game-wrap');
const canvas   = document.getElementById('three-canvas');
const overlay  = document.getElementById('overlay');
const hpEl     = document.getElementById('hp');
const hungerEl = document.getElementById('hunger');
const woodEl   = document.getElementById('wood');
const stoneEl  = document.getElementById('stone');
const bonesEl  = document.getElementById('bones');
const scoreEl  = document.getElementById('score');
const levelEl  = document.getElementById('level');
const todEl    = document.getElementById('time-of-day');
const currentPlayerEl = document.getElementById('current-player');
const buildBarEl = document.getElementById('build-bar');
const nightBannerEl = document.getElementById('night-banner');

// ================== Characters ==================
const CHARS = {
    dox: { name: 'DOX', body: 0xd22e2e, head: 0xf0c898, pants: 0x2a4a78, emoji: '🦊' },
    nox: { name: 'NOX', body: 0x7a3aa8, head: 0xe8c098, pants: 0x2a2a3a, emoji: '🦇' },
    rom: { name: 'ROM', body: 0x3aa84a, head: 0xf0c898, pants: 0x3a6abc, emoji: '🦖' },
};

// ================== Levels ==================
const LEVELS = [
    { num: 1, name: 'שלב 1 · קל',         minScore: 0,   enemyCount: 2,  enemyHpMul: 1.0, color: '#9bff66' },
    { num: 2, name: 'שלב 2 · קל-בינוני',   minScore: 25,  enemyCount: 3,  enemyHpMul: 1.1, color: '#cffd5e' },
    { num: 3, name: 'שלב 3 · בינוני',      minScore: 60,  enemyCount: 4,  enemyHpMul: 1.2, color: '#ffdd57' },
    { num: 4, name: 'שלב 4 · די קשה',      minScore: 120, enemyCount: 6,  enemyHpMul: 1.4, color: '#ffb347' },
    { num: 5, name: 'שלב 5 · קשה',        minScore: 200, enemyCount: 8,  enemyHpMul: 1.6, color: '#ff7733' },
    { num: 6, name: 'שלב 6 · קשה מאוד',   minScore: 320, enemyCount: 12, enemyHpMul: 1.9, color: '#ff3366' },
    { num: 7, name: 'שלב 7 · בטירוף 🔥',   minScore: 480, enemyCount: 15, enemyHpMul: 2.3, color: '#c92a52' },
];
function getLevelFor(s) {
    for (let i = LEVELS.length - 1; i >= 0; i--) if (s >= LEVELS[i].minScore) return LEVELS[i];
    return LEVELS[0];
}
function nextLevelGoal(level) {
    const next = LEVELS.find(l => l.num === level.num + 1);
    return next ? next.minScore : null;
}

// ================== Persistence ==================
const STORAGE_KEY = 'rom_doxnox_scores_v1';
let currentPlayer = null;
let currentCharKey = 'dox';

function loadScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveResult(player, finalScore) {
    const scores = loadScores();
    const e = scores[player] || { best: 0, games: 0, last: 0 };
    if (finalScore > e.best) e.best = finalScore;
    e.games = (e.games || 0) + 1;
    e.last  = finalScore;
    e.lastPlayed = Date.now();
    scores[player] = e;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
}
function allPlayersSorted() {
    return Object.entries(loadScores())
        .map(([name, v]) => ({ name, best: v.best || 0, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.best - a.best || b.lastPlayed - a.lastPlayed);
}
function leaderboardHtml(highlight) {
    const entries = allPlayersSorted().slice(0, 8);
    if (entries.length === 0) {
        return '<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השורדים</div><p style="color:#aaa;font-size:0.85em;margin:0">עוד אין שורדים — אתה תהיה הראשון! 🌳</p></div>';
    }
    const medals = ['🥇', '🥈', '🥉'];
    const rows = entries.map((e, i) => {
        const rank = i < 3 ? medals[i] : `${i + 1}.`;
        const clsAttr = e.name === highlight ? ' class="highlight"' : '';
        return `<tr${clsAttr}><td>${rank}</td><td>${e.name}</td><td>${e.best}</td></tr>`;
    }).join('');
    return `<div class="leaderboard"><div class="leaderboard-title">🏆 טבלת השורדים</div><table>${rows}</table></div>`;
}

// ================== Sound ==================
let audioCtx = null;
let muted = false;
function ensureAudio() {
    if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
}
function tone(freq, duration, type, vol, delay) {
    if (muted) return;
    const c = ensureAudio();
    if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol == null ? 0.1 : vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration);
}
function playChop()    { tone(220, 0.08, 'square', 0.14, 0); tone(140, 0.10, 'sawtooth', 0.12, 0.04); }
function playMine()    { tone(660, 0.05, 'square', 0.12, 0); tone(440, 0.05, 'square', 0.10, 0.05); }
function playBerry()   { tone(900, 0.06, 'sine', 0.10, 0); tone(1200, 0.08, 'sine', 0.10, 0.05); }
function playEat()     { tone(440, 0.06, 'triangle', 0.10, 0); tone(523, 0.08, 'triangle', 0.10, 0.05); }
function playSwing()   { tone(800, 0.05, 'sawtooth', 0.08, 0); tone(400, 0.06, 'sawtooth', 0.08, 0.03); }
function playHit()     { tone(180, 0.10, 'square', 0.16, 0); tone(90, 0.14, 'sawtooth', 0.14, 0.05); }
function playGrowl()   { tone(110, 0.18, 'sawtooth', 0.10, 0); tone(80, 0.20, 'sawtooth', 0.08, 0.10); }
function playBark()    { tone(440, 0.06, 'square', 0.12, 0); tone(520, 0.08, 'square', 0.12, 0.06); }
function playBonePick(){ tone(700, 0.06, 'sine', 0.10, 0); tone(900, 0.08, 'sine', 0.10, 0.05); }
function playBuild()   { tone(180, 0.12, 'square', 0.16, 0); tone(140, 0.10, 'sawtooth', 0.12, 0.06); }
function playNight()   { tone(80, 0.45, 'sawtooth', 0.14, 0); tone(60, 0.55, 'sine', 0.10, 0.10); }
function playDay()     { tone(523, 0.12, 'triangle', 0.14, 0); tone(659, 0.12, 'triangle', 0.14, 0.10); tone(784, 0.18, 'triangle', 0.14, 0.22); }
function playGameOver(){ tone(392, 0.18, 'sawtooth', 0.16, 0); tone(294, 0.18, 'sawtooth', 0.16, 0.18); tone(196, 0.4, 'sawtooth', 0.16, 0.36); }
function playLevelUp() { tone(523, 0.10, 'square', 0.16, 0); tone(659, 0.10, 'square', 0.16, 0.10); tone(784, 0.10, 'square', 0.16, 0.20); tone(1047, 0.22, 'square', 0.18, 0.30); }
function playStart()   { tone(440, 0.10, 'triangle', 0.16, 0); tone(550, 0.10, 'triangle', 0.16, 0.10); tone(660, 0.16, 'triangle', 0.16, 0.20); }

const MUSIC_NOTES_DAY   = [523, 659, 784, 880, 784, 659, 523, 440];
const BASS_NOTES_DAY    = [131, 131, 175, 175, 196, 196, 131, 131];
const MUSIC_NOTES_NIGHT = [220, 247, 196, 220, 175, 196, 165, 220];
const BASS_NOTES_NIGHT  = [82, 82, 98, 98, 82, 82, 65, 65];
let MUSIC_NOTES = MUSIC_NOTES_DAY;
let BASS_NOTES  = BASS_NOTES_DAY;
const NOTE_MS = 260;
let musicTimer = null, musicStep = 0;
function playMusicTick() {
    if (muted) { musicStep++; return; }
    const i = musicStep % MUSIC_NOTES.length;
    tone(MUSIC_NOTES[i], NOTE_MS / 1000 * 0.85, 'triangle', 0.045, 0);
    if (i % 2 === 0) tone(BASS_NOTES[i], NOTE_MS / 1000 * 1.6, 'sine', 0.05, 0);
    musicStep++;
}
function startMusic() {
    stopMusic(); musicStep = 0;
    playMusicTick();
    musicTimer = setInterval(playMusicTick, NOTE_MS);
}
function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ================== Three.js scene ==================
let renderer, scene, camera;
let sun, ambient, moonMesh, sunMesh;
let groundMesh, lakeMesh, sandMesh;
const WORLD_HALF = 100;     // 200x200 world
const LAKE_X = 35, LAKE_Z = -25, LAKE_R = 14;

// Game state
let running = false;
let rafId = null;
let lastT = 0;

// ================== Build world ==================
function initThree() {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    resizeRenderer();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x88c8ff);
    scene.fog = new THREE.Fog(0x88c8ff, 30, 130);

    camera = new THREE.PerspectiveCamera(75, getAspect(), 0.1, 500);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 1, 0);

    ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);

    sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(40, 60, 20);
    scene.add(sun);

    sunMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 10), MAT.sunM);
    scene.add(sunMesh);
    moonMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 12, 10), MAT.moonM);
    scene.add(moonMesh);
    moonMesh.visible = false;
}

function getAspect() {
    const r = wrap.getBoundingClientRect();
    return Math.max(0.5, r.width / Math.max(1, r.height));
}

function resizeRenderer() {
    const r = wrap.getBoundingClientRect();
    const w = Math.max(2, Math.floor(r.width));
    const h = Math.max(2, Math.floor(r.height));
    renderer.setSize(w, h, false);
    if (camera) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
}

function buildWorld() {
    worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(WORLD_HALF * 2, WORLD_HALF * 2, 16, 16);
    // Color variation via vertex colors
    const colors = [];
    const baseColor = new THREE.Color(0x4f8a3a);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const c = baseColor.clone();
        const v = 0.85 + Math.random() * 0.3;
        c.r *= v; c.g *= v; c.b *= v;
        colors.push(c.r, c.g, c.b);
    }
    groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true });
    groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0;
    worldGroup.add(groundMesh);

    // Sand ring around lake
    const sandGeo = new THREE.RingGeometry(LAKE_R, LAKE_R + 3, 32);
    sandMesh = new THREE.Mesh(sandGeo, MAT.sand);
    sandMesh.rotation.x = -Math.PI / 2;
    sandMesh.position.set(LAKE_X, 0.02, LAKE_Z);
    worldGroup.add(sandMesh);

    // Lake
    const lakeGeo = new THREE.CircleGeometry(LAKE_R, 32);
    lakeMesh = new THREE.Mesh(lakeGeo, MAT.lake);
    lakeMesh.rotation.x = -Math.PI / 2;
    lakeMesh.position.set(LAKE_X, 0.04, LAKE_Z);
    worldGroup.add(lakeMesh);

    // Trees
    for (let i = 0; i < 70; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnTree(p.x, p.z);
    }
    // Stones
    for (let i = 0; i < 25; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnStone(p.x, p.z);
    }
    // Bushes
    for (let i = 0; i < 14; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnBush(p.x, p.z);
    }
    // Bones
    for (let i = 0; i < 6; i++) {
        const p = randomLandPoint();
        if (!p) continue;
        spawnBoneItem(p.x, p.z);
    }
}

function inLake(x, z) {
    const dx = x - LAKE_X, dz = z - LAKE_Z;
    return (dx * dx + dz * dz) < (LAKE_R + 1.5) * (LAKE_R + 1.5);
}
function randomLandPoint() {
    for (let t = 0; t < 30; t++) {
        const x = (Math.random() * 2 - 1) * (WORLD_HALF - 6);
        const z = (Math.random() * 2 - 1) * (WORLD_HALF - 6);
        if (inLake(x, z)) continue;
        if (Math.hypot(x, z) < 6) continue; // keep spawn area clear
        return { x, z };
    }
    return null;
}

function spawnTree(x, z) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(GEO.trunk, MAT.trunk);
    trunk.position.y = 1.2;
    g.add(trunk);
    const useCone = Math.random() < 0.7;
    const canopy = new THREE.Mesh(useCone ? GEO.canopy : GEO.canopy2, useCone ? MAT.canopy : MAT.canopy2);
    canopy.position.y = useCone ? 3.4 : 3.0;
    g.add(canopy);
    g.position.set(x, 0, z);
    worldGroup.add(g);
    trees.push({ mesh: g, x, z, hp: 3, falling: false, fallT: 0, alive: true });
}

function spawnStone(x, z) {
    const m = new THREE.Mesh(GEO.stone, MAT.stone);
    m.position.set(x, 0.45, z);
    m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    const s = 0.7 + Math.random() * 0.7;
    m.scale.set(s, s * 0.8, s);
    worldGroup.add(m);
    stones.push({ mesh: m, x, z, hp: 3, alive: true });
}

function spawnBush(x, z) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(GEO.bush, MAT.bush);
    b.position.y = 0.45;
    g.add(b);
    const berries = [];
    for (let i = 0; i < 5; i++) {
        const br = new THREE.Mesh(GEO.berry, MAT.berry);
        const a = (i / 5) * Math.PI * 2;
        br.position.set(Math.cos(a) * 0.45, 0.55 + Math.random() * 0.2, Math.sin(a) * 0.45);
        g.add(br);
        berries.push(br);
    }
    g.position.set(x, 0, z);
    worldGroup.add(g);
    bushes.push({ mesh: g, x, z, ripe: true, regrow: 0, berries });
}

function spawnBoneItem(x, z) {
    const m = new THREE.Mesh(GEO.boneG, MAT.bone);
    m.position.set(x, 0.2, z);
    m.rotation.y = Math.random() * Math.PI;
    worldGroup.add(m);
    boneItems.push({ mesh: m, x, z });
}

function buildHumanoid(charKey, scale, withAxe) {
    const ch = CHARS[charKey] || CHARS.dox;
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: ch.body });
    const headMat = new THREE.MeshLambertMaterial({ color: ch.head });
    const pantsMat = new THREE.MeshLambertMaterial({ color: ch.pants });

    const body = new THREE.Mesh(GEO.bodyG, bodyMat);
    body.position.y = 1.05;
    g.add(body);

    const head = new THREE.Mesh(GEO.headG, headMat);
    head.position.y = 1.95;
    g.add(head);

    // Hair cap
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x3a2818 }));
    hair.position.y = 1.97;
    g.add(hair);

    // Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const eL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 5), eyeMat);
    const eR = eL.clone();
    eL.position.set(-0.1, 1.97, 0.3);
    eR.position.set( 0.1, 1.97, 0.3);
    g.add(eL); g.add(eR);

    // Arms
    const armL = new THREE.Mesh(GEO.armG, bodyMat);
    armL.position.set(-0.5, 1.15, 0);
    g.add(armL);
    const armR = new THREE.Mesh(GEO.armG, bodyMat);
    armR.position.set( 0.5, 1.15, 0);
    g.add(armR);

    // Legs
    const legL = new THREE.Mesh(GEO.legG, pantsMat);
    legL.position.set(-0.18, 0.35, 0);
    g.add(legL);
    const legR = new THREE.Mesh(GEO.legG, pantsMat);
    legR.position.set( 0.18, 0.35, 0);
    g.add(legR);

    // Axe (in right hand)
    let axeGroup = null;
    if (withAxe) {
        axeGroup = new THREE.Group();
        const handle = new THREE.Mesh(GEO.axeHandle, MAT.axeH);
        handle.position.y = -0.25;
        axeGroup.add(handle);
        const head2 = new THREE.Mesh(GEO.axeHead, MAT.axeM);
        head2.position.y = -0.45;
        axeGroup.add(head2);
        axeGroup.position.set(0.6, 1.2, 0.2);
        g.add(axeGroup);
    }

    g.userData = { body, head, armL, armR, legL, legR, axe: axeGroup };
    if (scale && scale !== 1) g.scale.set(scale, scale, scale);
    return g;
}

function buildDogMesh() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(GEO.dogBody, MAT.dog);
    body.rotation.z = Math.PI / 2;
    body.position.y = 0.5;
    g.add(body);
    const head = new THREE.Mesh(GEO.dogHead, MAT.dogHead);
    head.position.set(0, 0.7, 0.55);
    g.add(head);
    // ears
    const ear = new THREE.ConeGeometry(0.08, 0.16, 5);
    const earMat = MAT.dogHead;
    const eL = new THREE.Mesh(ear, earMat); eL.position.set(-0.12, 0.85, 0.5);
    const eR = new THREE.Mesh(ear, earMat); eR.position.set( 0.12, 0.85, 0.5);
    g.add(eL); g.add(eR);
    // eyes
    const eye = new THREE.SphereGeometry(0.04, 6, 5);
    const em = new THREE.MeshBasicMaterial({ color: 0x111 });
    const ey1 = new THREE.Mesh(eye, em); ey1.position.set(-0.08, 0.74, 0.74);
    const ey2 = new THREE.Mesh(eye, em); ey2.position.set( 0.08, 0.74, 0.74);
    g.add(ey1); g.add(ey2);
    // legs
    const legs = [];
    const legOffsets = [[-0.18, 0.55], [0.18, 0.55], [-0.18, -0.25], [0.18, -0.25]];
    for (const [lx, lz] of legOffsets) {
        const l = new THREE.Mesh(GEO.dogLeg, MAT.dog);
        l.position.set(lx, 0.18, lz);
        g.add(l); legs.push(l);
    }
    // tail
    const tail = new THREE.Mesh(GEO.dogTail, MAT.dog);
    tail.position.set(0, 0.55, -0.5);
    g.add(tail);
    // heart marker (for ally)
    const heartGeo = new THREE.SphereGeometry(0.15, 8, 6);
    const heartMat = new THREE.MeshBasicMaterial({ color: 0xff5577 });
    const heart = new THREE.Mesh(heartGeo, heartMat);
    heart.position.set(0, 1.4, 0);
    heart.visible = false;
    g.add(heart);
    g.userData = { legs, tail, heart };
    return g;
}

function buildEnemyMesh(type) {
    const g = new THREE.Group();
    let mat = MAT.zombie, bodyH = 0.7, height = 1.6;
    if (type === 'wolf') { mat = MAT.wolf; bodyH = 0.5; height = 1.2; }
    else if (type === 'bear') { mat = MAT.bear; bodyH = 0.9; height = 2.0; }
    else if (type === 'zombie') { mat = MAT.zombie; bodyH = 0.8; height = 1.8; }

    if (type === 'wolf') {
        // quadruped
        const body = new THREE.Mesh(GEO.dogBody, mat);
        body.rotation.z = Math.PI / 2;
        body.scale.set(1.3, 1.3, 1.3);
        body.position.y = 0.7;
        g.add(body);
        const head = new THREE.Mesh(GEO.dogHead, mat);
        head.scale.set(1.3, 1.3, 1.3);
        head.position.set(0, 0.95, 0.75);
        g.add(head);
        // glowing eyes
        const eye = new THREE.SphereGeometry(0.06, 6, 5);
        const em = new THREE.MeshBasicMaterial({ color: 0xff2222 });
        const ey1 = new THREE.Mesh(eye, em); ey1.position.set(-0.1, 1.0, 0.95);
        const ey2 = new THREE.Mesh(eye, em); ey2.position.set( 0.1, 1.0, 0.95);
        g.add(ey1); g.add(ey2);
        const legOffsets = [[-0.22, 0.55], [0.22, 0.55], [-0.22, -0.3], [0.22, -0.3]];
        for (const [lx, lz] of legOffsets) {
            const l = new THREE.Mesh(GEO.dogLeg, mat);
            l.position.set(lx, 0.22, lz);
            l.scale.set(1.3, 1.3, 1.3);
            g.add(l);
        }
    } else {
        // bipedal
        const body = new THREE.Mesh(GEO.bodyG, mat);
        const s = type === 'bear' ? 1.45 : 1.0;
        body.scale.set(s, s, s);
        body.position.y = 1.05 * s;
        g.add(body);
        const head = new THREE.Mesh(GEO.headG, mat);
        head.scale.set(s, s, s);
        head.position.y = 1.95 * s;
        g.add(head);
        const eye = new THREE.SphereGeometry(0.05, 6, 5);
        const em = new THREE.MeshBasicMaterial({ color: type === 'zombie' ? 0xffff66 : 0xff3322 });
        const ey1 = new THREE.Mesh(eye, em); ey1.position.set(-0.1 * s, 1.95 * s, 0.3 * s);
        const ey2 = new THREE.Mesh(eye, em); ey2.position.set( 0.1 * s, 1.95 * s, 0.3 * s);
        g.add(ey1); g.add(ey2);
        // arms / legs
        const armL = new THREE.Mesh(GEO.armG, mat); armL.position.set(-0.5 * s, 1.15 * s, 0); armL.scale.set(s, s, s); g.add(armL);
        const armR = new THREE.Mesh(GEO.armG, mat); armR.position.set( 0.5 * s, 1.15 * s, 0); armR.scale.set(s, s, s); g.add(armR);
        const legL = new THREE.Mesh(GEO.legG, mat); legL.position.set(-0.18 * s, 0.35 * s, 0); legL.scale.set(s, s, s); g.add(legL);
        const legR = new THREE.Mesh(GEO.legG, mat); legR.position.set( 0.18 * s, 0.35 * s, 0); legR.scale.set(s, s, s); g.add(legR);
    }
    return g;
}

const ENEMY_TYPES = {
    wolf:   { hp: 30, dmg: 10, speed: 4.8, scoreVal: 8,  range: 1.5 },
    bear:   { hp: 80, dmg: 25, speed: 2.4, scoreVal: 18, range: 1.8 },
    zombie: { hp: 50, dmg: 15, speed: 3.2, scoreVal: 12, range: 1.6 },
};

function spawnEnemy(type) {
    const m = buildEnemyMesh(type);
    // Spawn at random edge
    const side = Math.floor(Math.random() * 4);
    let x = 0, z = 0;
    if (side === 0) { x = -WORLD_HALF + 4; z = (Math.random() * 2 - 1) * (WORLD_HALF - 4); }
    else if (side === 1) { x =  WORLD_HALF - 4; z = (Math.random() * 2 - 1) * (WORLD_HALF - 4); }
    else if (side === 2) { z = -WORLD_HALF + 4; x = (Math.random() * 2 - 1) * (WORLD_HALF - 4); }
    else                 { z =  WORLD_HALF - 4; x = (Math.random() * 2 - 1) * (WORLD_HALF - 4); }
    m.position.set(x, 0, z);
    scene.add(m);
    const t = ENEMY_TYPES[type];
    const hp = Math.round(t.hp * currentLevel.enemyHpMul);
    enemies.push({ mesh: m, type, x, z, yaw: 0, hp, maxHp: hp, atkCool: 0, hitFlash: 0, swingT: 0 });
}

// ================== Particles ==================
function spawnParticles(x, y, z, color, n) {
    n = n || 8;
    const mat = new THREE.MeshBasicMaterial({ color });
    for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(GEO.particle, mat);
        m.position.set(x, y, z);
        scene.add(m);
        const ang = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 4;
        particles.push({
            mesh: m,
            vx: Math.cos(ang) * sp,
            vy: 2 + Math.random() * 3,
            vz: Math.sin(ang) * sp,
            life: 0.7,
            maxLife: 0.7,
        });
    }
}

// ================== Camera follow ==================
function updateCamera(dt) {
    if (!player) return;
    const px = player.mesh.position.x;
    const py = player.mesh.position.y;
    const pz = player.mesh.position.z;

    // Camera offset from yaw + pitch
    const cosP = Math.cos(camPitch);
    const sinP = Math.sin(camPitch);
    const ox = -Math.sin(camYaw) * CAM_DIST * cosP;
    const oz = -Math.cos(camYaw) * CAM_DIST * cosP;
    const oy = CAM_DIST * sinP + 1.2;

    camTarget.set(px + ox, py + oy, pz + oz);
    camPos.lerp(camTarget, Math.min(1, dt * 8));
    camera.position.copy(camPos);
    camera.lookAt(px, py + 1.5, pz);
}

// ================== Day/night ==================
function updateDayNight(dt) {
    dayTime += dt;
    const phase = dayTime % FULL_CYCLE;
    const wasNight = isNight;
    isNight = phase >= DAY_LEN;

    if (isNight !== wasNight) {
        if (isNight) {
            nightCount++;
            showNightBanner('🌙 לילה ' + nightCount + '!');
            MUSIC_NOTES = MUSIC_NOTES_NIGHT;
            BASS_NOTES  = BASS_NOTES_NIGHT;
            playNight();
            spawnNightEnemies();
        } else {
            showNightBanner('☀️ יום ' + (nightCount + 1));
            MUSIC_NOTES = MUSIC_NOTES_DAY;
            BASS_NOTES  = BASS_NOTES_DAY;
            playDay();
            // Clear remaining enemies on daybreak
            for (const e of enemies) {
                scene.remove(e.mesh);
            }
            enemies = [];
        }
    }

    // Day progress 0..1
    let t01;
    if (!isNight) {
        t01 = phase / DAY_LEN; // 0..1 day arc
    } else {
        t01 = 1 + (phase - DAY_LEN) / NIGHT_LEN; // 1..2 night
    }

    // Sun arc: rises east, sets west
    const dayProg = !isNight ? t01 : 0;
    const nightProg = isNight ? (t01 - 1) : 0;

    // Sun position (visible during day)
    const sunAng = !isNight ? (t01 * Math.PI) : Math.PI;
    sun.position.set(Math.cos(sunAng) * 60, Math.sin(sunAng) * 50 + 10, 20);
    sunMesh.position.copy(sun.position).multiplyScalar(1.5);
    sunMesh.visible = !isNight;

    // Moon
    moonMesh.visible = isNight;
    if (isNight) {
        const mAng = nightProg * Math.PI;
        moonMesh.position.set(Math.cos(mAng) * 60, Math.sin(mAng) * 50 + 8, -20);
    }

    // Sun intensity & color
    if (!isNight) {
        sun.intensity = 0.55 + Math.sin(t01 * Math.PI) * 0.6;
        ambient.intensity = 0.45 + Math.sin(t01 * Math.PI) * 0.25;
    } else {
        sun.intensity = 0.05;
        ambient.intensity = 0.18;
    }

    // Sky color
    let skyColor;
    if (!isNight) {
        // 0 sunrise pink, 0.5 daylight blue, 1 sunset orange
        if (t01 < 0.15) {
            skyColor = lerpColor(0xffc7d8, 0x88c8ff, t01 / 0.15);
        } else if (t01 < 0.85) {
            skyColor = 0x88c8ff;
        } else {
            skyColor = lerpColor(0x88c8ff, 0xffa44a, (t01 - 0.85) / 0.15);
        }
    } else {
        if (nightProg < 0.15) {
            skyColor = lerpColor(0xffa44a, 0x14143a, nightProg / 0.15);
        } else if (nightProg < 0.85) {
            skyColor = 0x14143a;
        } else {
            skyColor = lerpColor(0x14143a, 0xffc7d8, (nightProg - 0.85) / 0.15);
        }
    }
    scene.background.setHex(skyColor);
    scene.fog.color.setHex(skyColor);
    if (isNight) {
        scene.fog.near = 8;
        scene.fog.far = 60;
    } else {
        scene.fog.near = 30;
        scene.fog.far = 130;
    }

    // UI
    todEl.textContent = isNight ? ('🌙 לילה ' + nightCount) : '☀️ יום';
}

function lerpColor(a, b, t) {
    const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
    const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return (r << 16) | (g << 8) | bl;
}

function showNightBanner(text) {
    nightBannerEl.textContent = text;
    nightBannerEl.classList.add('show');
    setTimeout(() => nightBannerEl.classList.remove('show'), 2000);
}

function spawnNightEnemies() {
    const want = currentLevel.enemyCount;
    for (let i = 0; i < want; i++) {
        const r = Math.random();
        let type;
        if (currentLevel.num >= 3 && r < 0.2) type = 'bear';
        else if (r < 0.5) type = 'wolf';
        else type = 'zombie';
        spawnEnemy(type);
    }
}

// ================== Input ==================
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ') { e.preventDefault(); doSwing(); }
    if (e.key.toLowerCase() === 'b') toggleBuild();
    if (e.key.toLowerCase() === 'e') tryInteract();
    if (e.key.toLowerCase() === 'g') tryGiveBone();
    if (e.key === 'Escape' && buildMode) toggleBuild();
    if (e.key >= '1' && e.key <= '4' && buildMode) {
        buildIndex = parseInt(e.key, 10) - 1;
        updateBuildBarUi();
    }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousedown', e => {
    if (!running) return;
    if (e.button === 0) {
        if (buildMode) tryPlaceBuilding();
        else doSwing();
    }
    mouseDown = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
window.addEventListener('mousemove', e => {
    if (!running) return;
    if (mouseDown) {
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        camYaw   -= dx * 0.006;
        camPitch += dy * 0.004;
        camPitch = Math.max(0.05, Math.min(1.1, camPitch));
    }
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

// Right click handling — disable context menu
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Touch controls — virtual joystick + camera drag on right half
const joystickEl = document.getElementById('joystick');
const joyKnobEl  = document.getElementById('joy-knob');

function joyHandle(touch, type) {
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const max = rect.width / 2 - 8;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joyKnobEl.style.left = (rect.width / 2 + dx) + 'px';
    joyKnobEl.style.top  = (rect.height / 2 + dy) + 'px';
    joyKnobEl.style.transform = 'translate(-50%, -50%)';
    joyDX = dx / max;
    joyDY = dy / max;
}
function joyReset() {
    joyActive = false; joyTouchId = null;
    joyDX = 0; joyDY = 0;
    joyKnobEl.style.left = '50%';
    joyKnobEl.style.top  = '50%';
    joyKnobEl.style.transform = 'translate(-50%, -50%)';
}

joystickEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joyTouchId === null) {
        const t = e.changedTouches[0];
        joyTouchId = t.identifier;
        joyActive = true;
        joyHandle(t);
    }
}, { passive: false });
joystickEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joyTouchId) { joyHandle(t); break; }
    }
}, { passive: false });
function joyEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) { joyReset(); break; }
    }
}
joystickEl.addEventListener('touchend', joyEnd);
joystickEl.addEventListener('touchcancel', joyEnd);

// Camera drag on canvas (right side) — but exclude touches on joystick / buttons
canvas.addEventListener('touchstart', e => {
    if (!running) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const rect = canvas.getBoundingClientRect();
        const lx = t.clientX - rect.left;
        if (lx > rect.width / 2 && camTouchId === null) {
            camTouchId = t.identifier;
            camLastTX = t.clientX;
            camLastTY = t.clientY;
            camDragActive = true;
            return;
        }
    }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    if (camTouchId === null) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === camTouchId) {
            const dx = t.clientX - camLastTX;
            const dy = t.clientY - camLastTY;
            camYaw   -= dx * 0.008;
            camPitch += dy * 0.006;
            camPitch = Math.max(0.05, Math.min(1.1, camPitch));
            camLastTX = t.clientX; camLastTY = t.clientY;
        }
    }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === camTouchId) {
            camTouchId = null; camDragActive = false;
        }
    }
});

// Touch buttons
const btnAttack = document.getElementById('btn-attack');
const btnAction = document.getElementById('btn-action');
const btnBuild  = document.getElementById('btn-build');
btnAttack.addEventListener('touchstart', e => { e.preventDefault(); if (running) doSwing(); }, { passive: false });
btnAction.addEventListener('touchstart', e => { e.preventDefault(); if (running) { tryInteract(); tryGiveBone(); if (buildMode) tryPlaceBuilding(); } }, { passive: false });

// ================== Build mode ==================
function toggleBuild() {
    buildMode = !buildMode;
    if (buildMode) {
        buildBarEl.style.display = 'flex';
        updateBuildBarUi();
        spawnBuildGhost();
        document.body.classList.add('has-build-ghost');
    } else {
        buildBarEl.style.display = 'none';
        if (buildGhostMesh) { scene.remove(buildGhostMesh); buildGhostMesh = null; }
        document.body.classList.remove('has-build-ghost');
    }
}

function updateBuildBarUi() {
    buildBarEl.innerHTML = BUILDS.map((b, i) =>
        `<div class="build-btn${i === buildIndex ? ' active' : ''}" data-i="${i}">
            <span class="be">${b.icon}</span>${b.name}<br>${b.wood ? '🪵' + b.wood : ''}${b.stone ? '🪨' + b.stone : ''}
        </div>`
    ).join('');
    buildBarEl.querySelectorAll('.build-btn').forEach(el => {
        el.addEventListener('click', () => {
            buildIndex = parseInt(el.dataset.i, 10);
            updateBuildBarUi();
            spawnBuildGhost();
        });
        el.addEventListener('touchstart', e => {
            e.preventDefault();
            buildIndex = parseInt(el.dataset.i, 10);
            updateBuildBarUi();
            spawnBuildGhost();
        }, { passive: false });
    });
}

function spawnBuildGhost() {
    if (buildGhostMesh) { scene.remove(buildGhostMesh); buildGhostMesh = null; }
    const b = BUILDS[buildIndex];
    const g = new THREE.BoxGeometry(b.w, b.h, b.d);
    buildGhostMesh = new THREE.Mesh(g, MAT.ghost);
    scene.add(buildGhostMesh);
}

function getBuildTarget() {
    // Ghost position: ~3 units in front of player along camera-forward (horizontal)
    const fx = Math.sin(camYaw);
    const fz = Math.cos(camYaw);
    const x = player.x + fx * 3.5;
    const z = player.z + fz * 3.5;
    return { x, z, yaw: camYaw };
}

function updateBuildGhost() {
    if (!buildGhostMesh) return;
    const b = BUILDS[buildIndex];
    const t = getBuildTarget();
    buildGhostMesh.position.set(t.x, b.h / 2, t.z);
    buildGhostMesh.rotation.y = t.yaw;
}

function tryPlaceBuilding() {
    const b = BUILDS[buildIndex];
    if (player.wood < b.wood || player.stone < b.stone) {
        popupText('אין מספיק חומרים', 0xff5555);
        return;
    }
    const t = getBuildTarget();
    if (inLake(t.x, t.z)) return;
    player.wood  -= b.wood;
    player.stone -= b.stone;
    const g = new THREE.BoxGeometry(b.w, b.h, b.d);
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: b.color }));
    m.position.set(t.x, b.h / 2, t.z);
    m.rotation.y = t.yaw;
    scene.add(m);
    buildings.push({ mesh: m, x: t.x, z: t.z, type: b.key, hp: 100 });
    playBuild();
    updateHud();
}

// ================== Interactions ==================
function tryInteract() {
    if (!player) return;
    // Berries pickup
    for (const bush of bushes) {
        if (!bush.ripe) continue;
        if (Math.hypot(player.x - bush.x, player.z - bush.z) < 1.6) {
            bush.ripe = false;
            bush.regrow = 20;
            for (const br of bush.berries) br.visible = false;
            player.hunger = Math.min(player.hungerMax, player.hunger + 20);
            score += 1;
            playBerry();
            updateHud();
            return;
        }
    }
    // Bone pickup
    for (let i = boneItems.length - 1; i >= 0; i--) {
        const b = boneItems[i];
        if (Math.hypot(player.x - b.x, player.z - b.z) < 1.4) {
            scene.remove(b.mesh);
            boneItems.splice(i, 1);
            player.bones += 1;
            playBonePick();
            updateHud();
            return;
        }
    }
}

function tryGiveBone() {
    if (!dog || dog.state === 'ally') return;
    if (player.bones < 1) return;
    if (Math.hypot(player.x - dog.x, player.z - dog.z) > 2.0) return;
    player.bones -= 1;
    dog.state = 'ally';
    dog.mesh.userData.heart.visible = true;
    playBark();
    updateHud();
}

function doSwing() {
    if (!player) return;
    if (player.swingT > 0) return;
    player.swingT = 0.3;
    playSwing();

    // Find chop target in front
    const fx = Math.sin(player.yaw);
    const fz = Math.cos(player.yaw);
    const range = 2.4;

    // Trees
    for (const tr of trees) {
        if (!tr.alive || tr.falling) continue;
        const dx = tr.x - player.x, dz = tr.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.2) {
                tr.hp -= 1;
                playChop();
                spawnParticles(tr.x, 1.2, tr.z, 0x8b5a2b, 6);
                if (tr.hp <= 0) {
                    tr.falling = true;
                    tr.fallT = 0;
                    const wd = 2 + Math.floor(Math.random() * 3);
                    player.wood += wd;
                    score += 2;
                    updateHud();
                }
                return;
            }
        }
    }
    // Stones
    for (const st of stones) {
        if (!st.alive) continue;
        const dx = st.x - player.x, dz = st.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.2) {
                st.hp -= 1;
                playMine();
                spawnParticles(st.x, 0.6, st.z, 0x888888, 6);
                if (st.hp <= 0) {
                    st.alive = false;
                    scene.remove(st.mesh);
                    player.stone += 2;
                    score += 1;
                    updateHud();
                }
                return;
            }
        }
    }
    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = e.x - player.x, dz = e.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range + 0.4) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.0) {
                e.hp -= 18;
                e.hitFlash = 0.18;
                playHit();
                spawnParticles(e.x, 1.2, e.z, 0xff3333, 6);
                if (e.hp <= 0) {
                    scene.remove(e.mesh);
                    enemies.splice(i, 1);
                    const t = ENEMY_TYPES[e.type];
                    score += t.scoreVal;
                    if (Math.random() < 0.4) {
                        // drop bone
                        spawnBoneItem(e.x, e.z);
                    }
                    if (Math.random() < 0.3) {
                        player.wood += 1;
                    }
                    const lvl = getLevelFor(score);
                    if (lvl.num !== currentLevel.num) {
                        currentLevel = lvl;
                        playLevelUp();
                        showNightBanner(lvl.name);
                    }
                    updateHud();
                }
                return;
            }
        }
    }
    // Dog hit by accident
    if (dog && dog.state !== 'ally') {
        const dx = dog.x - player.x, dz = dog.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < range) {
            const fwd = (dx * fx + dz * fz) / Math.max(0.001, dist);
            if (fwd > 0.2) {
                dog.state = 'hostile';
                playGrowl();
            }
        }
    }
}

// ================== Update / movement ==================
function updatePlayer(dt) {
    if (!player || !player.alive) return;

    let mx = 0, mz = 0;
    if (IS_TOUCH && (Math.abs(joyDX) > 0.05 || Math.abs(joyDY) > 0.05)) {
        mx = joyDX;
        mz = joyDY;
    } else {
        if (keys['w'] || keys['arrowup'])    mz -= 1;
        if (keys['s'] || keys['arrowdown'])  mz += 1;
        if (keys['a'] || keys['arrowleft'])  mx -= 1;
        if (keys['d'] || keys['arrowright']) mx += 1;
    }

    const len = Math.hypot(mx, mz);
    player.walking = len > 0.05;
    if (player.walking) {
        mx /= len; mz /= len;
        // Convert to world space relative to camera yaw:
        // forward = -mz (W) in camera-yaw direction, strafe = +mx
        const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
        // forward axis (camera looks toward +Z from camera->player, so player forward = -sin(yaw),-cos(yaw))
        const fwdX = Math.sin(camYaw);
        const fwdZ = Math.cos(camYaw);
        const rightX = Math.cos(camYaw);
        const rightZ = -Math.sin(camYaw);

        const wx = fwdX * (-mz) + rightX * mx;
        const wz = fwdZ * (-mz) + rightZ * mx;
        const speed = 5.0;
        let nx = player.x + wx * speed * dt;
        let nz = player.z + wz * speed * dt;

        // Clamp to world
        nx = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, nx));
        nz = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, nz));
        // Avoid lake
        if (!inLake(nx, nz)) { player.x = nx; player.z = nz; }

        // Face movement direction
        player.yaw = Math.atan2(wx, wz);
        player.walkPhase += dt * 9;
    } else {
        player.walkPhase *= 0.9;
    }

    player.mesh.position.set(player.x, 0, player.z);
    player.mesh.rotation.y = player.yaw;

    // Animate legs / arms (walk bob)
    const ud = player.mesh.userData;
    if (player.walking) {
        const s = Math.sin(player.walkPhase) * 0.5;
        ud.legL.rotation.x =  s;
        ud.legR.rotation.x = -s;
        ud.armL.rotation.x = -s * 0.7;
        ud.armR.rotation.x =  s * 0.7;
        player.mesh.position.y = Math.abs(Math.sin(player.walkPhase * 0.5)) * 0.06;
    } else {
        ud.legL.rotation.x *= 0.8;
        ud.legR.rotation.x *= 0.8;
        ud.armL.rotation.x *= 0.8;
        ud.armR.rotation.x *= 0.8;
        player.mesh.position.y *= 0.85;
    }

    // Swing axe animation
    if (player.swingT > 0) {
        player.swingT -= dt;
        const k = 1 - (player.swingT / 0.3);
        if (ud.axe) ud.axe.rotation.x = -Math.sin(k * Math.PI) * 1.6;
    } else if (ud.axe) {
        ud.axe.rotation.x *= 0.6;
    }

    // Hunger & HP tick
    player.hunger -= dt * 1.2;
    if (player.hunger < 0) {
        player.hunger = 0;
        player.hp -= dt * 4;
    }
    // Slow regen if fed
    if (player.hunger > 60 && player.hp < player.hpMax) player.hp = Math.min(player.hpMax, player.hp + dt * 1.5);

    if (player.hp <= 0) {
        player.hp = 0;
        player.alive = false;
        gameOver();
        return;
    }

    updateHud();
}

function updateTrees(dt) {
    treeRespawnTimer -= dt;
    for (let i = trees.length - 1; i >= 0; i--) {
        const tr = trees[i];
        if (tr.falling) {
            tr.fallT += dt;
            const k = Math.min(1, tr.fallT / 1.0);
            tr.mesh.rotation.x = k * (Math.PI / 2);
            tr.mesh.position.y = -k * 0.3;
            if (tr.fallT > 1.4) {
                scene.remove(tr.mesh);
                trees.splice(i, 1);
            }
        }
    }
    if (treeRespawnTimer <= 0) {
        treeRespawnTimer = 30;
        if (trees.length < 70) {
            const p = randomLandPoint();
            if (p) spawnTree(p.x, p.z);
        }
    }
}

function updateBushes(dt) {
    for (const bush of bushes) {
        if (!bush.ripe) {
            bush.regrow -= dt;
            if (bush.regrow <= 0) {
                bush.ripe = true;
                for (const br of bush.berries) br.visible = true;
            }
        }
    }
}

function updateBones(dt) {
    boneRespawnTimer -= dt;
    if (boneRespawnTimer <= 0) {
        boneRespawnTimer = 25;
        if (boneItems.length < 10) {
            const p = randomLandPoint();
            if (p) spawnBoneItem(p.x, p.z);
        }
    }
}

function updateDog(dt) {
    if (!dog || !player) return;
    const dx = player.x - dog.x, dz = player.z - dog.z;
    const distToPlayer = Math.hypot(dx, dz);

    if (dog.state === 'friendly') {
        // Wander near player
        dog.wanderT -= dt;
        if (dog.wanderT <= 0 || Math.hypot(dog.wanderTX - dog.x, dog.wanderTZ - dog.z) < 0.5) {
            dog.wanderT = 3 + Math.random() * 3;
            dog.wanderTX = player.x + (Math.random() * 2 - 1) * 8;
            dog.wanderTZ = player.z + (Math.random() * 2 - 1) * 8;
        }
        const tx = dog.wanderTX - dog.x;
        const tz = dog.wanderTZ - dog.z;
        const tl = Math.hypot(tx, tz);
        if (tl > 0.1) {
            const speed = 2.0;
            dog.x += (tx / tl) * speed * dt;
            dog.z += (tz / tl) * speed * dt;
            dog.yaw = Math.atan2(tx, tz);
        }
    } else if (dog.state === 'hostile') {
        // Chase & bite player
        if (distToPlayer > 0.5) {
            const speed = 4.0;
            dog.x += (dx / distToPlayer) * speed * dt;
            dog.z += (dz / distToPlayer) * speed * dt;
            dog.yaw = Math.atan2(dx, dz);
        }
        dog.atkCool -= dt;
        if (distToPlayer < 1.4 && dog.atkCool <= 0) {
            dog.atkCool = 1.0;
            player.hp -= 5;
            playBark();
            spawnParticles(player.x, 1.2, player.z, 0xff5555, 5);
        }
    } else if (dog.state === 'ally') {
        // Follow player; attack nearby enemies
        let targetX = null, targetZ = null, targetE = null;
        let bestD = 8;
        for (const e of enemies) {
            const d = Math.hypot(e.x - dog.x, e.z - dog.z);
            if (d < bestD) { bestD = d; targetX = e.x; targetZ = e.z; targetE = e; }
        }
        if (targetE) {
            const tx = targetX - dog.x, tz = targetZ - dog.z;
            const tl = Math.hypot(tx, tz);
            if (tl > 0.8) {
                const speed = 5.0;
                dog.x += (tx / tl) * speed * dt;
                dog.z += (tz / tl) * speed * dt;
                dog.yaw = Math.atan2(tx, tz);
            } else {
                dog.atkCool -= dt;
                if (dog.atkCool <= 0) {
                    dog.atkCool = 0.6;
                    targetE.hp -= 12;
                    targetE.hitFlash = 0.15;
                    playBark();
                    if (targetE.hp <= 0) {
                        scene.remove(targetE.mesh);
                        const idx = enemies.indexOf(targetE);
                        if (idx >= 0) enemies.splice(idx, 1);
                        score += 3;
                        updateHud();
                    }
                }
            }
        } else {
            // Follow player
            if (distToPlayer > 3) {
                const speed = 3.5;
                dog.x += (dx / distToPlayer) * speed * dt;
                dog.z += (dz / distToPlayer) * speed * dt;
                dog.yaw = Math.atan2(dx, dz);
            }
        }
        dog.mesh.userData.heart.visible = true;
        dog.mesh.userData.heart.position.y = 1.4 + Math.sin(performance.now() * 0.005) * 0.1;
    }

    dog.x = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, dog.x));
    dog.z = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, dog.z));
    if (inLake(dog.x, dog.z)) {
        // Push out
        const ax = dog.x - LAKE_X, az = dog.z - LAKE_Z;
        const an = Math.hypot(ax, az) || 1;
        dog.x = LAKE_X + (ax / an) * (LAKE_R + 1.5);
        dog.z = LAKE_Z + (az / an) * (LAKE_R + 1.5);
    }

    dog.mesh.position.set(dog.x, 0, dog.z);
    dog.mesh.rotation.y = dog.yaw;

    // Leg wiggle
    const legs = dog.mesh.userData.legs;
    const phase = performance.now() * 0.012;
    legs[0].rotation.x =  Math.sin(phase) * 0.4;
    legs[1].rotation.x = -Math.sin(phase) * 0.4;
    legs[2].rotation.x = -Math.sin(phase) * 0.4;
    legs[3].rotation.x =  Math.sin(phase) * 0.4;
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const t = ENEMY_TYPES[e.type];
        const dx = player.x - e.x, dz = player.z - e.z;
        const dist = Math.hypot(dx, dz);

        if (dist > t.range) {
            const speed = t.speed;
            e.x += (dx / Math.max(0.001, dist)) * speed * dt;
            e.z += (dz / Math.max(0.001, dist)) * speed * dt;
            e.yaw = Math.atan2(dx, dz);
        } else {
            e.atkCool -= dt;
            if (e.atkCool <= 0) {
                e.atkCool = 1.2;
                player.hp -= t.dmg;
                playHit();
                spawnParticles(player.x, 1.2, player.z, 0xff2222, 6);
            }
        }

        e.hitFlash -= dt;
        e.mesh.position.set(e.x, 0, e.z);
        e.mesh.rotation.y = e.yaw;

        // simple "bobbing" walk
        e.mesh.position.y = Math.abs(Math.sin(performance.now() * 0.01 + i)) * 0.08;
    }

    nightSpawnTimer -= dt;
    if (isNight && nightSpawnTimer <= 0 && enemies.length < currentLevel.enemyCount * 1.5) {
        nightSpawnTimer = 4;
        const r = Math.random();
        let type;
        if (currentLevel.num >= 3 && r < 0.2) type = 'bear';
        else if (r < 0.5) type = 'wolf';
        else type = 'zombie';
        spawnEnemy(type);
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
            continue;
        }
        p.vy -= 9.8 * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        const a = p.life / p.maxLife;
        p.mesh.scale.setScalar(0.5 + a);
    }
}

function popupText(msg, color) {
    // simple banner reuse
    showNightBanner(msg);
}

// ================== HUD ==================
function updateHud() {
    hpEl.textContent     = Math.round(player.hp);
    hungerEl.textContent = Math.round(player.hunger);
    woodEl.textContent   = player.wood;
    stoneEl.textContent  = player.stone;
    bonesEl.textContent  = player.bones;
    scoreEl.textContent  = score;
    const goal = nextLevelGoal(currentLevel);
    levelEl.textContent = goal !== null ? `${currentLevel.num} (${score}/${goal})` : `${currentLevel.num} 🔥`;
}

// ================== Cleanup ==================
function disposeWorld() {
    if (worldGroup) {
        scene.remove(worldGroup);
        worldGroup = null;
    }
    if (player) { scene.remove(player.mesh); player = null; }
    if (dog)    { scene.remove(dog.mesh);    dog = null; }
    for (const e of enemies) scene.remove(e.mesh);
    enemies = [];
    for (const p of particles) scene.remove(p.mesh);
    particles = [];
    for (const b of buildings) scene.remove(b.mesh);
    buildings = [];
    trees = []; stones = []; bushes = []; boneItems = [];
    if (buildGhostMesh) { scene.remove(buildGhostMesh); buildGhostMesh = null; }
}

// ================== Game loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    updatePlayer(dt);
    updateTrees(dt);
    updateBushes(dt);
    updateBones(dt);
    updateDog(dt);
    updateEnemies(dt);
    updateParticles(dt);
    if (buildMode) updateBuildGhost();
    updateDayNight(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
    rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    showCharSelect();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    disposeWorld();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    hpEl.textContent = '100';
    hungerEl.textContent = '100';
    woodEl.textContent = '0';
    stoneEl.textContent = '0';
    bonesEl.textContent = '0';
    scoreEl.textContent = '0';
    levelEl.textContent = '—';
    todEl.textContent = '☀️';
    buildBarEl.style.display = 'none';

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🌳 DOX VS NOX 3D</h2>' +
        '<p>שורד את הלילה! מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">המשך ➡️</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', e => { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showCharSelect() {
    overlay.innerHTML =
        '<h2>🦸 בחר דמות</h2>' +
        `<p>${currentPlayer} — מי אתה היום?</p>` +
        '<div class="char-grid">' +
            Object.entries(CHARS).map(([k, c]) =>
                `<button class="char-btn ${k}${k === currentCharKey ? ' selected' : ''}" data-key="${k}">
                    <span class="char-emoji">${c.emoji}</span>${c.name}
                </button>`
            ).join('') +
        '</div>' +
        '<div class="end-buttons">' +
            '<button id="btn-start" class="primary-btn">🌳 שחק!</button>' +
            '<button id="btn-back"  class="secondary-btn">↩️ חזרה</button>' +
        '</div>';
    overlay.style.display = 'flex';

    overlay.querySelectorAll('.char-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentCharKey = btn.dataset.key;
            overlay.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        });
    });
    document.getElementById('btn-start').addEventListener('click', start);
    document.getElementById('btn-back').addEventListener('click', showPlayerSelect);
}

function showGameOver() {
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = score === myBest && score > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === score && score > 0;
    const lvlReached = getLevelFor(score);

    let headline, msg;
    if (isKing && isNewRecord) {
        headline = '👑 שורד אגדי!';
        msg = `${currentPlayer} שרד ${nightCount} לילות עם ${score} נקודות (${lvlReached.name})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש!';
        msg = `${currentPlayer} צבר ${score} נקודות ב-${nightCount} לילות (${lvlReached.name})!`;
    } else if (score >= 60) {
        headline = '🏆 שורד אמיתי!';
        msg = `${currentPlayer} צבר ${score} נקודות (${lvlReached.name}). השיא: ${myBest}`;
    } else {
        headline = '🌳 ניסיון טוב!';
        msg = `${currentPlayer} צבר ${score} נקודות (${lvlReached.name}).<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    setTimeout(showGameOver, 600);
}

function start() {
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();

    // reset state
    disposeWorld();
    score = 0;
    currentLevel = LEVELS[0];
    dayTime = 0;
    isNight = false;
    nightCount = 0;
    buildMode = false;
    buildBarEl.style.display = 'none';
    document.body.classList.remove('has-build-ghost');
    MUSIC_NOTES = MUSIC_NOTES_DAY;
    BASS_NOTES  = BASS_NOTES_DAY;
    camYaw = 0; camPitch = 0.45;

    buildWorld();
    spawnPlayer();
    spawnDog();
    camPos.set(0, 5, 10);

    updateHud();

    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

// ================== Mute / resize ==================
document.getElementById('mute').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
});

window.addEventListener('resize', resizeRenderer);
if (window.ResizeObserver) {
    const ro = new ResizeObserver(resizeRenderer);
    ro.observe(wrap);
}

// ================== Boot ==================
initSharedAssets();
initThree();
showPlayerSelect();

// Initial render to show sky behind overlay
function bootRender() {
    renderer.render(scene, camera);
}
bootRender();
</script>
</body>
