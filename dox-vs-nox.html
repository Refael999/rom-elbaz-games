    { id: 'trap',    emoji: '🪤', name: 'מלכודת',      desc: 'פוגעת באויב שדורך עליה', wood: 3, stone: 1, food: 0 },
    { id: 'cooked',  emoji: '🍖', name: 'אוכל צלוי',   desc: 'משביע יותר מפירות', wood: 0, stone: 0, food: 2 },
];
let craftOpen = false;
function canCraft(r) {
    return player.wood >= r.wood && player.stone >= r.stone && player.food >= r.food;
}
function renderCraft() {
    if (!player) return;
    craftListEl.innerHTML = RECIPES.map(r => {
        const ok = canCraft(r);
        const cost = [];
        if (r.wood)  cost.push('🪵' + r.wood);
        if (r.stone) cost.push('🪨' + r.stone);
        if (r.food)  cost.push('🍓' + r.food);
        const locked = r.id === 'axe' && player.hasBetterAxe;
        return `<div class="craft-item${(!ok || locked) ? ' locked' : ''}">
            <span class="craft-emoji">${r.emoji}</span>
            <div class="craft-info">
                <div class="craft-name">${r.name}</div>
                <div class="craft-cost">${cost.join('  ')}</div>
                <div class="craft-desc">${locked ? 'כבר יש לך ✔️' : r.desc}</div>
            </div>
            <button class="craft-btn" data-r="${r.id}" ${(!ok || locked) ? 'disabled' : ''}>ייצר</button>
        </div>`;
    }).join('');
    craftListEl.querySelectorAll('.craft-btn').forEach(btn => {
        const handler = e => { e.preventDefault(); doCraft(btn.dataset.r); };
        btn.addEventListener('click', handler);
        btn.addEventListener('touchstart', handler, { passive: false });
    });
}
function doCraft(id) {
    const r = RECIPES.find(x => x.id === id);
    if (!r || !canCraft(r)) return;
    if (r.id === 'axe' && player.hasBetterAxe) return;
    player.wood -= r.wood; player.stone -= r.stone; player.food -= r.food;
    if (r.id === 'axe') {
        player.hasBetterAxe = true;
        showToast('🪓 גרזן משופר מוכן!');
    } else if (r.id === 'cooked') {
        player.cookedFood += 1;
        showToast('🍖 אוכל צלוי מוכן!');
    } else if (r.id === 'campfire') {
        placeCraftedBuild('campfire');
        showToast('🔥 מדורה נבנתה!');
    } else if (r.id === 'trap') {
        placeCraftedBuild('trap');
        showToast('🪤 מלכודת הונחה!');
    }
    playBuild();
    spawnParticles(player.x, 1.4, player.z, 0xffdd57, 10);
    renderCraft();
    renderInventory();
    updateHud();
}
function toggleCraft(force) {
    if (!running) return;
    craftOpen = (force != null) ? force : !craftOpen;
    if (craftOpen) {
        if (invOpen) toggleInventory(false);
        renderCraft();
        craftPanelEl.classList.add('show');
        tone(520, 0.06, 'sine', 0.08, 0);
    } else {
        craftPanelEl.classList.remove('show');
    }
}

// ================== Eat from inventory (auto when hungry) ==================
function tryEatFood() {
    if (!player) return false;
    if (player.cookedFood > 0 && player.hunger < player.hungerMax - 5) {
        player.cookedFood--; player.hunger = Math.min(player.hungerMax, player.hunger + 45);
        playEat(); updateHud(); return true;
    }
    if (player.food > 0 && player.hunger < player.hungerMax - 5) {
        player.food--; player.hunger = Math.min(player.hungerMax, player.hunger + 18);
        playEat(); updateHud(); return true;
    }
    return false;
}

// ================== Update / movement ==================
function updatePlayer(dt) {
    if (!player || !player.alive) return;

    // Intent: W/S = forward/back (mz>0 forward), A/D = left/right (mx>0 right)
    let mx = 0, mz = 0;
    if (IS_TOUCH && (Math.abs(joyDX) > 0.05 || Math.abs(joyDY) > 0.05)) {
        mx = joyDX;
        mz = -joyDY;   // joystick up = forward
    } else {
        if (keys['w'] || keys['KeyW'] || keys['arrowup'])    mz += 1;   // W = forward
        if (keys['s'] || keys['KeyS'] || keys['arrowdown'])  mz -= 1;   // S = back
        if (keys['a'] || keys['KeyA'] || keys['arrowleft'])  mx -= 1;   // A = left
        if (keys['d'] || keys['KeyD'] || keys['arrowright']) mx += 1;   // D = right
    }

    const len = Math.hypot(mx, mz);
    player.walking = len > 0.05;
    if (player.walking) {
        tutorialMark('moved');
        mx /= len; mz /= len;

        // Use the ACTUAL camera basis vectors from Three.js — robust against any
        // sign/handedness confusion. Project them to the horizontal (XZ) plane.
        const cRight = new THREE.Vector3();
        const cUp    = new THREE.Vector3();
        const cBack  = new THREE.Vector3();          // points OUT of screen toward viewer
        camera.matrixWorld.extractBasis(cRight, cUp, cBack);
        cRight.y = 0; cRight.normalize();
        const cFwd = new THREE.Vector3(-cBack.x, 0, -cBack.z).normalize();  // forward = -back

        const wx = cFwd.x * mz + cRight.x * mx;
        const wz = cFwd.z * mz + cRight.z * mx;
        const speed = 5.0;
        let nx = player.x + wx * speed * dt;
        let nz = player.z + wz * speed * dt;

        // Clamp to world
        nx = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, nx));
        nz = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, nz));
        // Avoid lake
        if (!inLake(nx, nz)) { player.x = nx; player.z = nz; }

        // Face movement direction
        player.yaw = Math.atan2(wx, wz);
        player.walkPhase += dt * 9;
    } else {
        player.walkPhase *= 0.9;
    }

    player.mesh.position.set(player.x, 0, player.z);
    player.mesh.rotation.y = player.yaw;

    // Animate legs / arms (walk bob)
    const ud = player.mesh.userData;
    if (player.walking) {
        const s = Math.sin(player.walkPhase) * 0.5;
        ud.legL.rotation.x =  s;
        ud.legR.rotation.x = -s;
        ud.armL.rotation.x = -s * 0.7;
        ud.armR.rotation.x =  s * 0.7;
        player.mesh.position.y = Math.abs(Math.sin(player.walkPhase * 0.5)) * 0.06;
    } else {
        ud.legL.rotation.x *= 0.8;
        ud.legR.rotation.x *= 0.8;
        ud.armL.rotation.x *= 0.8;
        ud.armR.rotation.x *= 0.8;
        player.mesh.position.y *= 0.85;
    }

    // Swing axe animation
    if (player.swingT > 0) {
        player.swingT -= dt;
        const k = 1 - (player.swingT / 0.3);
        if (ud.axe) ud.axe.rotation.x = -Math.sin(k * Math.PI) * 1.6;
    } else if (ud.axe) {
        ud.axe.rotation.x *= 0.6;
    }

    // Hunger & HP tick
    player.hunger -= dt * 1.2;
    if (player.hunger < 25) tryEatFood();   // auto-eat from bag when low
    if (player.hunger < 0) {
        player.hunger = 0;
        player.hp -= dt * 4;
    }
    // Slow regen if fed
    if (player.hunger > 60 && player.hp < player.hpMax) player.hp = Math.min(player.hpMax, player.hp + dt * 1.5);

    if (player.hp <= 0) {
        player.hp = 0;
        player.alive = false;
        gameOver();
        return;
    }

    updateHud();
}

function updateTrees(dt) {
    treeRespawnTimer -= dt;
    for (let i = trees.length - 1; i >= 0; i--) {
        const tr = trees[i];
        if (tr.falling) {
            tr.fallT += dt;
            const k = Math.min(1, tr.fallT / 1.0);
            tr.mesh.rotation.x = k * (Math.PI / 2);
            tr.mesh.position.y = -k * 0.3;
            if (tr.fallT > 1.4) {
                scene.remove(tr.mesh);
                trees.splice(i, 1);
            }
        }
    }
    if (treeRespawnTimer <= 0) {
        treeRespawnTimer = 30;
        if (trees.length < 70) {
            const p = randomLandPoint();
            if (p) spawnTree(p.x, p.z);
        }
    }
}

function updateBushes(dt) {
    for (const bush of bushes) {
        if (!bush.ripe) {
            bush.regrow -= dt;
            if (bush.regrow <= 0) {
                bush.ripe = true;
                for (const br of bush.berries) br.visible = true;
            }
        }
    }
}

function updateBones(dt) {
    boneRespawnTimer -= dt;
    if (boneRespawnTimer <= 0) {
        boneRespawnTimer = 25;
        if (boneItems.length < 10) {
            const p = randomLandPoint();
            if (p) spawnBoneItem(p.x, p.z);
        }
    }
}

function updateDog(dt) {
    if (!dog || !player) return;
    const dx = player.x - dog.x, dz = player.z - dog.z;
    const distToPlayer = Math.hypot(dx, dz);

    if (dog.state === 'friendly') {
        // Wander near player
        dog.wanderT -= dt;
        if (dog.wanderT <= 0 || Math.hypot(dog.wanderTX - dog.x, dog.wanderTZ - dog.z) < 0.5) {
            dog.wanderT = 3 + Math.random() * 3;
            dog.wanderTX = player.x + (Math.random() * 2 - 1) * 8;
            dog.wanderTZ = player.z + (Math.random() * 2 - 1) * 8;
        }
        const tx = dog.wanderTX - dog.x;
        const tz = dog.wanderTZ - dog.z;
        const tl = Math.hypot(tx, tz);
        if (tl > 0.1) {
            const speed = 2.0;
            dog.x += (tx / tl) * speed * dt;
            dog.z += (tz / tl) * speed * dt;
            dog.yaw = Math.atan2(tx, tz);
        }
    } else if (dog.state === 'hostile') {
        // Chase & bite player
        if (distToPlayer > 0.5) {
            const speed = 4.0;
            dog.x += (dx / distToPlayer) * speed * dt;
            dog.z += (dz / distToPlayer) * speed * dt;
            dog.yaw = Math.atan2(dx, dz);
        }
        dog.atkCool -= dt;
        if (distToPlayer < 1.4 && dog.atkCool <= 0) {
            dog.atkCool = 1.0;
            player.hp -= 5;
            playBark();
            spawnParticles(player.x, 1.2, player.z, 0xff5555, 5);
        }
    } else if (dog.state === 'ally') {
        // Follow player; attack nearby enemies
        let targetX = null, targetZ = null, targetE = null;
        let bestD = 8;
        for (const e of enemies) {
            const d = Math.hypot(e.x - dog.x, e.z - dog.z);
            if (d < bestD) { bestD = d; targetX = e.x; targetZ = e.z; targetE = e; }
        }
        if (targetE) {
            const tx = targetX - dog.x, tz = targetZ - dog.z;
            const tl = Math.hypot(tx, tz);
            if (tl > 0.8) {
                const speed = 5.0;
                dog.x += (tx / tl) * speed * dt;
                dog.z += (tz / tl) * speed * dt;
                dog.yaw = Math.atan2(tx, tz);
            } else {
                dog.atkCool -= dt;
                if (dog.atkCool <= 0) {
                    dog.atkCool = 0.6;
                    targetE.hp -= 12;
                    targetE.hitFlash = 0.15;
                    playBark();
                    if (targetE.hp <= 0) {
                        killEnemy(targetE, null, false);
                    }
                }
            }
        } else {
            // Follow player
            if (distToPlayer > 3) {
                const speed = 3.5;
                dog.x += (dx / distToPlayer) * speed * dt;
                dog.z += (dz / distToPlayer) * speed * dt;
                dog.yaw = Math.atan2(dx, dz);
            }
        }
        dog.mesh.userData.heart.visible = true;
        dog.mesh.userData.heart.position.y = 1.4 + Math.sin(performance.now() * 0.005) * 0.1;
    }

    dog.x = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, dog.x));
    dog.z = Math.max(-WORLD_HALF + 2, Math.min(WORLD_HALF - 2, dog.z));
    if (inLake(dog.x, dog.z)) {
        // Push out
        const ax = dog.x - LAKE_X, az = dog.z - LAKE_Z;
        const an = Math.hypot(ax, az) || 1;
        dog.x = LAKE_X + (ax / an) * (LAKE_R + 1.5);
        dog.z = LAKE_Z + (az / an) * (LAKE_R + 1.5);
    }

    dog.mesh.position.set(dog.x, 0, dog.z);
    dog.mesh.rotation.y = dog.yaw;

    // Leg wiggle
    const legs = dog.mesh.userData.legs;
    const phase = performance.now() * 0.012;
    legs[0].rotation.x =  Math.sin(phase) * 0.4;
    legs[1].rotation.x = -Math.sin(phase) * 0.4;
    legs[2].rotation.x = -Math.sin(phase) * 0.4;
    legs[3].rotation.x =  Math.sin(phase) * 0.4;
}

// Nearest campfire that an enemy should avoid (returns {x,z} or null)
function nearestCampfireRepel(x, z) {
    let best = null, bestD = 7; // campfire scares within radius 7
    for (const f of campfires) {
        const d = Math.hypot(x - f.x, z - f.z);
        if (d < bestD) { bestD = d; best = f; }
    }
    return best;
}

function updateEnemies(dt) {
    const now = performance.now();
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const t = ENEMY_TYPES[e.type] || ENEMY_TYPES.zombie;
        const dx = player.x - e.x, dz = player.z - e.z;
        const dist = Math.hypot(dx, dz) || 0.001;
        const dirX = dx / dist, dirZ = dz / dist;

        // slow status from traps
        if (e.slowT && e.slowT > 0) e.slowT -= dt;
        const slowMul = (e.slowT && e.slowT > 0) ? 0.4 : 1;

        // base move vector toward player
        let mvx = dirX, mvz = dirZ;
        let speed = t.speed * slowMul;

        if (e.isBoss) {
            // Boss: charge with telegraphed wind-up
            speed = t.speed * 1.2 * slowMul;
            if (e.charge > 0) {
                e.charge -= dt;
                speed = t.speed * 3.0 * slowMul;
            } else if (e.windup > 0) {
                e.windup -= dt;
                speed = 0.2; // pause while winding up
                // flash crown red-ish by bobbing
                if (e.windup <= 0) { e.charge = 0.8; e.chargeDX = dirX; e.chargeDZ = dirZ; playGrowl(); }
            } else {
                e.atkCool -= dt;
                if (dist < 6 && e.atkCool <= 0) {
                    e.atkCool = 3.0;
                    e.windup = 0.7; // telegraph
                }
            }
            if (e.charge > 0) { mvx = e.chargeDX; mvz = e.chargeDZ; }
        } else if (e.type === 'wolf') {
            // Wolf: strafe/circle then lunge
            e.strafeT = (e.strafeT || 0) - dt;
            if (dist > 6) {
                // approach
            } else {
                // circle the player: add perpendicular component
                const perpX = -dirZ, perpZ = dirX;
                const side = (e.circleSide || 1);
                mvx = dirX * 0.5 + perpX * side;
                mvz = dirZ * 0.5 + perpZ * side;
                const ml = Math.hypot(mvx, mvz) || 1; mvx /= ml; mvz /= ml;
                if (e.strafeT <= 0) { e.strafeT = 1.2 + Math.random(); e.circleSide = Math.random() < 0.5 ? 1 : -1; }
                // occasional lunge straight in
                if (dist < 3) { mvx = dirX; mvz = dirZ; speed = t.speed * 1.4; }
            }
        } else if (e.type === 'bear') {
            // Bear: slow approach, charge wind-up
            if (e.windup > 0) {
                e.windup -= dt; speed = 0.15;
                if (e.windup <= 0) { e.charge = 0.7; e.chargeDX = dirX; e.chargeDZ = dirZ; }
            } else if (e.charge > 0) {
                e.charge -= dt; speed = t.speed * 2.6;
                mvx = e.chargeDX; mvz = e.chargeDZ;
            } else if (dist < 7 && Math.random() < 0.012) {
                e.windup = 0.6;
            }
        }
        // zombie: default straight shamble (already mvx/mvz toward player)

        // Campfire avoidance (not boss-immune; boss ignores fire)
        if (!e.isBoss) {
            const fire = nearestCampfireRepel(e.x, e.z);
            if (fire) {
                const ax = e.x - fire.x, az = e.z - fire.z;
                const an = Math.hypot(ax, az) || 1;
                mvx += (ax / an) * 1.6;
                mvz += (az / an) * 1.6;
                const ml = Math.hypot(mvx, mvz) || 1; mvx /= ml; mvz /= ml;
            }
        }

        if (dist > t.range) {
            e.x += mvx * speed * dt;
            e.z += mvz * speed * dt;
            e.yaw = Math.atan2(mvx, mvz);
        } else {
            e.atkCool -= dt;
            if (e.atkCool <= 0 && !e.windup) {
                e.atkCool = e.isBoss ? 1.5 : 1.2;
                const dmg = e.isBoss ? 18 : t.dmg;
                player.hp -= dmg;
                playHit();
                spawnParticles(player.x, 1.2, player.z, 0xff2222, 6);
                updateHud();
            }
        }

        // Trap interaction
        for (const tr of traps) {
            if (!tr.armed) continue;
            if (Math.hypot(e.x - tr.x, e.z - tr.z) < 0.7) {
                tr.armed = false;
                tr.mesh.material.color.setHex(0x772222);
                e.hp -= 25;
                e.slowT = 3;
                e.hitFlash = 0.18;
                playHit();
                spawnParticles(e.x, 0.5, e.z, 0xffaa33, 8);
                if (e.hp <= 0) { killEnemy(e, i, false); break; }
            }
        }
        if (!enemies[i]) continue; // killed by trap

        e.hitFlash -= dt;
        e.mesh.position.set(e.x, 0, e.z);
        e.mesh.rotation.y = e.yaw;
        // wind-up shows as a little crouch/jitter
        const jitter = (e.windup && e.windup > 0) ? Math.sin(now * 0.06) * 0.12 : 0;
        e.mesh.position.y = Math.abs(Math.sin(now * 0.01 + i)) * 0.08 + jitter;
    }

    // Boss health bar update
    if (bossActive) {
        bossFillEl.style.width = Math.max(0, (bossActive.hp / bossActive.maxHp) * 100) + '%';
    }

    nightSpawnTimer -= dt;
    if (isNight && nightSpawnTimer <= 0 && enemies.length < currentLevel.enemyCount * 1.5) {
        nightSpawnTimer = 4;
        const r = Math.random();
        let type;
        if (currentLevel.num >= 3 && r < 0.2) type = 'bear';
        else if (r < 0.45) type = 'wolf';
        else type = 'zombie';
        spawnEnemy(type);
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
            continue;
        }
        p.vy -= 9.8 * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        const a = p.life / p.maxLife;
        p.mesh.scale.setScalar(0.5 + a);
    }
}

function popupText(msg, color) {
    // simple banner reuse
    showNightBanner(msg);
}

// ================== Campfires ==================
function updateCampfires(dt) {
    if (!player) return;
    for (const f of campfires) {
        // flicker
        const fl = 0.9 + Math.sin(performance.now() * 0.02 + f.x) * 0.3;
        if (f.light) f.light.intensity = fl;
        if (f.flame) f.flame.scale.y = 0.9 + Math.sin(performance.now() * 0.03 + f.z) * 0.2;
        // heal & warmth if player near
        if (Math.hypot(player.x - f.x, player.z - f.z) < 4) {
            if (player.hp < player.hpMax) player.hp = Math.min(player.hpMax, player.hp + dt * 3);
        }
    }
}

// ================== Minimap ==================
function updateMinimap() {
    if (!player) return;
    const c = minimapCtx;
    const W = minimapEl.width, H = minimapEl.height;
    const cx = W / 2, cy = H / 2;
    const scale = (W / 2) / WORLD_HALF; // world->map
    c.clearRect(0, 0, W, H);
    // background
    c.fillStyle = isNight ? 'rgba(12,16,40,0.6)' : 'rgba(40,80,40,0.55)';
    c.fillRect(0, 0, W, H);

    function toMap(wx, wz) {
        return { x: cx + (wx - player.x) * scale, y: cy + (wz - player.z) * scale };
    }
    // lake
    const lp = toMap(LAKE_X, LAKE_Z);
    c.fillStyle = 'rgba(74,179,228,0.85)';
    c.beginPath(); c.arc(lp.x, lp.y, LAKE_R * scale, 0, Math.PI * 2); c.fill();
    // buildings
    c.fillStyle = '#caa066';
    for (const b of buildings) {
        const m = toMap(b.x, b.z);
        c.fillRect(m.x - 1.5, m.y - 1.5, 3, 3);
    }
    // campfires
    c.fillStyle = '#ff8a1a';
    for (const f of campfires) { const m = toMap(f.x, f.z); c.beginPath(); c.arc(m.x, m.y, 2, 0, Math.PI*2); c.fill(); }
    // dog
    if (dog) {
        const m = toMap(dog.x, dog.z);
        c.fillStyle = dog.state === 'ally' ? '#66ff99' : '#d2a06a';
        c.beginPath(); c.arc(m.x, m.y, 2.5, 0, Math.PI * 2); c.fill();
    }
    // enemies
    for (const e of enemies) {
        const m = toMap(e.x, e.z);
        c.fillStyle = e.isBoss ? '#ffdd33' : '#ff3333';
        c.beginPath(); c.arc(m.x, m.y, e.isBoss ? 4 : 2.5, 0, Math.PI * 2); c.fill();
    }
    // player arrow (center)
    c.save();
    c.translate(cx, cy);
    c.rotate(-player.yaw);
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.moveTo(0, -5); c.lineTo(4, 4); c.lineTo(-4, 4); c.closePath();
    c.fill();
    c.restore();
    // border ring
    c.strokeStyle = 'rgba(155,255,102,0.5)';
    c.lineWidth = 1;
    c.strokeRect(0.5, 0.5, W - 1, H - 1);
}

// ================== HUD ==================
function updateHud() {
    hpEl.textContent     = Math.round(player.hp);
    hungerEl.textContent = Math.round(player.hunger);
    woodEl.textContent   = player.wood;
    stoneEl.textContent  = player.stone;
    bonesEl.textContent  = player.bones;
    scoreEl.textContent  = score;
    const goal = nextLevelGoal(currentLevel);
    levelEl.textContent = goal !== null ? `${currentLevel.num} (${score}/${goal})` : `${currentLevel.num} 🔥`;
}

// ================== Cleanup ==================
function disposeWorld() {
    if (worldGroup) {
        scene.remove(worldGroup);
        worldGroup = null;
    }
    if (player) { scene.remove(player.mesh); player = null; }
    if (dog)    { scene.remove(dog.mesh);    dog = null; }
    for (const e of enemies) scene.remove(e.mesh);
    enemies = [];
    for (const p of particles) scene.remove(p.mesh);
    particles = [];
    for (const b of buildings) scene.remove(b.mesh);
    buildings = [];
    for (const f of campfires) scene.remove(f.mesh);
    campfires = [];
    for (const t of traps) scene.remove(t.mesh);
    traps = [];
    bossActive = null;
    trees = []; stones = []; bushes = []; boneItems = [];
    if (buildGhostMesh) { scene.remove(buildGhostMesh); buildGhostMesh = null; }
}

// ================== Game loop ==================
function loop(t) {
    if (!running) return;
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    updatePlayer(dt);
    updateTrees(dt);
    updateBushes(dt);
    updateBones(dt);
    updateDog(dt);
    updateEnemies(dt);
    updateParticles(dt);
    updateCampfires(dt);
    if (buildMode) updateBuildGhost();
    updateDayNight(dt);
    updateCamera(dt);
    updateMinimap();

    // auto-save every ~10s
    autoSaveTimer -= dt;
    if (autoSaveTimer <= 0) { autoSaveTimer = 10; saveWorld(); }

    renderer.render(scene, camera);
    rafId = requestAnimationFrame(loop);
}

// ================== Menus ==================
function pickPlayer(name) {
    const clean = (name || '').trim().slice(0, 20);
    if (!clean) return;
    currentPlayer = clean;
    currentPlayerEl.textContent = currentPlayer;
    showCharSelect();
}

function showPlayerSelect() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    disposeWorld();
    currentPlayer = null;
    currentPlayerEl.textContent = '—';
    hpEl.textContent = '100';
    hungerEl.textContent = '100';
    woodEl.textContent = '0';
    stoneEl.textContent = '0';
    bonesEl.textContent = '0';
    scoreEl.textContent = '0';
    levelEl.textContent = '—';
    todEl.textContent = '☀️';
    buildBarEl.style.display = 'none';
    questsEl.style.display = 'none';
    bossBarEl.style.display = 'none';
    tutorialEl.style.display = 'none';
    invPanelEl.classList.remove('show');
    craftPanelEl.classList.remove('show');

    const recent = Object.entries(loadScores())
        .map(([name, v]) => ({ name, lastPlayed: v.lastPlayed || 0 }))
        .sort((a, b) => b.lastPlayed - a.lastPlayed)
        .slice(0, 6);
    const recentHtml = recent.length === 0 ? '' :
        '<p style="margin-bottom:4px;font-size:0.85em">או בחר שחקן קיים:</p>' +
        '<div class="recent-grid">' +
            recent.map(r => `<button class="player-btn" data-player="${r.name}">${r.name}</button>`).join('') +
        '</div>';

    overlay.innerHTML =
        '<h2>🌳 DOX VS NOX 3D</h2>' +
        '<p>שורד את הלילה! מה השם שלך?</p>' +
        '<form class="name-form" id="name-form" autocomplete="off">' +
            '<input class="name-input" id="name-input" type="text" maxlength="20" placeholder="כתוב את השם שלך" />' +
            '<button type="submit" class="primary-btn">המשך ➡️</button>' +
        '</form>' +
        recentHtml +
        leaderboardHtml(null);
    overlay.style.display = 'flex';

    const form  = document.getElementById('name-form');
    const input = document.getElementById('name-input');
    form.addEventListener('submit', e => { e.preventDefault(); pickPlayer(input.value); });
    overlay.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => pickPlayer(btn.dataset.player));
    });

    if (window.matchMedia && !window.matchMedia('(pointer: coarse)').matches) {
        setTimeout(() => input.focus(), 50);
    }
}

function showCharSelect() {
    const save = loadSaveData();
    const canContinue = save && save.player === currentPlayer;
    const continueBtn = canContinue
        ? '<button id="btn-continue" class="primary-btn">▶️ המשך משחק (יום ' + ((save.nightCount || 0) + 1) + ')</button>'
        : '';
    overlay.innerHTML =
        '<h2>🦸 בחר דמות</h2>' +
        `<p>${currentPlayer} — מי אתה היום?</p>` +
        '<div class="char-grid">' +
            Object.entries(CHARS).map(([k, c]) =>
                `<button class="char-btn ${k}${k === currentCharKey ? ' selected' : ''}" data-key="${k}">
                    <span class="char-emoji">${c.emoji}</span>${c.name}
                </button>`
            ).join('') +
        '</div>' +
        '<div class="end-buttons">' +
            continueBtn +
            '<button id="btn-start" class="primary-btn">🌳 משחק חדש!</button>' +
            '<button id="btn-back"  class="secondary-btn">↩️ חזרה</button>' +
        '</div>';
    overlay.style.display = 'flex';

    overlay.querySelectorAll('.char-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentCharKey = btn.dataset.key;
            overlay.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        });
    });
    document.getElementById('btn-start').addEventListener('click', () => start());
    document.getElementById('btn-back').addEventListener('click', showPlayerSelect);
    if (canContinue) {
        document.getElementById('btn-continue').addEventListener('click', () => start(loadSaveData()));
    }
}

function showGameOver() {
    const scores = loadScores();
    const myBest = (scores[currentPlayer] && scores[currentPlayer].best) || 0;
    const isNewRecord = score === myBest && score > 0;
    const sorted = allPlayersSorted();
    const isKing = sorted.length > 0 && sorted[0].name === currentPlayer && sorted[0].best === score && score > 0;
    const lvlReached = getLevelFor(score);

    let headline, msg;
    if (isKing && isNewRecord) {
        headline = '👑 שורד אגדי!';
        msg = `${currentPlayer} שרד ${nightCount} לילות עם ${score} נקודות (${lvlReached.name})! 🌟`;
    } else if (isNewRecord) {
        headline = '🎉 שיא אישי חדש!';
        msg = `${currentPlayer} צבר ${score} נקודות ב-${nightCount} לילות (${lvlReached.name})!`;
    } else if (score >= 60) {
        headline = '🏆 שורד אמיתי!';
        msg = `${currentPlayer} צבר ${score} נקודות (${lvlReached.name}). השיא: ${myBest}`;
    } else {
        headline = '🌳 ניסיון טוב!';
        msg = `${currentPlayer} צבר ${score} נקודות (${lvlReached.name}).<br>השיא שלך: ${myBest}`;
    }

    overlay.innerHTML =
        `<h2>${headline}</h2>` +
        `<p>${msg}</p>` +
        leaderboardHtml(currentPlayer) +
        '<div class="end-buttons">' +
            '<button id="btn-again"  class="primary-btn">🔄 שחק שוב</button>' +
            '<button id="btn-change" class="secondary-btn">👥 שחקן אחר</button>' +
        '</div>';
    overlay.style.display = 'flex';

    document.getElementById('btn-again').addEventListener('click', start);
    document.getElementById('btn-change').addEventListener('click', showPlayerSelect);
}

function gameOver() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    stopMusic();
    playGameOver();
    saveResult(currentPlayer, score);
    clearSave();   // run is over, remove the in-progress save
    questsEl.style.display = 'none';
    bossBarEl.style.display = 'none';
    invPanelEl.classList.remove('show');
    craftPanelEl.classList.remove('show');
    setTimeout(showGameOver, 600);
}

function start(saveData) {
    // saveData may be an Event (from button click) — ignore in that case
    if (saveData && saveData.target) saveData = null;
    if (!currentPlayer) { showPlayerSelect(); return; }
    overlay.style.display = 'none';
    ensureAudio();
    playStart();

    // reset state
    disposeWorld();
    score = 0;
    currentLevel = LEVELS[0];
    dayTime = 0;
    isNight = false;
    nightCount = 0;
    bossSpawnedNight = 0;
    bossActive = null;
    bossBarEl.style.display = 'none';
    buildMode = false;
    invOpen = false; craftOpen = false;
    invPanelEl.classList.remove('show');
    craftPanelEl.classList.remove('show');
    buildBarEl.style.display = 'none';
    document.body.classList.remove('has-build-ghost');
    MUSIC_NOTES = MUSIC_NOTES_DAY;
    BASS_NOTES  = BASS_NOTES_DAY;
    camYaw = 0; camPitch = 0.45;
    // reset missions
    for (const m of MISSIONS) { m.prog = 0; m.done = false; }

    buildWorld();
    spawnPlayer();
    spawnDog();
    camPos.set(0, 5, 10);

    if (saveData) applySave(saveData);

    // show UI
    questsEl.style.display = 'block';
    renderQuests();
    autoSaveTimer = 0;

    if (saveData) {
        tutorialActive = false;
        tutorialEl.style.display = 'none';
    } else {
        startTutorial(false);
    }

    updateHud();

    running = true;
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
    setTimeout(startMusic, 450);
}

function applySave(s) {
    try {
        if (s.charKey && CHARS[s.charKey]) {
            currentCharKey = s.charKey;
            // rebuild player mesh with correct character
            scene.remove(player.mesh);
            player.mesh = buildHumanoid(currentCharKey, 1, true);
            scene.add(player.mesh);
        }
        player.x = s.px || 0; player.z = s.pz || 0; player.yaw = s.yaw || 0;
        player.hp = s.hp != null ? s.hp : 100;
        player.hunger = s.hunger != null ? s.hunger : 100;
        player.wood = s.wood || 0; player.stone = s.stone || 0; player.bones = s.bones || 0;
        player.food = s.food || 0; player.cookedFood = s.cookedFood || 0;
        player.hasBetterAxe = !!s.hasBetterAxe;
        player.mesh.position.set(player.x, 0, player.z);
        player.mesh.rotation.y = player.yaw;

        score = s.score || 0;
        currentLevel = getLevelFor(score);
        dayTime = s.dayTime || 0;
        nightCount = s.nightCount || 0;
        bossSpawnedNight = s.bossSpawnedNight || 0;
        isNight = (dayTime % FULL_CYCLE) >= DAY_LEN;

        if (dog) {
            dog.state = s.dogState || 'friendly';
            dog.x = s.dogX != null ? s.dogX : dog.x;
            dog.z = s.dogZ != null ? s.dogZ : dog.z;
            dog.mesh.position.set(dog.x, 0, dog.z);
            if (dog.state === 'ally') dog.mesh.userData.heart.visible = true;
        }
        // structures
        if (Array.isArray(s.buildings)) {
            for (const b of s.buildings) addBuilding(b.k, b.x, b.z, b.yaw || 0);
        }
        if (Array.isArray(s.campfires)) {
            for (const f of s.campfires) placeCraftedAt('campfire', f.x, f.z);
        }
        if (Array.isArray(s.traps)) {
            for (const tr of s.traps) placeCraftedAt('trap', tr.x, tr.z, tr.armed);
        }
        if (Array.isArray(s.missions)) {
            for (const sm of s.missions) {
                const m = getMission(sm.id);
                if (m) { m.prog = sm.prog || 0; m.done = !!sm.done; }
            }
        }
    } catch (e) {}
}

// place crafted item at an explicit world position (used by save load)
function placeCraftedAt(kind, x, z, armed) {
    if (kind === 'campfire') {
        const g = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.25, 8),
            new THREE.MeshLambertMaterial({ color: 0x555555 }));
        base.position.y = 0.12; g.add(base);
        const flame = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.8, 7),
            new THREE.MeshBasicMaterial({ color: 0xff8a1a }));
        flame.position.y = 0.6; g.add(flame);
        const light = new THREE.PointLight(0xff8a3a, 1.2, 12);
        light.position.y = 0.8; g.add(light);
        g.position.set(x, 0, z);
        scene.add(g);
        campfires.push({ mesh: g, x, z, light, flame });
    } else if (kind === 'trap') {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.1, 10),
            new THREE.MeshLambertMaterial({ color: armed === false ? 0x772222 : 0x444444 }));
        m.position.set(x, 0.06, z);
        scene.add(m);
        traps.push({ mesh: m, x, z, armed: armed !== false });
    }
}

// ================== Mute / resize ==================
document.getElementById('mute').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
});

window.addEventListener('resize', resizeRenderer);
if (window.ResizeObserver) {
    const ro = new ResizeObserver(resizeRenderer);
    ro.observe(wrap);
}

// ================== Boot ==================
initSharedAssets();
initThree();
showPlayerSelect();

// Initial render to show sky behind overlay
function bootRender() {
    renderer.render(scene, camera);
}
bootRender();
</script>
